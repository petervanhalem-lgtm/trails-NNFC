<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Startscherm – NNFC</title>
<style>
:root{
  --bg:#EEF3F5;--sf:#FFFFFF;--sf2:#F7FAFC;--ink:#0E2A3A;--mut:#4D6573;--ac:#0B6E8F;--acink:#FFFFFF;
  --ln:#C3D3DB;--soft:#DDE8ED;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1A22;--sf:#14293A;--sf2:#102230;--ink:#E8F1F5;--mut:#9DB4C1;--ac:#4CC3E6;--acink:#06222E;
    --ln:#2C4558;--soft:#1D3547;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow Semi Condensed',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.35}
.wrap{max-width:1380px;margin:0 auto;padding:14px 18px 60px}

.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px;flex-wrap:wrap;background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:12px 16px}
.top-l{display:flex;align-items:center;gap:12px;min-width:240px;flex:1 1 320px}
.top img{width:48px;height:48px;border-radius:50%;flex:none}
.top h1{font-size:23px;margin:0;font-weight:700;line-height:1.15}
.top .sub{color:var(--mut);font-size:14px}

.top-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.top-r select,.top-r button,.top-r .btn-link{height:40px;min-height:40px;max-height:40px;padding:0 13px;font-size:15px;line-height:1;border-radius:10px;white-space:nowrap;font-family:inherit;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);cursor:pointer}
.top-r select{width:auto;margin:0;font-weight:700}
.top-r button:hover,.top-r .btn-link:hover{background:var(--sf2)}
.top-r .btn-link.active{background:var(--soft);border-color:var(--ac);color:var(--ink)}
.top-sep{width:10px;flex:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-l">
      <img src="nnfc-logo.png" alt="NNFC" onerror="this.style.display='none'">
      <div>
        <h1>Startscherm (<span id="lblJaar">2027</span>)</h1>
        <div class="sub">NNFC Trials</div>
      </div>
    </div>
    <div class="top-r" role="navigation" aria-label="Hoofdnavigatie">
      <select id="selJaar" onchange="wisselJaar()" aria-label="Selecteer wedstrijdjaar"></select>
      <a href="beheer.html" class="btn-link">Beheer / Admin</a>
      <a href="index.html" class="btn-link active" aria-current="page">Startscherm</a>
      <a href="wedstrijdtafel.html" class="btn-link">Wedstrijdtafel</a>
      <a href="banen.html" class="btn-link">Banen / Klokkers</a>
      <span class="top-sep" aria-hidden="true"></span>
      <button type="button" id="btnVervers" onclick="verversNu()">Ververs</button>
    </div>
  </header>
</div>

<script>
function isGeldigJaar(y) {
  return /^20\d{2}$/.test(String(y == null ? '' : y).trim());
}

function bepaalStartJaar() {
  try {
    var params = new URLSearchParams(window.location.search || '');
    var q = params.get('jaar') || params.get('y') || params.get('year');
    if (isGeldigJaar(q)) return String(q).trim();
  } catch (e) {}
  try {
    var k1 = localStorage.getItem('nnfc_jaar');
    if (isGeldigJaar(k1)) return String(k1).trim();
    var k2 = localStorage.getItem('nnfc_actief_jaar');
    if (isGeldigJaar(k2)) return String(k2).trim();
  } catch (e) {}
  return '2027';
}

function bewaarActiefJaar(y, updateUrl) {
  if (!isGeldigJaar(y)) return;
  var s = String(y).trim();
  try {
    localStorage.setItem('nnfc_jaar', s);
    localStorage.setItem('nnfc_actief_jaar', s);
  } catch (e) {}
  if (updateUrl && window.history && window.history.replaceState) {
    try {
      var url = new URL(window.location.href);
      url.searchParams.set('jaar', s);
      window.history.replaceState(window.history.state, '', url.toString());
    } catch (e) {}
  }
}

var selJaarEl = document.getElementById('selJaar');
var standaardJaar = bepaalStartJaar();
for (var y = 2026; y <= 2040; y++) {
  var o = document.createElement('option');
  o.value = String(y);
  o.textContent = 'Jaar ' + y;
  if (String(y) === standaardJaar) o.selected = true;
  selJaarEl.appendChild(o);
}

var jaar = selJaarEl.value;
bewaarActiefJaar(jaar, false);

function zetJaarLabels(yStr) {
  document.getElementById('lblJaar').textContent = yStr;
  document.querySelectorAll('a.btn-link').forEach(function(a) {
    var href = a.getAttribute('href') || '';
    if (href.indexOf('index.html') !== -1) return;
    var basis = href.split('?')[0];
    a.setAttribute('href', basis + '?jaar=' + encodeURIComponent(yStr));
  });
}
zetJaarLabels(jaar);

function wisselJaar() {
  jaar = selJaarEl.value;
  bewaarActiefJaar(jaar, true);
  zetJaarLabels(jaar);
}

function verversNu() {
  jaar = selJaarEl.value;
  bewaarActiefJaar(jaar, true);
  zetJaarLabels(jaar);
}
</script>
</body>
</html>
