<!DOCTYPE html>
<html lang="nl">
<head>

  <title>NNFC Watertrials – Startmenu</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: #0f172a; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

    .section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #64748b; margin: 18px 0 8px 0; font-weight: bold; }
    a.btn { display: block; text-decoration: none; text-align: center; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 1.05rem; margin-bottom: 10px; transition: opacity 0.15s; }
    a.btn:hover { opacity: 0.9; }
    .btn-tafel { background: #2563eb; color: white; }
    .btn-beheer { background: #0d9488; color: white; }
    .grid-banen { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .btn-baan { background: #334155; color: #f8fafc; margin-bottom: 0; }
    .btn-baan-5 { grid-column: span 2; }

</head>

      <a href="baan2.html" class="btn btn-baan">Baan 2</a>
      <a href="baan3.html" class="btn btn-baan">Baan 3</a>
