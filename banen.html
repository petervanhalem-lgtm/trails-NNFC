<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banen / Klokkers – NNFC Waterwerk</title>
<style>
:root{
  --bg:#EEF3F5;--sf:#FFFFFF;--sf2:#F7FAFC;--ink:#0E2A3A;--mut:#4D6573;--ac:#0B6E8F;--acink:#FFFFFF;
  --ok:#1F7A4D;--bad:#B3261E;--ln:#C3D3DB;--soft:#DDE8ED;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1A22;--sf:#14293A;--sf2:#102230;--ink:#E8F1F5;--mut:#9DB4C1;--ac:#4CC3E6;--acink:#06222E;
    --ok:#6FD6A0;--bad:#FF8A80;--ln:#2C4558;--soft:#1D3547;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow Semi Condensed',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.35}
.wrap{max-width:1380px;margin:0 auto;padding:14px 18px 64px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:12px 16px}
.top-l{display:flex;align-items:center;gap:12px}
.top img{width:48px;height:48px;border-radius:50%;flex:none}
h1{font-size:23px;margin:0;font-weight:800;line-height:1.15}
h2{font-size:19px;margin:0;font-weight:700}
h3{font-size:16px;margin:0 0 6px;font-weight:700}
.sub{color:var(--mut);font-size:14px}
button,.btn-link{font:inherit;color:inherit;border:1.5px solid var(--ln);background:var(--sf);border-radius:10px;min-height:40px;padding:6px 13px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover,.btn-link:hover{background:var(--sf2)}
.pri{background:var(--ac)!important;border-color:var(--ac)!important;color:var(--acink)!important}
.sm{min-height:34px;padding:3px 10px;font-size:15px}
.baan-bar{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px;background:var(--sf);border:2px solid var(--ln);border-radius:14px;padding:8px}
@media(max-width:960px){.baan-bar{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.baan-bar{grid-template-columns:repeat(2,1fr)}}
.baan-btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:8px 12px;border-radius:10px;background:var(--sf2)}
.baan-btn .kicker{font-size:11px;font-weight:700;text-transform:uppercase;opacity:.78}
.baan-btn .naam{font-size:16px;font-weight:800}
.baan-btn.on{background:var(--ac)!important;border-color:var(--ac)!important;color:var(--acink)!important}
.box{background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}
.box-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:860px){.grid3{grid-template-columns:1fr}}
.kaart{background:var(--sf2);border:1.5px solid var(--ln);border-radius:12px;padding:12px}
.chip{display:inline-block;background:var(--soft);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.chip-slot{display:inline-block;background:rgba(255,210,63,0.28);color:var(--ink);border:1px solid rgba(180,83,9,0.45);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.warn-box{background:rgba(255,210,63,0.2);border:1.5px solid rgba(180,83,9,0.45);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.table-wrap{overflow-x:auto;border:1.5px solid var(--ln);border-radius:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:left;font-size:15px}
th{background:var(--sf2);color:var(--mut);font-size:14px}
input,select{font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--ln);border-radius:8px;padding:4px 8px;min-height:34px}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ok);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;display:none;z-index:99}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="top-l">
      <img src="nnfc-logo.png" alt="NNFC" onerror="this.style.display='none'">
      <div>
        <h1>Banen / Klokkers (<span id="lblJaar">2026</span>)</h1>
        <div class="sub">Startvolgorde, aanwezigheid, puntenregistratie &amp; 3 bijlagen bij het waterwerkreglement</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select id="selJaar" onchange="wisselJaar()" style="font-weight:700" aria-label="Kies wedstrijdjaar"></select>
      <span id="slotBadge"></span>
      <a id="linkTafel" href="wedstrijdtafel.html" class="btn-link">Wedstrijdtafel →</a>
      <a id="linkBeheer" href="beheer.html" class="btn-link">Beheer / Admin →</a>
      <a id="linkStart" href="index.html" class="btn-link">← Startscherm</a>
    </div>
  </div>

  <div class="baan-bar" role="tablist" aria-label="Baanselectie">
    <button type="button" id="baanBtnALLE" class="baan-btn on" onclick="kiesBaan('ALLE')">
      <span class="kicker">Totaal</span><span class="naam">Alle 5 Banen</span>
    </button>
    <button type="button" id="baanBtn1" class="baan-btn" onclick="kiesBaan('1')">
      <span class="kicker">Baan 1</span><span id="lblBaan1" class="naam">Open</span>
    </button>
    <button type="button" id="baanBtn2" class="baan-btn" onclick="kiesBaan('2')">
      <span class="kicker">Baan 2</span><span id="lblBaan2" class="naam">Jeugd</span>
    </button>
    <button type="button" id="baanBtn3" class="baan-btn" onclick="kiesBaan('3')">
      <span class="kicker">Baan 3</span><span id="lblBaan3" class="naam">Veteranen</span>
    </button>
    <button type="button" id="baanBtn4" class="baan-btn" onclick="kiesBaan('4')">
      <span class="kicker">Baan 4</span><span id="lblBaan4" class="naam">Stamboomloos</span>
    </button>
    <button type="button" id="baanBtn5" class="baan-btn" onclick="kiesBaan('5')">
      <span class="kicker">Baan 5</span><span id="lblBaan5" class="naam">Specials</span>
    </button>
  </div>

  <div id="banenLockBanner"></div>
  <div id="banenInhoud"></div>
</div>

<div id="toast" class="toast">Opgeslagen</div>

<script>
function esc(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function isGeldigJaar(y) {
  return /^20\d{2}$/.test(String(y == null ? '' : y).trim());
}

function toonToast(msg) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg || 'Opgeslagen';
  el.style.display = 'block';
  clearTimeout(window._banenToast);
  window._banenToast = setTimeout(function() { el.style.display = 'none'; }, 1800);
}

function leesStartJaar() {
  try {
    var u = new URLSearchParams(window.location.search || '');
    var q = u.get('jaar') || u.get('y') || u.get('year');
    if (isGeldigJaar(q)) return String(q).trim();
  } catch (e) {}
  try {
    var a = localStorage.getItem('nnfc_jaar') || localStorage.getItem('nnfc_actief_jaar');
    if (isGeldigJaar(a)) return String(a).trim();
  } catch (e) {}
  return '2026';
}

function bewaarJaar(y, updateUrl) {
  if (!isGeldigJaar(y)) return;
  var s = String(y).trim();
  try {
    localStorage.setItem('nnfc_jaar', s);
    localStorage.setItem('nnfc_actief_jaar', s);
  } catch (e) {}
  if (updateUrl && window.history && window.history.replaceState) {
    try {
      var url = new URL(window.location.href);
      url.searchParams.set('jaar', s);
      window.history.replaceState(window.history.state, '', url.toString());
    } catch (e) {}
  }
}

var selJaarEl = document.getElementById('selJaar');
var jaar = leesStartJaar();
bewaarJaar(jaar, false);

for (var y = 2026; y <= 2040; y++) {
  var opt = document.createElement('option');
  opt.value = String(y);
  opt.textContent = 'Jaar ' + y;
  selJaarEl.appendChild(opt);
}
if (!Array.from(selJaarEl.options).some(function(o) { return o.value === jaar; })) {
  var extra = document.createElement('option');
  extra.value = jaar;
  extra.textContent = 'Jaar ' + jaar;
  selJaarEl.appendChild(extra);
}
selJaarEl.value = jaar;

var actieveBaan = 'ALLE';
var deelnemers = [];
var klokkersData = {};
var baanIndeling = {
  banen: { "1": ["Open"], "2": ["Jeugd"], "3": ["Veteranen"], "4": ["Stamboomloos"], "5": ["Specials"] },
  bijlagen: { b1: "", b2: "", b3: "" }
};
var jaarVergrendeld = false;

function isJaarVergrendeld() {
  return !!jaarVergrendeld;
}

function waarschuwVergrendeld() {
  if (isJaarVergrendeld()) {
    alert('Wedstrijdjaar ' + jaar + ' is vergrendeld en alleen-lezen.');
    return true;
  }
  return false;
}

function pasBanenLockToe() {
  var bannerEl = document.getElementById('banenLockBanner');
  var badgeEl = document.getElementById('slotBadge');
  if (badgeEl) {
    badgeEl.innerHTML = isJaarVergrendeld()
      ? '<span class="chip-slot">🔒 Jaar ' + esc(jaar) + ' vergrendeld</span>'
      : '<span class="chip">Jaar ' + esc(jaar) + ' open</span>';
  }
  if (bannerEl) {
    bannerEl.innerHTML = isJaarVergrendeld()
      ? '<div class="warn-box"><b>🔒 Wedstrijdjaar ' + esc(jaar) + ' is afgesloten en vergrendeld (alleen-lezen)</b><div class="sub">Aanwezigheid en punten van dit jaar kunnen niet worden aangepast zolang het slot actief is.</div></div>'
      : '';
  }
  var inhoudEl = document.getElementById('banenInhoud');
  if (!inhoudEl) return;
  if (isJaarVergrendeld()) {
    inhoudEl.querySelectorAll('input,select').forEach(function(el) { el.disabled = true; });
  }
}

function laadJaarData() {
  try { deelnemers = JSON.parse(localStorage.getItem('nnfc_deelnemers_' + jaar)) || []; } catch (e) { deelnemers = []; }
  try { klokkersData = JSON.parse(localStorage.getItem('nnfc_klokkers_' + jaar)) || {}; } catch (e) { klokkersData = {}; }
  baanIndeling = {
    banen: { "1": ["Open"], "2": ["Jeugd"], "3": ["Veteranen"], "4": ["Stamboomloos"], "5": ["Specials"] },
    bijlagen: { b1: "", b2: "", b3: "" }
  };
  try {
    var b = JSON.parse(localStorage.getItem('nnfc_baanindeling_' + jaar));
    if (b && b.banen) {
      baanIndeling = {
        banen: Object.assign({ "1": [], "2": [], "3": [], "4": [], "5": [] }, b.banen),
        bijlagen: Object.assign({ b1: "", b2: "", b3: "" }, b.bijlagen || {})
      };
    }
  } catch (e) {}

  try {
    var s = JSON.parse(localStorage.getItem('nnfc_slot_' + jaar));
    jaarVergrendeld = (s && typeof s.vergrendeld === 'boolean') ? s.vergrendeld : (jaar === '2026');
  } catch (e) {
    jaarVergrendeld = (jaar === '2026');
  }
}

function bewaarJaarData(msg) {
  try {
    localStorage.setItem('nnfc_deelnemers_' + jaar, JSON.stringify(deelnemers));
    localStorage.setItem('nnfc_klokkers_' + jaar, JSON.stringify(klokkersData));
  } catch (e) {}
  render();
  if (msg) toonToast(msg);
}

function werkNavLinksBij() {
  var q = '?jaar=' + encodeURIComponent(jaar);
  document.getElementById('linkTafel').href = 'wedstrijdtafel.html' + q;
  document.getElementById('linkBeheer').href = 'beheer.html' + q;
  document.getElementById('linkStart').href = 'index.html' + q;
}

function wisselJaar() {
  var gekozen = selJaarEl.value;
  if (!isGeldigJaar(gekozen)) return;
  jaar = gekozen;
  bewaarJaar(jaar, true);
  laadJaarData();
  render();
}

function kiesBaan(b) {
  actieveBaan = b;
  render();
}

function toggleAanwezig(id, checked) {
  if (waarschuwVergrendeld()) { render(); return; }
  var h = deelnemers.find(function(x) { return x.id === id; });
  if (!h) return;
  h.aanwezig = !!checked;
  bewaarJaarData('Aanwezigheid bijgewerkt');
}

function slaPuntenOp(id, waarde) {
  if (waarschuwVergrendeld()) { render(); return; }
  var num = parseFloat(String(waarde).replace(',', '.'));
  klokkersData[id] = Object.assign({}, klokkersData[id] || {}, {
    punten: isNaN(num) ? '' : num,
    bijgewerktOp: new Date().toISOString()
  });
  bewaarJaarData('Punten opgeslagen');
}

function render() {
  selJaarEl.value = jaar;
  document.getElementById('lblJaar').textContent = jaar;
  werkNavLinksBij();

  ['ALLE', '1', '2', '3', '4', '5'].forEach(function(b) {
    var btn = document.getElementById('baanBtn' + b);
    if (btn) btn.classList.toggle('on', actieveBaan === b);
    if (b !== 'ALLE') {
      var lbl = document.getElementById('lblBaan' + b);
      var klassen = (baanIndeling.banen && baanIndeling.banen[b]) || [];
      if (lbl) lbl.textContent = klassen.length ? klassen.join(' / ') : 'Baan ' + b;
    }
  });

  var gefilterd = deelnemers
    .filter(function(h) { return actieveBaan === 'ALLE' || String(h.baan) === actieveBaan; })
    .sort(function(a, b) { return (a.startnummer || 0) - (b.startnummer || 0); });

  var rijen = gefilterd.map(function(h) {
    var score = (klokkersData[h.id] && klokkersData[h.id].punten !== undefined) ? klokkersData[h.id].punten : '';
    return '<tr>' +
      '<td><b>#' + esc(h.startnummer) + '</b></td>' +
      '<td><b>' + esc(h.roepnaam) + '</b> <span class="sub">(' + esc(h.stamboom || '') + ')</span></td>' +
      '<td>' + esc(h.eigenaar || '') + '</td>' +
      '<td><span class="chip">' + esc(h.klasse || 'Open') + '</span></td>' +
      '<td><span class="chip">Baan ' + esc(h.baan || '1') + '</span></td>' +
      '<td><input type="checkbox" ' + (h.aanwezig ? 'checked' : '') + ' onchange="toggleAanwezig(\'' + esc(h.id) + '\',this.checked)"></td>' +
      '<td><input type="number" step="0.5" value="' + esc(score) + '" style="width:92px" onchange="slaPuntenOp(\'' + esc(h.id) + '\',this.value)"></td>' +
      '<td><a href="klokker.html?baan=' + encodeURIComponent(h.baan || '1') + '&jaar=' + encodeURIComponent(jaar) + '" class="btn-link sm">Klokker B' + esc(h.baan || '1') + '</a></td>' +
      '</tr>';
  }).join('');

  var b = baanIndeling.bijlagen || {};
  document.getElementById('banenInhoud').innerHTML =
    '<div class="box">' +
      '<div class="box-head"><div><h2>Startlijst &amp; Registratie (' + esc(jaar) + ')</h2><div class="sub">' + gefilterd.length + ' deelnemer(s) in weergave</div></div></div>' +
      '<div class="table-wrap"><table><thead><tr><th>Nr</th><th>Hond</th><th>Eigenaar</th><th>Klasse</th><th>Baan</th><th>Aanwezig</th><th>Punten</th><th>Klokker</th></tr></thead><tbody>' +
      (rijen || '<tr><td colspan="8" class="sub" style="padding:14px">Geen deelnemers gevonden voor ' + esc(jaar) + '.</td></tr>') +
      '</tbody></table></div>' +
    '</div>' +
    '<div class="box">' +
      '<h2>3 Bijlagen Waterwerkreglement (' + esc(jaar) + ')</h2>' +
      '<div class="grid3" style="margin-top:10px">' +
        '<div class="kaart"><h3>Bijlage 1</h3><div class="sub">' + (b.b1 ? esc(b.b1) : 'Nog geen tekst ingevuld in Beheer.') + '</div></div>' +
        '<div class="kaart"><h3>Bijlage 2</h3><div class="sub">' + (b.b2 ? esc(b.b2) : 'Nog geen tekst ingevuld in Beheer.') + '</div></div>' +
        '<div class="kaart"><h3>Bijlage 3</h3><div class="sub">' + (b.b3 ? esc(b.b3) : 'Nog geen tekst ingevuld in Beheer.') + '</div></div>' +
      '</div>' +
    '</div>';

  pasBanenLockToe();
}

window.addEventListener('pageshow', function() {
  jaar = leesStartJaar();
  bewaarJaar(jaar, false);
  laadJaarData();
  render();
});

laadJaarData();
render();
</script>
</body>
</html>
