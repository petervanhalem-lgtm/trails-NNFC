<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banen / Klokkers – NNFC</title>
<style>
:root{
  --bg:#EEF3F5;--sf:#FFFFFF;--sf2:#F7FAFC;--ink:#0E2A3A;--mut:#4D6573;--ac:#0B6E8F;--acink:#FFFFFF;
  --cur:#FFD23F;--curink:#1B1500;--bad:#B3261E;--ok:#1F7A4D;--ln:#C3D3DB;--soft:#DDE8ED;--warn:#B45309;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1A22;--sf:#14293A;--sf2:#102230;--ink:#E8F1F5;--mut:#9DB4C1;--ac:#4CC3E6;--acink:#06222E;
    --cur:#FFD23F;--curink:#1B1500;--bad:#FF8A80;--ok:#6FD6A0;--ln:#2C4558;--soft:#1D3547;--warn:#FBBF6A;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow Semi Condensed',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.35}
.wrap{max-width:1380px;margin:0 auto;padding:14px 18px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:12px 16px}
.top-l{display:flex;align-items:center;gap:12px}
.top img{width:48px;height:48px;border-radius:50%;flex:none}
h1{font-size:23px;margin:0;font-weight:700;line-height:1.15}
h2{font-size:19px;margin:0;font-weight:700}
h3{font-size:16px;margin:0 0 6px;font-weight:700}
.sub{color:var(--mut);font-size:14px}
button,.btn-link{font:inherit;color:inherit;border:1.5px solid var(--ln);background:var(--sf);border-radius:10px;min-height:42px;padding:6px 14px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .12s,border-color .12s}
button:hover,.btn-link:hover{background:var(--sf2)}
.pri{background:var(--ac)!important;border-color:var(--ac)!important;color:var(--acink)!important}
.ok{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important}
.warn{background:var(--cur)!important;border-color:var(--cur)!important;color:var(--curink)!important}
.bad{border-color:var(--bad)!important;color:var(--bad)!important;min-height:36px;padding:4px 10px}
.sm{min-height:36px;padding:4px 10px;font-size:15px}

/* Baankiezer (Alle 5 Banen + Baan 1-5) */
.baan-nav{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px;background:var(--sf);border:2px solid var(--ln);border-radius:14px;padding:8px}
@media(max-width:1080px){.baan-nav{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.baan-nav{grid-template-columns:repeat(2,1fr)}}
.baan-btn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;padding:8px 12px;border-radius:10px;background:var(--sf2);min-height:58px}
.baan-btn .nr{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
.baan-btn .ttl{font-size:15px;font-weight:700;line-height:1.2}
.baan-btn.on{background:var(--ac)!important;border-color:var(--ac)!important;color:var(--acink)!important}

/* Vaste terug- en ankerbalk voor sub- en sub-subpagina's */
.crumb-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--sf);border:2px solid var(--ac);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.crumb-trail{font-size:14px;color:var(--mut);font-weight:600}
.crumb-trail b{color:var(--ink)}
.crumb-acts{display:flex;gap:8px;flex-wrap:wrap}

.box{background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}
.box-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:1100px){.grid5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
@media(max-width:620px){.grid5{grid-template-columns:1fr}}

.kaart{background:var(--sf2);border:1.5px solid var(--ln);border-radius:12px;padding:12px}
.kaart-click{cursor:pointer;transition:border-color .12s}
.kaart-click:hover{border-color:var(--ac)}

label{display:block;font-weight:600;font-size:14px;margin-bottom:3px;color:var(--mut)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--ln);border-radius:10px;padding:7px 10px;width:100%;margin-bottom:9px;min-height:42px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.search-wrap{flex:1;min-width:240px;display:flex;gap:6px;align-items:center}
.search-wrap input{margin-bottom:0;border-color:var(--ac)}
.stats-pill{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--mut);background:var(--sf2);padding:8px 12px;border-radius:10px;border:1px solid var(--ln);margin-bottom:12px}

.klok-display{font-variant-numeric:tabular-nums;font-size:38px;font-weight:800;letter-spacing:.03em;padding:8px 14px;border-radius:12px;background:var(--sf);border:2px solid var(--ln);display:inline-block;min-width:170px;text-align:center}
.klok-running{border-color:var(--ok);color:var(--ok)}

.table-wrap{overflow-x:auto;max-height:66vh;border:1.5px solid var(--ln);border-radius:12px}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;z-index:2;background:var(--sf2);color:var(--mut);font-weight:700;font-size:14px;text-align:left;padding:9px 10px;border-bottom:2px solid var(--ln);white-space:nowrap}
tbody td{padding:8px 10px;border-bottom:1px solid var(--ln);font-size:15px;vertical-align:middle}
tbody tr:nth-child(even){background:var(--sf2)}
tbody tr:hover{background:var(--soft)}
tbody tr.rij-nu{background:rgba(255,210,63,0.22)!important}

.chip{display:inline-block;background:var(--soft);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.chip-ok{display:inline-block;background:rgba(31,122,77,0.15);color:var(--ok);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.chip-warn{display:inline-block;background:rgba(179,38,30,0.14);color:var(--bad);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.chip-nu{display:inline-block;background:var(--cur);color:var(--curink);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:800}
.hond-main{font-weight:700;font-size:16px}
.hond-sub{color:var(--mut);font-size:13px}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ok);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.22);z-index:99;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="top-l">
      <img src="nnfc-logo.png" alt="NNFC" onerror="this.style.display='none'">
      <div>
        <h1>Banen / Klokkers (<span id="lblJaar">2026</span>)</h1>
        <div class="sub">Startvolgorde, baanoverzicht, oefeningen, 3 bijlagen &amp; directe toegang tot het klokkersscherm</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select id="selJaar" onchange="wisselJaar()" style="width:auto;margin:0;font-weight:700" aria-label="Selecteer wedstrijdjaar"></select>
      <a href="wedstrijdtafel.html" class="btn-link">Wedstrijdtafel →</a>
      <a href="beheer.html" class="btn-link">Beheer / Admin →</a>
      <a href="index.html" class="btn-link">← Startscherm</a>
    </div>
  </div>

  <!-- HOOFDNAVIGATIE: OVERZICHT + BAAN 1-5 -->
  <div class="baan-nav" role="navigation" aria-label="Banen en klokkers navigatie">
    <button type="button" id="baanTab0" class="baan-btn on" onclick="gaNaarOverzicht()">
      <span class="nr">Totaal</span>
      <span class="ttl">Alle 5 Banen</span>
    </button>
    <button type="button" id="baanTab1" class="baan-btn" onclick="openBaan('1')">
      <span class="nr">Baan 1</span>
      <span class="ttl" id="lblBaan1">Open</span>
    </button>
    <button type="button" id="baanTab2" class="baan-btn" onclick="openBaan('2')">
      <span class="nr">Baan 2</span>
      <span class="ttl" id="lblBaan2">Jeugd</span>
    </button>
    <button type="button" id="baanTab3" class="baan-btn" onclick="openBaan('3')">
      <span class="nr">Baan 3</span>
      <span class="ttl" id="lblBaan3">Veteranen</span>
    </button>
    <button type="button" id="baanTab4" class="baan-btn" onclick="openBaan('4')">
      <span class="nr">Baan 4</span>
      <span class="ttl" id="lblBaan4">Stamboomloos</span>
    </button>
    <button type="button" id="baanTab5" class="baan-btn" onclick="openBaan('5')">
      <span class="nr">Baan 5</span>
      <span class="ttl" id="lblBaan5">Specials</span>
    </button>
  </div>

  <!-- VASTE ANKERBALK BIJ SUB- EN SUB-SUBPAGINA'S (TERUG & WEDSTRIJDTAFEL) -->
  <div id="crumbBar" class="crumb-bar" style="display:none">
    <div id="crumbTrail" class="crumb-trail"></div>
    <div class="crumb-acts">
      <button type="button" class="sm" onclick="gaTerug()">← Terug</button>
      <a href="wedstrijdtafel.html" class="btn-link pri sm">Wedstrijdtafel</a>
    </div>
  </div>

  <div id="appContent"></div>
  <div id="klokkerAppGenerator" class="box" style="margin-top:16px"></div>
</div>

<div id="toast" class="toast">Opgeslagen</div>

<script src="config.js" onerror="window._cfgErr=1"></script>
<script src="nnfc-jaar-nav.js" onerror="window._navErr=1"></script>
<script>
function nnfcBaanPincode(jaarWaarde, baanNr) {
  var j = String(jaarWaarde || '2026').trim();
  var b = String(baanNr || '1').replace(/[^1-5]/g, '') || '1';
  var invoer = 'NNFC-KLOKKER-' + j + '-BAAN-' + b;
  var hash = 2166136261;
  for (var i = 0; i < invoer.length; i++) {
    hash ^= invoer.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  var vierCijfers = (Math.abs(hash >>> 0) % 9000) + 1000;
  return String(vierCijfers);
}

function nnfcMaakKlokkerLink(baanNr, jaarWaarde) {
  var j = String(jaarWaarde || '2026').trim();
  var b = String(baanNr || '1').replace(/[^1-5]/g, '') || '1';
  var pin = nnfcBaanPincode(j, b);
  var isHttp = /^https?:/i.test(window.location.protocol);
  var basis = isHttp
    ? (window.location.origin + window.location.pathname.replace(/[^/]*$/, '') + 'klokker.html')
    : 'https://petervanhalem-lgtm.github.io/trails-NNFC/klokker.html';
  return basis + '?baan=' + encodeURIComponent(b) + '&jaar=' + encodeURIComponent(j) + '&pin=' + encodeURIComponent(pin);
}

function renderKlokkerAppGenerator() {
  var host = document.getElementById('klokkerAppGenerator');
  if (!host) return;
  var gekozenBaan = (nav && nav.baan && nav.baan !== 'ALLE') ? String(nav.baan) : '1';
  var pin = nnfcBaanPincode(jaar, gekozenBaan);
  var link = nnfcMaakKlokkerLink(gekozenBaan, jaar);
  var bericht = 'NNFC Klokkersscherm – Jaar ' + jaar + ', Baan ' + gekozenBaan + '\nLink: ' + link + '\nPincode: ' + pin;
  var waUrl = 'https://wa.me/?text=' + encodeURIComponent(bericht);

  host.innerHTML =
    '<div class="box-head">' +
      '<div>' +
        '<h2>Klokker-link &amp; pincode appen (' + esc(jaar) + ')</h2>' +
        '<div class="sub">Elke baan krijgt elk wedstrijdjaar automatisch een eigen 4-cijferige pincode. De wedstrijdtafel ziet deze codes ook altijd.</div>' +
      '</div>' +
      '<span class="chip">Pincode Baan ' + esc(gekozenBaan) + ': ' + esc(pin) + '</span>' +
    '</div>' +
    '<div class="grid2" style="align-items:end">' +
      '<div>' +
        '<label for="genBaanSel">Kies baan (1–5)</label>' +
        '<select id="genBaanSel" style="margin-bottom:0" onchange="nav.baan=this.value;render()">' +
          ['1','2','3','4','5'].map(function(b) {
            return '<option value="' + b + '" ' + (gekozenBaan === b ? 'selected' : '') + '>Baan ' + b + ' (PIN ' + nnfcBaanPincode(jaar, b) + ')</option>';
          }).join('') +
        '</select>' +
      '</div>' +
      '<div>' +
        '<label for="genLinkInput">Klokkerslink voor Baan ' + esc(gekozenBaan) + ' (' + esc(jaar) + ')</label>' +
        '<input id="genLinkInput" type="text" readonly value="' + esc(link) + '" style="margin-bottom:0">' +
      '</div>' +
    '</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">' +
      '<button type="button" class="pri sm" onclick="kopieerKlokkerLink(\'' + esc(gekozenBaan) + '\')">Kopieer link + pincode</button>' +
      '<a href="' + esc(waUrl) + '" target="_blank" rel="noopener" class="btn-link ok sm">App naar klokker (WhatsApp) →</a>' +
      '<a href="klokker.html?baan=' + encodeURIComponent(gekozenBaan) + '&jaar=' + encodeURIComponent(jaar) + '&pin=' + encodeURIComponent(pin) + '" class="btn-link sm">Open klokker.html →</a>' +
    '</div>';
}

function kopieerKlokkerLink(bNr) {
  var link = nnfcMaakKlokkerLink(bNr, jaar);
  var pin = nnfcBaanPincode(jaar, bNr);
  var tekst = link + ' (Pincode Baan ' + bNr + ' / ' + jaar + ': ' + pin + ')';
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(tekst).then(function() {
      toonToast('Link + pincode Baan ' + bNr + ' gekopieerd');
    }).catch(function() {
      prompt('Kopieer link en pincode:', tekst);
    });
  } else {
    prompt('Kopieer link en pincode:', tekst);
  }
}

var db = null;
function koppelBanenLiveListeners() {
  if (!db) return;
  try {
    db.ref('wedstrijd/banen_status_' + jaar).off();
    db.ref('wedstrijd/banen_status_' + jaar).on('value', function(snap) {
      var val = snap.val() || {};
      var nieuw = {};
      Object.keys(val).forEach(function(k) {
        var st = val[k];
        if (!st) return;
        var m = String(k).match(/(\d+)$/);
        var bKey = m ? m[1] : String(st.baan || k);
        nieuw[bKey] = st;
      });
      banenLiveStatus = nieuw;
      if (typeof render === 'function') render();
    });

    db.ref('wedstrijd/registraties_' + jaar).off();
    db.ref('wedstrijd/registraties_' + jaar).on('value', function(snap) {
      var val = snap.val() || {};
      klokkerRegs = Object.keys(val).map(function(k) { return val[k]; }).filter(Boolean);
      if (typeof render === 'function') render();
    });
  } catch (e) {}
}

function initFirebase() {
  try {
    if (typeof firebase !== 'undefined' && typeof firebaseConfig !== 'undefined' && firebaseConfig.apiKey && firebaseConfig.apiKey !== "JOUW_API_KEY") {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      koppelBanenLiveListeners();
    }
  } catch (e) {}
}
initFirebase();

function esc(str) {
  return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function toonToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg || 'Opgeslagen';
  el.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function() { el.style.display = 'none'; }, 1800);
}

var selJaarEl = document.getElementById('selJaar');
var params = new URLSearchParams(window.location.search);
var urlJaar = (window.NNFCJaarNav && window.NNFCJaarNav.bepaalStartJaar) ? window.NNFCJaarNav.bepaalStartJaar('2026') : params.get('jaar');
var huidigKalenderJaar = new Date().getFullYear();
var standaardJaar = (urlJaar && /^20\d{2}$/.test(urlJaar))
  ? urlJaar
  : ((huidigKalenderJaar >= 2026 && huidigKalenderJaar <= 2040) ? String(huidigKalenderJaar) : '2026');
for (var y = 2026; y <= 2040; y++) {
  var o = document.createElement('option');
  o.value = String(y);
  o.textContent = 'Jaar ' + y;
  if (String(y) === standaardJaar) o.selected = true;
  selJaarEl.appendChild(o);
}

if (!selJaarEl.value && selJaarEl.options.length) selJaarEl.value = standaardJaar;
var jaar = selJaarEl.value || standaardJaar;
if (window.NNFCJaarNav && typeof window.NNFCJaarNav.zetActiefJaar === 'function') {
  jaar = window.NNFCJaarNav.zetActiefJaar(jaar, { persist: true, updateUrl: false }) || jaar;
}
document.getElementById('lblJaar').textContent = jaar;

var deelnemers = [];
var baanIndeling = { banen: { "1": ["Open"], "2": ["Jeugd"], "3": ["Veteranen"], "4": ["Stamboomloos"], "5": ["Specials"] }, bijlagen: { b1: "", b2: "", b3: "" } };
var tafelData = {};
var klokData = {};
var banenLiveStatus = {};
var klokkerRegs = [];

var nav = {
  baan: 'ALLE',
  sub: null,
  subLabel: '',
  subSub: null,
  subSubLabel: '',
  zoek: '',
  alleenAanwezig: false
};

function laadData() {
  try { deelnemers = JSON.parse(localStorage.getItem('nnfc_deelnemers_' + jaar)) || []; } catch (e) { deelnemers = []; }
  baanIndeling = { banen: { "1": ["Open"], "2": ["Jeugd"], "3": ["Veteranen"], "4": ["Stamboomloos"], "5": ["Specials"] }, bijlagen: { b1: "", b2: "", b3: "" } };
  try {
    var b = JSON.parse(localStorage.getItem('nnfc_baanindeling_' + jaar));
    if (b && b.banen) {
      baanIndeling = {
        banen: Object.assign({ "1": [], "2": [], "3": [], "4": [], "5": [] }, b.banen),
        bijlagen: Object.assign({ b1: "", b2: "", b3: "" }, b.bijlagen || {})
      };
    }
  } catch (e) {}
  try { tafelData = JSON.parse(localStorage.getItem('nnfc_tafel_' + jaar)) || {}; } catch (e) { tafelData = {}; }
  try { klokData = JSON.parse(localStorage.getItem('nnfc_klokkers_' + jaar)) || {}; } catch (e) { klokData = {}; }

  deelnemers.forEach(function(h) {
    if (!tafelData[h.id]) {
      tafelData[h.id] = { basisPunten: '', basisStatus: 'Open', brevetUitslag: 'Nog niet gezwommen', brevetOpmerking: '', rtKandidaat: false, rtRang: '', beker: '' };
    }
    if (!klokData[h.id]) {
      klokData[h.id] = { tijdStr: '', oef1: '', oef2: '', oef3: '', oef4: '', opmerking: '' };
    }
  });

  ['1','2','3','4','5'].forEach(function(b) {
    var el = document.getElementById('lblBaan' + b);
    var kl = (baanIndeling.banen && baanIndeling.banen[b]) || [];
    if (el) el.textContent = kl.length ? kl.join(', ') : 'Vrij';
  });
}
laadData();

function bewaarAlles(toastMsg) {
  localStorage.setItem('nnfc_tafel_' + jaar, JSON.stringify(tafelData));
  localStorage.setItem('nnfc_klokkers_' + jaar, JSON.stringify(klokData));
  if (db) {
    try {
      db.ref('wedstrijd/tafel_status_' + jaar).set(tafelData);
      db.ref('wedstrijd/klokkers_' + jaar).set(klokData);
    } catch (e) {}
  }
  render();
  if (toastMsg) toonToast(toastMsg);
}

function wisselJaar() {
  var gekozen = selJaarEl.value;
  if (window.NNFCJaarNav && typeof window.NNFCJaarNav.zetActiefJaar === 'function') {
    jaar = window.NNFCJaarNav.zetActiefJaar(gekozen, { persist: true, updateUrl: true }) || gekozen;
  } else {
    jaar = gekozen;
  }
  selJaarEl.value = jaar;
  document.getElementById('lblJaar').textContent = jaar;
  banenLiveStatus = {};
  klokkerRegs = [];
  laadData();
  koppelBanenLiveListeners();
  render();
}

function gaNaarOverzicht() {
  nav.baan = 'ALLE';
  nav.sub = null;
  nav.subLabel = '';
  nav.subSub = null;
  nav.subSubLabel = '';
  render();
}

function openBaan(bNr) {
  nav.baan = String(bNr);
  nav.sub = null;
  nav.subLabel = '';
  nav.subSub = null;
  nav.subSubLabel = '';
  render();
}

function openSub(subId, label) {
  nav.sub = subId;
  nav.subLabel = label;
  nav.subSub = null;
  nav.subSubLabel = '';
  render();
}

function openSubSub(subSubId, label) {
  nav.subSub = subSubId;
  nav.subSubLabel = label;
  render();
}

function gaTerug() {
  if (nav.subSub) {
    nav.subSub = null;
    nav.subSubLabel = '';
  } else if (nav.sub) {
    nav.sub = null;
    nav.subLabel = '';
  } else if (nav.baan !== 'ALLE') {
    nav.baan = 'ALLE';
  }
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

  });

  var trail = document.getElementById('crumbTrail');

    bar.style.display = 'none';

  }
  bar.style.display = 'flex';
  var delen = ['<button type="button" class="sm" style="min-height:28px;padding:2px 8px;font-size:13px" onclick="gaNaarOverzicht()">Alle 5 Banen</button>'];
  if (nav.baan !== 'ALLE') {

      delen.push('<button type="button" class="sm" style="min-height:28px;padding:2px 8px;font-size:13px" onclick="openBaan(\'' + esc(nav.baan) + '\')">' + esc(bLabel) + '</button>');

function updateOefening(hondId, veld, waarde) {
  if (waarschuwVergrendeld()) return;
  if (!klokData[hondId]) klokData[hondId] = {};
  klokData[hondId][veld] = waarde;
  var kd = klokData[hondId];
  var vals = [kd.oef1, kd.oef2, kd.oef3, kd.oef4].filter(function(v) { return v !== '' && v != null && !isNaN(parseFloat(String(v).replace(',', '.'))); });
  if (vals.length > 0) {
    var som = vals.reduce(function(acc, v) { return acc + parseFloat(String(v).replace(',', '.')); }, 0);
    if (!tafelData[hondId]) tafelData[hondId] = {};
    tafelData[hondId].basisPunten = String(som);
    if (tafelData[hondId].basisStatus === 'Open') tafelData[hondId].basisStatus = 'Bezig';
  }
  bewaarAlles('Opgeslagen');
}

function setStatusHond(hondId, st) {
  if (waarschuwVergrendeld()) return;
  if (!tafelData[hondId]) tafelData[hondId] = {};
  tafelData[hondId].basisStatus = st;
  bewaarAlles('Status: ' + st);
}

function toggleAanwezigBaan(hondId) {
  if (waarschuwVergrendeld()) return;
  var h = deelnemers.find(function(x) { return x.id === hondId; });
  if (!h) return;
  h.aanwezig = !h.aanwezig;
  localStorage.setItem('nnfc_deelnemers_' + jaar, JSON.stringify(deelnemers));
  if (db) {
    try {
      var u = {};
      u[h.id] = h;
      db.ref('wedstrijd/beheer_deelnemers').update(u);
    } catch (e) {}
  }
  render();
  toonToast('#' + h.startnummer + ' ' + h.roepnaam + ': ' + (h.aanwezig ? 'Aanwezig' : 'Niet gemeld'));
}

function matchZoek(h, q) {
  if (!q) return true;
  var woorden = q.toLowerCase().trim().split(/\s+/);
  var tekst = [h.startnummer, '#' + h.startnummer, h.roepnaam, h.stamboom, h.eigenaar, h.klasse, 'baan ' + h.baan].join(' ').toLowerCase();
  return woorden.every(function(w) { return tekst.indexOf(w) !== -1; });
}

function isJaarVergrendeld() {
  try {
    var raw = localStorage.getItem('nnfc_slot_' + jaar);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed && typeof parsed.vergrendeld === 'boolean') return parsed.vergrendeld;
    }
  } catch (e) {}
  return String(jaar) === '2026';
}

function waarschuwVergrendeld() {
  if (isJaarVergrendeld()) {
    alert('Wedstrijdjaar ' + jaar + ' is afgesloten en vergrendeld (alleen-lezen). Open Beheer / Admin om het jaar te ontgrendelen indien nodig.');
    return true;
  }
  return false;
}

function pasBanenLockToe() {

      banner.innerHTML = '<div><b>🔒 Wedstrijdjaar ' + esc(jaar) + ' is afgesloten en vergrendeld (alleen-lezen)</b><div style="font-size:14px;opacity:.85">Baanlijsten, scores en statussen zijn vergrendeld. Je kunt de gegevens en bijlagen alleen bekijken.</div></div><a href="beheer.html" class="btn-link sm">Beheer / Admin →</a>';
      wrapEl.insertBefore(banner, wrapEl.firstChild.nextSibling || wrapEl.firstChild);
      if (window.NNFCJaarNav && typeof window.NNFCJaarNav.werkLinksBij === 'function') {
        window.NNFCJaarNav.werkLinksBij(jaar);
      }
    }
    wrapEl.querySelectorAll('input,select,textarea').forEach(function(el) {
      if (el.id === 'selJaar' || el.id === 'genBaanSel' || el.id === 'genLinkInput') return;
      el.disabled = true;
    });
    wrapEl.querySelectorAll('button').forEach(function(btn) {
      var t = (btn.textContent || '').trim();
      if (t.indexOf('Baan ') === 0 || t.indexOf('Bijlage') !== -1 || t.indexOf('Alle') === 0 || t.indexOf('Terug') !== -1 || t.indexOf('Kopieer') !== -1 || t.indexOf('Meekijken') !== -1) return;
      btn.disabled = true;
    });
  } else if (exB && exB.parentNode) {
    exB.parentNode.removeChild(exB);
  }
}

    '<div class="box-head">' +
      '<div>' +
        '<h2>Baan ' + esc(b) + ' (' + esc(klassenBaan) + ') – Meekijken (alleen-lezen)</h2>' +
        '<div class="sub">Alleen-lezen meekijkweergave voor Baan ' + esc(b) + ' (' + esc(jaar) + '). Geen klok- of eigenaarsbediening.</div>' +
      '</div>' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
        '<span class="chip">Alleen-lezen meekijk</span>' +
        '<button type="button" class="pri sm" onclick="gaNaarOverzicht()">← Terug naar Banen / Klokkers</button>' +
      '</div>' +
    '</div>' +
    '<div class="stats-pill">' +
      '<span>Nu op baan (' + esc(oefLabel) + '): <b>' + esc(nuHond) + '</b></span>' +
      '<span>Laatste tijd: <b>' + (laatsteReg ? ('#' + esc(laatsteReg.startnummer) + ' ' + esc(laatsteReg.tijdTekst)) : 'Nog geen tijd') + '</b></span>' +
      '<span>Deelnemers: <b>' + bl.length + '</b></span>' +
    '</div>' +
    '<div class="table-wrap"><table><thead><tr>' +
      '<th style="width:80px">Nr</th><th>Hond &amp; Eigenaar</th><th>Klasse &amp; Melding</th><th style="width:110px">Tijd</th><th style="width:105px">Punten</th><th style="width:120px">Status</th>' +
    '</tr></thead><tbody>' + (rijen || '<tr><td colspan="6" class="sub" style="padding:14px">Geen deelnemers op baan ' + esc(b) + '.</td></tr>') + '</tbody></table></div>' +
  '</div>';
}

function render() {
  try {
    var lbl = document.getElementById('lblJaar');
    if (lbl) lbl.textContent = jaar;
    updateCrumbBar();
    var html = '';
    if (nav.sub === 'BIJLAGEN') {
      html = renderBijlagen();
    } else if (nav.sub === 'MEEKIJK' && nav.baan !== 'ALLE') {
      html = renderBaanMeekijk(nav.baan);
    } else if (nav.baan === 'ALLE') {
      html = renderOverzicht();
    } else {
      html = renderBaanDetail(nav.baan);
    }
    var appEl = document.getElementById('appContent');
    if (appEl) appEl.innerHTML = html;
    renderKlokkerAppGenerator();
    pasBanenLockToe();
    if (window.NNFCJaarNav && typeof window.NNFCJaarNav.werkLinksBij === 'function') {
      window.NNFCJaarNav.werkLinksBij(jaar);
    }
  } catch (err) {
    var appErr = document.getElementById('appContent');
    if (appErr) {
      appErr.innerHTML = '<div class="box"><h2>Weergavefout</h2><div class="sub">' + esc(err && err.message ? err.message : String(err)) + '</div></div>';
    }
  }
}

render();

if (window.NNFCJaarNav && typeof window.NNFCJaarNav.installeerTerugEnSyncListeners === 'function') {
  window.NNFCJaarNav.werkLinksBij(typeof jaar !== 'undefined' ? jaar : '2026');
  window.NNFCJaarNav.installeerTerugEnSyncListeners(function (actueelJaar) {
    if (typeof jaar !== 'undefined' && actueelJaar && actueelJaar !== jaar) {
      jaar = actueelJaar;
      var sel = document.getElementById('selJaar');
      if (sel) sel.value = jaar;
      if (typeof laadData === 'function') laadData();
      if (typeof render === 'function') render();
    }
    if (window.NNFCJaarNav && typeof window.NNFCJaarNav.werkLinksBij === 'function') {
      window.NNFCJaarNav.werkLinksBij(typeof jaar !== 'undefined' ? jaar : actueelJaar);
    }
  }, '2026');
}
</script>
</body>
</html>
