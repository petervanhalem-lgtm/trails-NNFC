<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NNFC – Baan 1</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: #f4f6f8; color: #1a202c; padding-bottom: 40px; }
    
    header { background: #0f172a; color: white; padding: 12px 16px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 1.15rem; }
    .sync-badge { font-size: 0.85rem; padding: 4px 10px; border-radius: 12px; background: #15803d; color: white; }
    .sync-pending { background: #d97706; }
    
    .exercise-bar { display: flex; gap: 8px; margin-top: 10px; }
    .ex-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; background: #334155; color: #cbd5e1; cursor: pointer; }
    .ex-btn.active { background: #3b82f6; color: white; }
    .progress-text { font-size: 0.9rem; margin-top: 8px; color: #94a3b8; }

    .tabs { display: flex; background: white; border-bottom: 2px solid #e2e8f0; }
    .tab { flex: 1; padding: 14px; text-align: center; font-weight: bold; font-size: 1.05rem; border: none; background: none; cursor: pointer; color: #64748b; }
    .tab.active { color: #1d4ed8; border-bottom: 3px solid #1d4ed8; }

    .container { padding: 14px; max-width: 500px; margin: 0 auto; }

    .current-card { background: #fef08a; border: 2px solid #eab308; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
    .badge-nu { background: #ca8a04; color: white; font-size: 0.75rem; font-weight: bold; padding: 2px 8px; border-radius: 6px; }
    .start-nr { font-size: 1.4rem; font-weight: 800; float: right; }
    .roepnaam { font-size: 1.8rem; font-weight: 800; margin: 4px 0 2px 0; }
    .stamboomnaam { font-size: 0.9rem; color: #475569; }

    .next-card { background: white; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .next-label { font-size: 0.85rem; color: #64748b; font-weight: bold; }
    .next-name { font-size: 1.1rem; font-weight: 700; }

    .time-display { background: white; border: 2px solid #94a3b8; border-radius: 10px; padding: 14px; text-align: center; margin-bottom: 12px; }
    .time-raw { font-size: 0.85rem; color: #64748b; min-height: 18px; }
    .time-formatted { font-size: 2.4rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .time-invalid { color: #dc2626; }

    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .key { padding: 18px 0; font-size: 1.5rem; font-weight: bold; background: white; border: 1px solid #cbd5e1; border-radius: 10px; cursor: pointer; touch-action: manipulation; }
    .key:active { background: #e2e8f0; }
    .key-action { background: #e2e8f0; font-size: 1.1rem; }

    .actions { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-bottom: 14px; }
    .btn-save { background: #16a34a; color: white; border: none; border-radius: 10px; padding: 18px; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
    .btn-save:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-refusal { background: #dc2626; color: white; border: none; border-radius: 10px; padding: 18px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
    .btn-msg { width: 100%; padding: 12px; background: #334155; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .dog-item { background: white; border: 1px solid #cbd5e1; border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .dog-item.is-nu { background: #fef08a; border-color: #eab308; }
    .dog-item.is-done { opacity: 0.7; background: #f8fafc; }
    .btn-small { padding: 8px 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
    .btn-next { background: #1d4ed8; color: white; }
    .btn-corr { background: #f59e0b; color: white; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal { background: white; border-radius: 14px; padding: 20px; width: 100%; max-width: 400px; }
    .modal-btns { display: flex; gap: 10px; margin-top: 16px; }
    .modal-btns button { flex: 1; padding: 14px; border-radius: 8px; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; }

    .log-box { background: #e2e8f0; border-radius: 8px; padding: 10px; font-size: 0.85rem; margin-top: 16px; }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <span>Baan 1 – Klasse Open</span>
    <span id="syncStatus" class="sync-badge">Wachtrij: 0</span>
  </div>
  <div class="exercise-bar">
    <button class="ex-btn active" onclick="setOefening('A')">Oefening A</button>
    <button class="ex-btn" onclick="setOefening('B')">Oefening B</button>
    <button class="ex-btn" onclick="setOefening('C')">Oefening C</button>
  </div>
  <div class="progress-text" id="voortgangTekst">Oefening A: 0 van 0 gedaan</div>
</header>

<div class="tabs">
  <button class="tab active" id="tabBtnReg" onclick="switchTab('reg')">Registratie</button>
  <button class="tab" id="tabBtnLijst" onclick="switchTab('lijst')">Lijst</button>
</div>

<div class="container" id="viewReg">
  <div id="huidigeHondBlok"></div>
  <div id="volgendeHondBlok"></div>

  <div class="time-display">
    <div class="time-raw" id="rawDigits">Voer cijfers in (bijv. 945 = 9,45)</div>
    <div class="time-formatted" id="formattedTime">0,00</div>
  </div>

  <div class="keypad">
    <button class="key" onclick="addDigit('1')">1</button>
    <button class="key" onclick="addDigit('2')">2</button>
    <button class="key" onclick="addDigit('3')">3</button>
    <button class="key" onclick="addDigit('4')">4</button>
    <button class="key" onclick="addDigit('5')">5</button>
    <button class="key" onclick="addDigit('6')">6</button>
    <button class="key" onclick="addDigit('7')">7</button>
    <button class="key" onclick="addDigit('8')">8</button>
    <button class="key" onclick="addDigit('9')">9</button>
    <button class="key key-action" onclick="clearDigits()">Wissen</button>
    <button class="key" onclick="addDigit('0')">0</button>
    <button class="key key-action" onclick="backspace()">⌫</button>
  </div>

  <div class="actions">
    <button class="btn-save" id="btnSave" onclick="startConfirm('TIJD')" disabled>Tijd opslaan</button>
    <button class="btn-refusal" id="btnRefusal" onclick="startConfirm('WEIGERING')">Weigering</button>
  </div>

  <button class="btn-msg" onclick="openMessageModal()">Bericht aan wedstrijdtafel sturen</button>
</div>

<div class="container" id="viewLijst" style="display:none;">
  <div id="lijstContainer"></div>
  <div class="log-box">
    <strong>Wijzigingen in de volgorde (Baan 1):</strong>
    <ul id="volgordeLog"></ul>
  </div>
</div>

<!-- MODAL DUBBELE BEVESTIGING -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <h3 id="confirmStepTitle">Stap 1 van 2: Controleer invoer</h3>
    <p id="confirmText" style="font-size: 1.1rem; line-height: 1.5;"></p>
    <div class="modal-btns">
      <button style="background:#cbd5e1;" onclick="closeConfirm()">Annuleren</button>
      <button id="confirmNextBtn" style="background:#16a34a; color:white;" onclick="nextConfirmStep()">Bevestigen</button>
    </div>
  </div>
</div>

<!-- MODAL CORRECTIE -->
<div class="modal-overlay" id="corrModal">
  <div class="modal">
    <h3>Correctie aanvragen</h3>
    <p id="corrDogInfo"></p>
    <label>Nieuwe tijd (alleen cijfers):</label>
    <input type="tel" id="corrDigits" oninput="previewCorr()" style="width:100%; padding:12px; font-size:1.3rem; margin:6px 0;" placeholder="bijv. 1234">
    <div id="corrPreview" style="font-weight:bold; margin-bottom:10px;">Herkend: 0,00</div>
    <label>Reden (optioneel):</label>
    <input type="text" id="corrReason" style="width:100%; padding:10px; margin-top:4px;" placeholder="Bijv. tikfout">
    <div class="modal-btns">
      <button style="background:#cbd5e1;" onclick="document.getElementById('corrModal').classList.remove('open')">Sluiten</button>
      <button style="background:#f59e0b; color:white;" onclick="submitCorrection()">Versturen</button>
    </div>
  </div>
</div>

<!-- MODAL BERICHT -->
<div class="modal-overlay" id="msgModal">
  <div class="modal">
    <h3>Bericht aan wedstrijdtafel</h3>
    <select id="msgPreset" style="width:100%; padding:12px; font-size:1rem; margin-bottom:10px;">
      <option value="Hond nog niet aanwezig bij baan">Hond nog niet aanwezig bij baan</option>
      <option value="Korte pauze / baanonderhoud">Korte pauze / baanonderhoud</option>
      <option value="Vraag voor baancommissaris">Vraag voor baancommissaris</option>
      <option value="Anders">Anders (zie toelichting)</option>
    </select>
    <input type="text" id="msgCustom" style="width:100%; padding:10px;" placeholder="Korte vrije tekst (optioneel)">
    <div class="modal-btns">
      <button style="background:#cbd5e1;" onclick="document.getElementById('msgModal').classList.remove('open')">Annuleren</button>
      <button style="background:#1d4ed8; color:white;" onclick="sendMessage()">Versturen</button>
    </div>
  </div>
</div>

<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>
<script src="config.js"></script>

<script>
  const BAAN_ID = "1";
  const KLASSE_NAAM = "Open";

  let db = null;
