<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beheer – NNFC</title>
<style>
:root{
  --bg:#EEF3F5;--sf:#FFFFFF;--sf2:#F7FAFC;--ink:#0E2A3A;--mut:#4D6573;--ac:#0B6E8F;--acink:#FFFFFF;
  --cur:#FFD23F;--curink:#1B1500;--bad:#B3261E;--ok:#1F7A4D;--ln:#C3D3DB;--soft:#DDE8ED;--warn:#B45309;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1A22;--sf:#14293A;--sf2:#102230;--ink:#E8F1F5;--mut:#9DB4C1;--ac:#4CC3E6;--acink:#06222E;
    --cur:#FFD23F;--curink:#1B1500;--bad:#FF8A80;--ok:#6FD6A0;--ln:#2C4558;--soft:#1D3547;--warn:#FBBF6A;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow Semi Condensed',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.35}
.wrap{max-width:1380px;margin:0 auto;padding:14px 18px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:12px 16px}
.top-l{display:flex;align-items:center;gap:12px}
.top img{width:48px;height:48px;border-radius:50%;flex:none}
h1{font-size:23px;margin:0;font-weight:700;line-height:1.15}
h2{font-size:19px;margin:0;font-weight:700}
h3{font-size:16px;margin:0 0 6px;font-weight:700}
.sub{color:var(--mut);font-size:14px}
button,.btn-link{font:inherit;color:inherit;border:1.5px solid var(--ln);background:var(--sf);border-radius:10px;min-height:42px;padding:6px 14px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .12s,border-color .12s}
button:hover,.btn-link:hover{background:var(--sf2)}
.pri{background:var(--ac)!important;border-color:var(--ac)!important;color:var(--acink)!important}
.ok{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important}
.bad{border-color:var(--bad)!important;color:var(--bad)!important;min-height:36px;padding:4px 10px}
.sm{min-height:36px;padding:4px 10px;font-size:15px}

/* Beheer hoofdnavigatie (3 secties) */
.beheer-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;background:var(--sf);border:2px solid var(--ln);border-radius:14px;padding:8px}
@media(max-width:720px){.beheer-nav{grid-template-columns:1fr}}
.beheer-btn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;padding:8px 12px;border-radius:10px;background:var(--sf2);min-height:58px}
.beheer-btn .nr{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
.beheer-btn .ttl{font-size:15px;font-weight:700;line-height:1.2}
.beheer-btn.on{background:var(--ac)!important;border-color:var(--ac)!important;color:var(--acink)!important}

/* Vaste terug- en ankerbalk voor subpagina's */
.crumb-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--sf);border:2px solid var(--ac);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.crumb-trail{font-size:14px;color:var(--mut);font-weight:600}
.crumb-trail b{color:var(--ink)}
.crumb-acts{display:flex;gap:8px;flex-wrap:wrap}

.box{background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}
.box-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:1100px){.grid5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
@media(max-width:620px){.grid5{grid-template-columns:1fr}}

.kaart{background:var(--sf2);border:1.5px solid var(--ln);border-radius:12px;padding:12px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:3px;color:var(--mut)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--ln);border-radius:10px;padding:7px 10px;width:100%;margin-bottom:9px;min-height:42px}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
.row-check{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.row-check input[type="checkbox"]{width:auto;min-height:auto;margin:0;width:20px;height:20px;accent-color:var(--ac)}
.row-check label{margin:0;color:var(--ink);cursor:pointer}
.chk-group{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.chk-pill{display:inline-flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--ln);padding:5px 10px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.chk-pill input{width:auto;min-height:auto;margin:0;width:18px;height:18px;accent-color:var(--ac)}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.search-wrap{flex:1;min-width:240px;display:flex;gap:6px;align-items:center}
.search-wrap input{margin-bottom:0;border-color:var(--ac)}
.stats-pill{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--mut);background:var(--sf2);padding:8px 12px;border-radius:10px;border:1px solid var(--ln);margin-bottom:12px}

.table-wrap{overflow-x:auto;max-height:66vh;border:1.5px solid var(--ln);border-radius:12px}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;z-index:2;background:var(--sf2);color:var(--mut);font-weight:700;font-size:14px;text-align:left;padding:9px 10px;border-bottom:2px solid var(--ln);white-space:nowrap}
tbody td{padding:8px 10px;border-bottom:1px solid var(--ln);font-size:15px;vertical-align:middle}
tbody tr:nth-child(even){background:var(--sf2)}
tbody tr:hover{background:var(--soft)}

.chip{display:inline-block;background:var(--soft);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.chip-ok{display:inline-block;background:rgba(31,122,77,0.15);color:var(--ok);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.chip-warn{display:inline-block;background:rgba(179,38,30,0.14);color:var(--bad);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.hond-main{font-weight:700;font-size:16px}
.hond-sub{color:var(--mut);font-size:13px}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ok);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.22);z-index:99;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="top-l">
      <img src="nnfc-logo.png" alt="NNFC" onerror="this.style.display='none'">
      <div>
        <h1>Beheer – Voorbereiding & Inschrijvingen (<span id="lblJaar">2026</span>)</h1>
        <div class="sub">Inschrijven, baanindeling & 3 bijlagen, deelnemerslijst en testdata voor de wedstrijddag</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select id="selJaar" onchange="wisselJaar()" style="width:auto;margin:0;font-weight:700" aria-label="Selecteer wedstrijdjaar"></select>
      <a href="wedstrijdtafel-v2.html" class="btn-link pri">Wedstrijdtafel →</a>
      <a href="banen.html" class="btn-link">Banen / Klokkers →</a>
      <a href="index.html" class="btn-link">← Menu</a>
    </div>
  </div>

  <!-- 3 BEHEERSECTIES -->
  <div class="beheer-nav" role="navigation" aria-label="Beheer secties">
    <button type="button" id="bhBtn1" class="beheer-btn on" onclick="gaNaarSectie(1)">
      <span class="nr">Deel 1</span>
      <span class="ttl">Inschrijvingen toevoegen</span>
    </button>
    <button type="button" id="bhBtn2" class="beheer-btn" onclick="gaNaarSectie(2)">
      <span class="nr">Deel 2</span>
      <span class="ttl">Baanindeling & 3 Bijlagen</span>
    </button>
    <button type="button" id="bhBtn3" class="beheer-btn" onclick="gaNaarSectie(3)">
      <span class="nr">Deel 3</span>
      <span class="ttl">Deelnemerslijst & Banen</span>
    </button>
  </div>

  <!-- VASTE ANKERBALK BIJ SUBPAGINA'S (TERUG & WEDSTRIJDTAFEL) -->
  <div id="crumbBar" class="crumb-bar" style="display:none">
    <div id="crumbTrail" class="crumb-trail"></div>
    <div class="crumb-acts">
      <button type="button" class="sm" onclick="gaTerug()">← Terug</button>
      <a href="wedstrijdtafel-v2.html" class="btn-link pri sm">Wedstrijdtafel</a>
    </div>
  </div>

  <div id="appContent"></div>
</div>

<div id="toast" class="toast">Opgeslagen</div>

<script src="config.js"></script>
<script>
var db = null;
var KLASSEN_OPTIES = ["Jeugd", "Open", "Veteranen", "Stamboomloos", "Specials"];
var BREVET_OPTIES = ["Geen", "B1", "B2", "B3", "B4", "B5", "B6", "B7", "B8"];
var KCM_OPTIES = ["GEEN", "BOB", "CAC", "Res. CAC", "U1", "U2", "U3", "U4", "U", "ZG", "G", "M", "S"];

var SECTIE_NAMEN = {
  1: "Inschrijvingen toevoegen",
  2: "Baanindeling & 3 Bijlagen",
  3: "Deelnemerslijst & Banen"
};

function initFirebase() {
  try {
    if (typeof firebase !== 'undefined' && typeof firebaseConfig !== 'undefined' && firebaseConfig.apiKey && firebaseConfig.apiKey !== "JOUW_API_KEY") {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    }
  } catch (e) {}
}
initFirebase();

function esc(str) {
  return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function toonToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg || 'Opgeslagen';
  el.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function() { el.style.display = 'none'; }, 1800);
}

var selJaarEl = document.getElementById('selJaar');
var huidigKalenderJaar = new Date().getFullYear();
var standaardJaar = (huidigKalenderJaar >= 2026 && huidigKalenderJaar <= 2040) ? String(huidigKalenderJaar) : '2026';
for (var y = 2026; y <= 2040; y++) {
  var o = document.createElement('option');
  o.value = String(y);
  o.textContent = 'Jaar ' + y;
  if (String(y) === standaardJaar) o.selected = true;
  selJaarEl.appendChild(o);
}

var jaar = selJaarEl.value;
document.getElementById('lblJaar').textContent = jaar;

var deelnemers = [];
var baanIndeling = {
  banen: { "1": ["Open"], "2": ["Jeugd"], "3": ["Veteranen"], "4": ["Stamboomloos"], "5": ["Specials"] },
  bijlagen: { b1: "", b2: "", b3: "" }
};

var nav = {
  sectie: 1,
  sub: null,
  subLabel: '',
  zoek: '',
  baanFilter: 'ALLE'
};

function laadData() {
  try { deelnemers = JSON.parse(localStorage.getItem('nnfc_deelnemers_' + jaar)) || []; } catch (e) { deelnemers = []; }
  try {
    var b = JSON.parse(localStorage.getItem('nnfc_baanindeling_' + jaar));
    if (b && b.banen) {
      baanIndeling = {
        banen: Object.assign({ "1": [], "2": [], "3": [], "4": [], "5": [] }, b.banen),
        bijlagen: Object.assign({ b1: "", b2: "", b3: "" }, b.bijlagen || {})
      };
    }
  } catch (e) {}
}
laadData();

function syncFirebase() {
  if (!db) return;
  try {
    db.ref('wedstrijd/baanindeling_' + jaar).set(baanIndeling);
    var updates = {};
    deelnemers.forEach(function(h) { updates[h.id] = h; });
    db.ref('wedstrijd/beheer_deelnemers').update(updates);
  } catch (e) {}
}

function bewaarDeelnemers(toastTekst) {
  localStorage.setItem('nnfc_deelnemers_' + jaar, JSON.stringify(deelnemers));
  syncFirebase();
  render();
  if (toastTekst) toonToast(toastTekst);
}

function bewaarBaanIndeling(toastTekst) {
  localStorage.setItem('nnfc_baanindeling_' + jaar, JSON.stringify(baanIndeling));
  syncFirebase();
  render();
  if (toastTekst) toonToast(toastTekst);
}

function wisselJaar() {
  jaar = selJaarEl.value;
  document.getElementById('lblJaar').textContent = jaar;
  laadData();
  render();
}

function gaNaarSectie(nr) {
  nav.sectie = nr;
  nav.sub = null;
  nav.subLabel = '';
  render();
}

function openSub(subId, label) {
  nav.sub = subId;
  nav.subLabel = label;
  render();
}

function gaTerug() {
  if (nav.sub) {
    nav.sub = null;
    nav.subLabel = '';
  } else if (nav.sectie > 1) {
    nav.sectie = 1;
  }
  render();
}

function updateCrumbBar() {
  for (var s = 1; s <= 3; s++) {
    document.getElementById('bhBtn' + s).classList.toggle('on', nav.sectie === s);
  }
  var bar = document.getElementById('crumbBar');
  var trail = document.getElementById('crumbTrail');
  if (!nav.sub) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';
  trail.innerHTML = 'Beheer &rsaquo; ' + esc(SECTIE_NAMEN[nav.sectie]) + ' &rsaquo; <b>' + esc(nav.subLabel) + '</b>';
}

function bepaalBaanVoorKlasse(klasse) {
  for (var b = 1; b <= 5; b++) {
    var lijst = (baanIndeling.banen && baanIndeling.banen[String(b)]) || [];
    if (lijst.indexOf(klasse) !== -1) return String(b);
  }
  return "1";
}

function herverdeelBanen() {
  deelnemers.forEach(function(h) {
    h.baan = bepaalBaanVoorKlasse(h.klasse);
  });
  bewaarDeelnemers('Banen opnieuw verdeeld op basis van klasse');
}

function volgendeStartnummer() {
  var maxNr = 2600;
  deelnemers.forEach(function(h) {
    var n = parseInt(h.startnummer, 10);
    if (!isNaN(n) && n > maxNr) maxNr = n;
  });
  return maxNr + 1;
}

function voegInschrijvingToe(e) {
  e.preventDefault();
  var roepnaam = document.getElementById('fRoepnaam').value.trim();
  var stamboom = document.getElementById('fStamboom').value.trim();
  var eigenaar = document.getElementById('fEigenaar').value.trim();
  var district = document.getElementById('fDistrict').value.trim();
  var lidnr = document.getElementById('fLidnr').value.trim();
  var geslacht = document.getElementById('fGeslacht').value;
  var klasse = document.getElementById('fKlasse').value;
  var huidigBrevet = document.getElementById('fHuidigBrevet').value;
  var opvolgendBrevet = document.getElementById('fOpvolgendBrevet').value;
  var kcm = document.getElementById('fKcm').value;
  var buitenMededinging = document.getElementById('fBuitenMed').checked;
  var betaald = document.getElementById('fBetaald').checked;
  var startInput = parseInt(document.getElementById('fStartnr').value, 10);
  var startnummer = (!isNaN(startInput) && startInput > 0) ? startInput : volgendeStartnummer();

  if (!roepnaam || !eigenaar) {
    alert('Vul in elk geval de roepnaam van de hond en de naam van de eigenaar in.');
    return;
  }
  if (deelnemers.some(function(h) { return h.startnummer === startnummer; })) {
    alert('Startnummer #' + startnummer + ' bestaat al in ' + jaar + '. Kies een ander nummer.');
    return;
  }

  var nieuw = {
    id: 'hond_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    startnummer: startnummer,
    roepnaam: roepnaam,
    stamboom: stamboom || roepnaam,
    eigenaar: eigenaar,
    district: district,
    lidnr: lidnr || '—',
    geslacht: geslacht,
    klasse: klasse,
    huidigBrevet: huidigBrevet,
    opvolgendBrevet: opvolgendBrevet,
    kcm: kcm,
    buitenMededinging: buitenMededinging,
    baan: bepaalBaanVoorKlasse(klasse),
    aanwezig: false,
    betaald: betaald
  };

  deelnemers.push(nieuw);
  bewaarDeelnemers('#' + startnummer + ' ' + roepnaam + ' toegevoegd');
}

function laadVoorbeeldData() {
  if (deelnemers.length > 0 && !confirm('Er staan al ' + deelnemers.length + ' deelnemers in ' + jaar + '. Wil je een set voorbeeldeelnemers toevoegen?')) return;
  var voorbeelden = [
    { roepnaam: 'Bram', stamboom: 'Bram van het Waterriet', eigenaar: 'Jan de Vries', district: 'Noord', lidnr: '1042', geslacht: 'Reu', klasse: 'Open', huidigBrevet: 'B1', opvolgendBrevet: 'B2', kcm: 'U1', buitenMededinging: false, betaald: true },
    { roepnaam: 'Luna', stamboom: 'Luna aan de Kade', eigenaar: 'Sanne Bakker', district: 'Utrecht', lidnr: '1188', geslacht: 'Teef', klasse: 'Jeugd', huidigBrevet: 'Geen', opvolgendBrevet: 'B1', kcm: 'GEEN', buitenMededinging: false, betaald: true },
    { roepnaam: 'Max', stamboom: 'Max van de Nieuwe Meer', eigenaar: 'Pieter Jansen', district: 'Noord', lidnr: '0894', geslacht: 'Reu', klasse: 'Veteranen', huidigBrevet: 'B3', opvolgendBrevet: 'B4', kcm: 'CAC', buitenMededinging: false, betaald: false },
    { roepnaam: 'Pip', stamboom: 'Pip zonder Stamboom', eigenaar: 'Maaike Visser', district: 'Zuid', lidnr: '1305', geslacht: 'Teef', klasse: 'Stamboomloos', huidigBrevet: 'Geen', opvolgendBrevet: 'B1', kcm: 'GEEN', buitenMededinging: false, betaald: true },
    { roepnaam: 'Rex', stamboom: 'Rex Special Edition', eigenaar: 'Kees Hendriks', district: 'Oost', lidnr: '1410', geslacht: 'Reu', klasse: 'Specials', huidigBrevet: 'B2', opvolgendBrevet: 'B3', kcm: 'GEEN', buitenMededinging: true, betaald: true }
  ];
  var nr = volgendeStartnummer();
  voorbeelden.forEach(function(v, i) {
    deelnemers.push({
      id: 'demo_' + jaar + '_' + (nr + i) + '_' + Math.random().toString(36).slice(2, 5),
      startnummer: nr + i,
      roepnaam: v.roepnaam,
      stamboom: v.stamboom,
      eigenaar: v.eigenaar,
      district: v.district,
      lidnr: v.lidnr,
      geslacht: v.geslacht,
      klasse: v.klasse,
      huidigBrevet: v.huidigBrevet,
      opvolgendBrevet: v.opvolgendBrevet,
      kcm: v.kcm,
      buitenMededinging: v.buitenMededinging,
      baan: bepaalBaanVoorKlasse(v.klasse),
      aanwezig: false,
      betaald: v.betaald
    });
  });
  bewaarDeelnemers('5 voorbeeldeelnemers toegevoegd');
}

function toggleBaanKlasse(baanNr, kl) {
  var lijst = (baanIndeling.banen[baanNr] || []).slice();
  var idx = lijst.indexOf(kl);
  if (idx === -1) lijst.push(kl);
  else lijst.splice(idx, 1);
  baanIndeling.banen[baanNr] = lijst;
  localStorage.setItem('nnfc_baanindeling_' + jaar, JSON.stringify(baanIndeling));
  syncFirebase();
  render();
}

function slaBijlagenOp() {
  baanIndeling.bijlagen.b1 = document.getElementById('bijlage1').value;
  baanIndeling.bijlagen.b2 = document.getElementById('bijlage2').value;
  baanIndeling.bijlagen.b3 = document.getElementById('bijlage3').value;
  bewaarBaanIndeling('3 Bijlagen opgeslagen voor ' + jaar);
}

function wijzigHondVeld(id, veld, waarde) {
  var h = deelnemers.find(function(x) { return x.id === id; });
  if (!h) return;
  if (veld === 'startnummer') {
    var nr = parseInt(waarde, 10);
    if (!nr || nr < 1) return;
    if (deelnemers.some(function(x) { return x.id !== id && x.startnummer === nr; })) {
      alert('Startnummer #' + nr + ' is al in gebruik.');
      render();
      return;
    }
    h.startnummer = nr;
  } else {
    h[veld] = waarde;
  }
  bewaarDeelnemers('Bijgewerkt');
}

function verwijderDeelnemer(id) {
  var h = deelnemers.find(function(x) { return x.id === id; });
  if (!h) return;
  if (!confirm('#' + h.startnummer + ' ' + h.roepnaam + ' verwijderen uit ' + jaar + '?')) return;
  deelnemers = deelnemers.filter(function(x) { return x.id !== id; });
  bewaarDeelnemers('#' + h.startnummer + ' ' + h.roepnaam + ' verwijderd');
}

function matchZoek(h, q) {
  if (!q) return true;
  var woorden = q.toLowerCase().trim().split(/\s+/);
  var tekst = [h.startnummer, '#' + h.startnummer, h.roepnaam, h.stamboom, h.eigenaar, h.district || '', h.lidnr, h.klasse, 'baan ' + h.baan].join(' ').toLowerCase();
  return woorden.every(function(w) { return tekst.indexOf(w) !== -1; });
}

// ============================================================
// SECTIE 1: INSCHRIJVINGEN TOEVOEGEN
// ============================================================
function renderSectie1() {
  var volgendNr = volgendeStartnummer();
  return '<div class="box">' +
    '<div class="box-head">' +
      '<div><h2>1. Nieuwe inschrijving toevoegen (' + esc(jaar) + ')</h2><div class="sub">Voeg een hond en geleider toe voor de komende waterwerkdag</div></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button type="button" class="sm" onclick="laadVoorbeeldData()">+ Vul 5 testdeelnemers</button>' +
        '<button type="button" class="sm" onclick="gaNaarSectie(3)">Bekijk lijst (' + deelnemers.length + ') →</button>' +
      '</div>' +
    '</div>' +
    '<form onsubmit="voegInschrijvingToe(event)">' +
      '<div class="grid3">' +
        '<div class="kaart">' +
          '<h3>Hond & Stamboom</h3>' +
          '<label>Roepnaam *</label><input id="fRoepnaam" type="text" required placeholder="Bijv. Bram">' +
          '<label>Stamboomnaam</label><input id="fStamboom" type="text" placeholder="Bijv. Bram van het Waterriet">' +
          '<label>Geslacht</label><select id="fGeslacht"><option value="Reu">Reu</option><option value="Teef">Teef</option></select>' +
          '<label>Klasse</label><select id="fKlasse">' + KLASSEN_OPTIES.map(function(k){ return '<option value="'+k+'">'+k+'</option>'; }).join('') + '</select>' +
        '</div>' +
        '<div class="kaart">' +
          '<h3>Eigenaar & Startnummer</h3>' +
          '<label>Naam eigenaar / geleider *</label><input id="fEigenaar" type="text" required placeholder="Bijv. Jan de Vries">' +
          '<label>District</label><input id="fDistrict" type="text" placeholder="Bijv. Noord / Utrecht">' +
          '<label>Lidnummer</label><input id="fLidnr" type="text" placeholder="Bijv. 1042">' +
          '<label>Startnummer (volgend vrij: #' + volgendNr + ')</label><input id="fStartnr" type="number" value="' + volgendNr + '">' +
        '</div>' +
        '<div class="kaart">' +
          '<h3>Brevet, KCM & Status</h3>' +
          '<label>Huidig brevet</label><select id="fHuidigBrevet">' + BREVET_OPTIES.map(function(b){ return '<option value="'+b+'">'+b+'</option>'; }).join('') + '</select>' +
          '<label>Opvolgend brevet</label><select id="fOpvolgendBrevet">' + BREVET_OPTIES.slice(1).map(function(b){ return '<option value="'+b+'">'+b+'</option>'; }).join('') + '</select>' +
          '<label>KCM-kwalificatie</label><select id="fKcm">' + KCM_OPTIES.map(function(k){ return '<option value="'+k+'">'+k+'</option>'; }).join('') + '</select>' +
          '<div class="row-check"><input id="fBetaald" type="checkbox" checked><label for="fBetaald">Inschrijfgeld betaald</label></div>' +
          '<div class="row-check"><input id="fBuitenMed" type="checkbox"><label for="fBuitenMed">Buiten mededinging (*)</label></div>' +
        '</div>' +
      '</div>' +
      '<div style="margin-top:12px;display:flex;justify-content:flex-end;gap:10px">' +
        '<button type="submit" class="pri">Inschrijving opslaan</button>' +
      '</div>' +
    '</form>' +
  '</div>';
}

// ============================================================
// SECTIE 2: BAANINDELING & 3 BIJLAGEN
// ============================================================
function renderSectie2() {
  var baanKaarten = ['1','2','3','4','5'].map(function(b) {
    var gekoppeld = baanIndeling.banen[b] || [];
    var aantHonden = deelnemers.filter(function(h) { return String(h.baan) === b; }).length;
    return '<div class="kaart">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
        '<b>Baan ' + b + '</b><span class="chip">' + aantHonden + ' honden</span>' +
      '</div>' +
      '<div class="chk-group">' +
        KLASSEN_OPTIES.map(function(kl) {
          var checked = gekoppeld.indexOf(kl) !== -1;
          return '<label class="chk-pill"><input type="checkbox" ' + (checked ? 'checked' : '') + ' onchange="toggleBaanKlasse(\'' + b + '\',\'' + esc(kl) + '\')"> ' + esc(kl) + '</label>';
        }).join('') +
      '</div>' +
    '</div>';
  }).join('');

  return '<div class="box">' +
    '<div class="box-head">' +
      '<div><h2>2. Baanindeling per klasse (' + esc(jaar) + ')</h2><div class="sub">Koppel klassen aan Baan 1–5 en pas de banen van ingeschreven honden aan</div></div>' +
      '<button type="button" class="pri sm" onclick="herverdeelBanen()">Herverdeel deelnemers op klasse</button>' +
    '</div>' +
    '<div class="grid5">' + baanKaarten + '</div>' +
  '</div>' +

  '<div class="box">' +
    '<div class="box-head">' +
      '<div><h2>3 Bijlagen bij het Waterwerkreglement (' + esc(jaar) + ')</h2><div class="sub">Afspraken, aanwijzingen of oefeningen voor baancommissarissen & klokkers — direct te raadplegen op Banen / Klokkers</div></div>' +
      '<button type="button" class="ok sm" onclick="slaBijlagenOp()">Bijlagen opslaan</button>' +
    '</div>' +
    '<div class="grid3">' +
      '<div class="kaart"><label for="bijlage1">Bijlage 1 – Reglement & afspraken</label><div class="sub" style="margin-bottom:6px">Bijv. startvolgorde, afmelden of wachttijden</div><textarea id="bijlage1" placeholder="Bijv. Honden starten op startnummer; bij vertraging direct melden bij de wedstrijdtafel...">' + esc(baanIndeling.bijlagen.b1 || '') + '</textarea></div>' +
      '<div class="kaart"><label for="bijlage2">Bijlage 2 – Oefeningen & uitvoering</label><div class="sub" style="margin-bottom:6px">Bijv. afstanden, lijngebruik of aandachtspunten per baan</div><textarea id="bijlage2" placeholder="Bijv. Let op lijnvoering bij het inzwemmen en rustig afwachten op de kant...">' + esc(baanIndeling.bijlagen.b2 || '') + '</textarea></div>' +
      '<div class="kaart"><label for="bijlage3">Bijlage 3 – Tijdmeting & bijzonderheden</label><div class="sub" style="margin-bottom:6px">Bijv. klokregels, extra instructies of veiligheidsmeldingen</div><textarea id="bijlage3" placeholder="Bijv. Klok start bij signaal keurmeester; noteer bijzonderheden direct op de klokkaart...">' + esc(baanIndeling.bijlagen.b3 || '') + '</textarea></div>' +
    '</div>' +
  '</div>';
}

// ============================================================
// SECTIE 3: DEELNEMERSLIJST & BANEN
// ============================================================
function renderSectie3() {
  var lijst = deelnemers
    .filter(function(h) {
      if (nav.baanFilter !== 'ALLE' && String(h.baan) !== nav.baanFilter) return false;
      return matchZoek(h, nav.zoek);
    })
    .sort(function(a, b) { return (a.startnummer || 0) - (b.startnummer || 0); });

  var betaaldCnt = deelnemers.filter(function(h) { return h.betaald; }).length;

  var rows = lijst.map(function(h) {
    return '<tr>' +
      '<td><input type="number" value="' + esc(h.startnummer) + '" style="width:86px;margin:0;min-height:34px;font-weight:700" onchange="wijzigHondVeld(\'' + esc(h.id) + '\',\'startnummer\',this.value)"></td>' +
      '<td><div class="hond-main">' + esc(h.roepnaam) + (h.buitenMededinging ? ' <span class="chip">*</span>' : '') + '</div><div class="hond-sub">' + esc(h.stamboom) + '</div></td>' +
      '<td><div>' + esc(h.eigenaar) + '</div><div class="hond-sub">' + esc(h.district || '—') + ' • Lidnr: ' + esc(h.lidnr) + '</div></td>' +
      '<td><select style="width:auto;margin:0;min-height:34px" onchange="wijzigHondVeld(\'' + esc(h.id) + '\',\'klasse\',this.value)">' +
        KLASSEN_OPTIES.map(function(k){ return '<option value="'+k+'" '+(h.klasse===k?'selected':'')+'>'+k+'</option>'; }).join('') +
      '</select></td>' +
      '<td><select style="width:auto;margin:0;min-height:34px" onchange="wijzigHondVeld(\'' + esc(h.id) + '\',\'baan\',this.value)">' +
        ['1','2','3','4','5'].map(function(b){ return '<option value="'+b+'" '+(String(h.baan)===b?'selected':'')+'>Baan '+b+'</option>'; }).join('') +
      '</select></td>' +
      '<td>' + (h.betaald ? '<span class="chip-ok">Betaald</span>' : '<span class="chip-warn">Open</span>') + '</td>' +
      '<td><button type="button" class="bad" onclick="verwijderDeelnemer(\'' + esc(h.id) + '\')">Verwijder</button></td>' +
    '</tr>';
  }).join('');

  return '<div class="box">' +
    '<div class="box-head">' +
      '<div><h2>3. Deelnemerslijst & Banen (' + esc(jaar) + ')</h2><div class="sub">Pas klasse, baan of startnummer aan vóór de wedstrijd start</div></div>' +
      '<button type="button" class="sm" onclick="gaNaarSectie(1)">+ Nieuwe inschrijving</button>' +
    '</div>' +
    '<div class="stats-pill">' +
      '<span>Totaal: <b>' + deelnemers.length + '</b></span>' +
      '<span>Betaald: <b style="color:var(--ok)">' + betaaldCnt + '</b></span>' +
      '<span>Getoond: <b>' + lijst.length + '</b></span>' +
    '</div>' +
    '<div class="toolbar">' +
      '<div class="search-wrap">' +
        '<input type="search" value="' + esc(nav.zoek) + '" oninput="nav.zoek=this.value;render()" placeholder="Zoek op startnr, hond, eigenaar, district of lidnr...">' +
        '<button type="button" class="sm" onclick="nav.zoek=\'\';render()">Wis</button>' +
      '</div>' +
      '<select style="width:auto;margin:0;min-height:36px" onchange="nav.baanFilter=this.value;render()">' +
        '<option value="ALLE" ' + (nav.baanFilter === 'ALLE' ? 'selected' : '') + '>Alle banen</option>' +
        ['1','2','3','4','5'].map(function(b){ return '<option value="'+b+'" '+(nav.baanFilter===b?'selected':'')+'>Baan '+b+'</option>'; }).join('') +
      '</select>' +
    '</div>' +
    '<div class="table-wrap"><table><thead><tr>' +
      '<th style="width:100px">Startnr</th><th>Hond</th><th>Eigenaar</th><th>Klasse</th><th>Baan</th><th>Betaling</th><th style="width:105px">Actie</th>' +
    '</tr></thead><tbody>' + (rows || '<tr><td colspan="7" class="sub" style="padding:14px">Geen deelnemers gevonden voor ' + esc(jaar) + '.</td></tr>') + '</tbody></table></div>' +
  '</div>';
}

function render() {
  updateCrumbBar();
  var html = '';
  if (nav.sectie === 1) html = renderSectie1();
  else if (nav.sectie === 2) html = renderSectie2();
  else if (nav.sectie === 3) html = renderSectie3();
  document.getElementById('appContent').innerHTML = html;
}

render();
</script>
</body>
</html>
