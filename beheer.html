<script>
(function syncBeheerJaar() {
  function isJaar(y) {
    return /^20\d{2}$/.test(String(y == null ? '' : y).trim());
  }
  function leesJaar() {
    try {
      var u = new URLSearchParams(window.location.search || '');
      var q = u.get('jaar') || u.get('y') || u.get('year');
      if (isJaar(q)) return String(q).trim();
    } catch (e) {}
    try {
      var a = localStorage.getItem('nnfc_jaar');
      if (isJaar(a)) return String(a).trim();
      var b = localStorage.getItem('nnfc_actief_jaar');
      if (isJaar(b)) return String(b).trim();
    } catch (e) {}
    return '2026';
  }

  var doelJaar = leesJaar();
  try {
    localStorage.setItem('nnfc_jaar', doelJaar);
    localStorage.setItem('nnfc_actief_jaar', doelJaar);
  } catch (e) {}

  window.__nnfcDoelJaar = doelJaar;

  function pasToeOpSelect() {
    var selects = document.querySelectorAll('select');
    selects.forEach(function(sel) {
      var opts = Array.from(sel.options || []);
      var match = opts.find(function(o) { return String(o.value).trim() === doelJaar; });
      if (match) {
        sel.value = match.value;
      } else if (opts.some(function(o) { return /^20\d{2}$/.test(String(o.value).trim()); })) {
        var opt = document.createElement('option');
        opt.value = doelJaar;
        opt.textContent = doelJaar;
        sel.appendChild(opt);
        sel.value = doelJaar;
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', pasToeOpSelect);
  } else {
    pasToeOpSelect();
  }
  window.addEventListener('load', pasToeOpSelect);
})();
</script>
