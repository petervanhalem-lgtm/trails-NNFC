<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beheer / Admin – NNFC</title>
<style>
:root{
  --bg:#EEF3F5;--sf:#FFFFFF;--sf2:#F7FAFC;--ink:#0E2A3A;--mut:#4D6573;--ac:#0B6E8F;--acink:#FFFFFF;
  --cur:#FFD23F;--curink:#1B1500;--bad:#B3261E;--ok:#1F7A4D;--ln:#C3D3DB;--soft:#DDE8ED;--warn:#B45309;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1A22;--sf:#14293A;--sf2:#102230;--ink:#E8F1F5;--mut:#9DB4C1;--ac:#4CC3E6;--acink:#06222E;
    --cur:#FFD23F;--curink:#1B1500;--bad:#FF8A80;--ok:#6FD6A0;--ln:#2C4558;--soft:#1D3547;--warn:#FBBF6A;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow Semi Condensed',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.35}
.wrap{max-width:1380px;margin:0 auto;padding:14px 18px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:12px 16px}
.top-l{display:flex;align-items:center;gap:12px}
.top img{width:48px;height:48px;border-radius:50%;flex:none}
h1{font-size:23px;margin:0;font-weight:700;line-height:1.15}
h2{font-size:19px;margin:0;font-weight:700}
h3{font-size:16px;margin:0 0 6px;font-weight:700}
.sub{color:var(--mut);font-size:14px}
button,.btn-link{font:inherit;color:inherit;border:1.5px solid var(--ln);background:var(--sf);border-radius:10px;min-height:42px;padding:6px 14px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .12s,border-color .12s}
button:hover,.btn-link:hover{background:var(--sf2)}
.pri{background:var(--ac)!important;border-color:var(--ac)!important;color:var(--acink)!important}
.ok{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important}
.bad{border-color:var(--bad)!important;color:var(--bad)!important;min-height:36px;padding:4px 10px}
.sm{min-height:36px;padding:4px 10px;font-size:15px}

/* Beheer hoofdnavigatie */
.beheer-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px;background:var(--sf);border:2px solid var(--ln);border-radius:14px;padding:8px}
@media(max-width:1020px){.beheer-nav{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.beheer-nav{grid-template-columns:1fr}}
.beheer-btn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;padding:8px 12px;border-radius:10px;background:var(--sf2);min-height:58px}
.beheer-btn .nr{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
.beheer-btn .ttl{font-size:15px;font-weight:700;line-height:1.2}
.beheer-btn.on{background:var(--ac)!important;border-color:var(--ac)!important;color:var(--acink)!important}

/* Vaste terug- en ankerbalk voor subpagina's */
.crumb-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--sf);border:2px solid var(--ac);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.crumb-trail{font-size:14px;color:var(--mut);font-weight:600}
.crumb-trail b{color:var(--ink)}
.crumb-acts{display:flex;gap:8px;flex-wrap:wrap}

.box{background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}
.box-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:1100px){.grid5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
@media(max-width:620px){.grid5{grid-template-columns:1fr}}

.kaart{background:var(--sf2);border:1.5px solid var(--ln);border-radius:12px;padding:12px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:3px;color:var(--mut)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--ln);border-radius:10px;padding:7px 10px;width:100%;margin-bottom:9px;min-height:42px}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
.row-check{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.row-check input[type="checkbox"]{width:auto;min-height:auto;margin:0;width:20px;height:20px;accent-color:var(--ac)}
.row-check label{margin:0;color:var(--ink);cursor:pointer}
.chk-group{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.chk-pill{display:inline-flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--ln);padding:5px 10px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.chk-pill input{width:auto;min-height:auto;margin:0;width:18px;height:18px;accent-color:var(--ac)}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.search-wrap{flex:1;min-width:240px;display:flex;gap:6px;align-items:center}
.search-wrap input{margin-bottom:0;border-color:var(--ac)}
.stats-pill{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--mut);background:var(--sf2);padding:8px 12px;border-radius:10px;border:1px solid var(--ln);margin-bottom:12px}

.table-wrap{overflow-x:auto;max-height:66vh;border:1.5px solid var(--ln);border-radius:12px}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;z-index:2;background:var(--sf2);color:var(--mut);font-weight:700;font-size:14px;text-align:left;padding:9px 10px;border-bottom:2px solid var(--ln);white-space:nowrap}
tbody td{padding:8px 10px;border-bottom:1px solid var(--ln);font-size:15px;vertical-align:middle}
tbody tr:nth-child(even){background:var(--sf2)}
tbody tr:hover{background:var(--soft)}

.chip{display:inline-block;background:var(--soft);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.chip-ok{display:inline-block;background:rgba(31,122,77,0.15);color:var(--ok);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.chip-warn{display:inline-block;background:rgba(179,38,30,0.14);color:var(--bad);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.hond-main{font-weight:700;font-size:16px}
.hond-sub{color:var(--mut);font-size:13px}

.chip-slot{display:inline-block;background:rgba(255,210,63,0.28);color:var(--ink);border:1px solid rgba(180,83,9,0.45);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.warn-box{background:rgba(255,210,63,0.16);border:1.5px solid rgba(180,83,9,0.4);border-radius:12px;padding:12px;margin-bottom:12px}

.toast{position:fixed;bottom:18px;right:18px;background:var(--ok);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.22);z-index:99;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="top-l">
      <img src="nnfc-logo.png" alt="NNFC" onerror="this.style.display='none'">
      <div>
        <h1>Beheer / Admin – Voorbereiding & Inschrijvingen (<span id="lblJaar">2026</span>)</h1>
        <div class="sub">Inschrijven, baanindeling & 3 bijlagen, deelnemerslijst en jaarbeheer voor de wedstrijddag</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select id="selJaar" onchange="wisselJaar()" style="width:auto;margin:0;font-weight:700" aria-label="Selecteer wedstrijdjaar"></select>
      <span id="slotStatusBadge"></span>
      <a href="wedstrijdtafel.html" class="btn-link pri">Wedstrijdtafel →</a>
      <a href="banen.html" class="btn-link">Banen / Klokkers →</a>
      <a href="index.html" class="btn-link">← Startscherm</a>
    </div>
  </div>

  <!-- 5 BEHEERSECTIES -->
  <div class="beheer-nav" role="navigation" aria-label="Beheer secties">
    <button type="button" id="bhBtn1" class="beheer-btn on" onclick="gaNaarSectie(1)">
      <span class="nr">Deel 1 • Basis</span>
      <span class="ttl">Importeren (Excel / CSV)</span>
    </button>
    <button type="button" id="bhBtn2" class="beheer-btn" onclick="gaNaarSectie(2)">
      <span class="nr">Deel 2</span>
      <span class="ttl">Nieuwe inschrijving</span>
    </button>
    <button type="button" id="bhBtn3" class="beheer-btn" onclick="gaNaarSectie(3)">
      <span class="nr">Deel 3</span>
      <span class="ttl">Baanindeling & 3 Bijlagen</span>
    </button>
    <button type="button" id="bhBtn4" class="beheer-btn" onclick="gaNaarSectie(4)">
      <span class="nr">Deel 4</span>
      <span class="ttl">Deelnemerslijst & Banen</span>
    </button>
    <button type="button" id="bhBtn5" class="beheer-btn" onclick="gaNaarSectie(5)">
      <span class="nr">Deel 5 • Afsluiten</span>
      <span class="ttl">Back-up &amp; Jaarvergrendeling</span>
    </button>
  </div>

  <!-- VASTE ANKERBALK BIJ SUBPAGINA'S -->
  <div id="crumbBar" class="crumb-bar" style="display:none">
    <div id="crumbTrail" class="crumb-trail"></div>
    <div class="crumb-acts">
      <button type="button" class="sm" onclick="gaTerug()">← Terug</button>
      <a href="wedstrijdtafel.html" class="btn-link pri sm">Wedstrijdtafel</a>
    </div>
  </div>

  <div id="appContent"></div>
</div>

<div id="toast" class="toast">Opgeslagen</div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script>
var db = null;
var KLASSEN_OPTIES = ["Jeugd", "Open", "Veteranen", "Stamboomloos", "Specials"];
var BREVET_OPTIES = ["Geen", "Jeugdbrevet", "Brevet A", "Brevet B", "Brevet C", "Brevet D", "Brevet E", "Seaman Brevet"];
var KCM_OPTIES = ["GEEN", "BOB", "CAC", "Res. CAC", "U1", "U2", "U3", "U4", "U", "ZG", "G", "M", "S"];

var SECTIE_NAMEN = {
  1: "Importeren (Excel / CSV)",
  2: "Nieuwe inschrijving",
  3: "Baanindeling & 3 Bijlagen",
  4: "Deelnemerslijst & Banen",
  5: "Back-up & Jaarvergrendeling"
};

/* Optioneel wachtwoordslot (staat standaard UIT voor het testen) */
var WACHTWOORD_SLOT_ACTIEF = false;
var BEHEER_WACHTWOORD = "";

function controleerWachtwoordIndienActief() {
  if (!WACHTWOORD_SLOT_ACTIEF) return true;
  var invoer = window.prompt("Voer het beheerderswachtwoord in om deze actie uit te voeren:");
  if (invoer === null || invoer !== BEHEER_WACHTWOORD) {
    window.alert("Onjuist wachtwoord of geannuleerd. Actie afgebroken.");
    return false;
  }
  return true;
}

function initFirebase() {
  try {
    if (typeof firebase !== 'undefined' && typeof firebaseConfig !== 'undefined' && firebaseConfig.apiKey && firebaseConfig.apiKey !== "JOUW_API_KEY") {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    }
  } catch (e) {}
}
initFirebase();

function esc(str) {
  return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function toonToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg || 'Opgeslagen';
  el.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function() { el.style.display = 'none'; }, 1800);
}

function isGeldigJaar(y) {
  return /^20\d{2}$/.test(String(y == null ? '' : y).trim());
}

function bepaalStartJaar() {
  try {
    var params = new URLSearchParams(window.location.search || '');
    var q = params.get('jaar') || params.get('y') || params.get('year');
    if (isGeldigJaar(q)) return String(q).trim();
  } catch (e) {}
  try {
    var k1 = localStorage.getItem('nnfc_jaar');
    if (isGeldigJaar(k1)) return String(k1).trim();
    var k2 = localStorage.getItem('nnfc_actief_jaar');
    if (isGeldigJaar(k2)) return String(k2).trim();
  } catch (e) {}
  var huidigKalenderJaar = new Date().getFullYear();
  return (huidigKalenderJaar >= 2026 && huidigKalenderJaar <= 2040) ? String(huidigKalenderJaar) : '2026';
}

function bewaarActiefJaar(y, updateUrl) {
  if (!isGeldigJaar(y)) return;
  var s = String(y).trim();
  try {
    localStorage.setItem('nnfc_jaar', s);
    localStorage.setItem('nnfc_actief_jaar', s);
  } catch (e) {}
  if (updateUrl && window.history && window.history.replaceState) {
    try {
      var url = new URL(window.location.href);
      url.searchParams.set('jaar', s);
      window.history.replaceState(window.history.state, '', url.toString());
    } catch (e) {}
  }
}

var selJaarEl = document.getElementById('selJaar');
var standaardJaar = bepaalStartJaar();
for (var y = 2026; y <= 2040; y++) {
  var o = document.createElement('option');
  o.value = String(y);
  o.textContent = 'Jaar ' + y;
  if (String(y) === standaardJaar) o.selected = true;
  selJaarEl.appendChild(o);
}
if (!Array.from(selJaarEl.options).some(function(opt) { return opt.value === standaardJaar; })) {
  var extraOpt = document.createElement('option');
  extraOpt.value = standaardJaar;
  extraOpt.textContent = 'Jaar ' + standaardJaar;
  extraOpt.selected = true;
  selJaarEl.appendChild(extraOpt);
}

var jaar = selJaarEl.value;
bewaarActiefJaar(jaar, false);
document.getElementById('lblJaar').textContent = jaar;

function normaliseerBrevet(raw) {
  var s = String(raw == null ? '' : raw).trim();
  var low = s.toLowerCase();
  if (!low || low === 'geen' || low === 'nee' || low === '-') return 'Geen';
  if (low.indexOf('jeugd') !== -1) return 'Jeugdbrevet';
  if (low.indexOf('seaman') !== -1 || low === 'b8') return 'Seaman Brevet';
  if (low === 'brevet a' || low === 'b1') return 'Brevet A';
  if (low === 'brevet b' || low === 'b2') return 'Brevet B';
  if (low === 'brevet c' || low === 'b3') return 'Brevet C';
  if (low === 'brevet d' || low === 'b4') return 'Brevet D';
  if (low === 'brevet e' || low === 'b5') return 'Brevet E';
  if (low === 'b6') return 'Brevet D';
  if (low === 'b7') return 'Brevet E';
  var exact = BREVET_OPTIES.find(function(b) { return b.toLowerCase() === low; });
  return exact || 'Geen';
}

function volgendeBrevetNa(huidigBrevet) {
  var genormaliseerd = normaliseerBrevet(huidigBrevet);
  var idx = BREVET_OPTIES.indexOf(genormaliseerd);
  if (idx === -1 || idx >= BREVET_OPTIES.length - 1) return 'Seaman Brevet';
  return BREVET_OPTIES[idx + 1];
}

function normaliseerDeelnemerRecord(h) {
  if (!h || typeof h !== 'object') return h;
  var hb = normaliseerBrevet(h.huidigBrevet);
  var ob = h.opvolgendBrevet ? normaliseerBrevet(h.opvolgendBrevet) : volgendeBrevetNa(hb);
  if (hb !== 'Geen' && ob === hb) ob = volgendeBrevetNa(hb);
  h.huidigBrevet = hb;
  h.opvolgendBrevet = ob;
  return h;
}

var deelnemers = [];
var STANDAARD_BUFFER_PCT = 10;

function maakStandaardBaanIndeling() {
  return {
    banen: { "1": ["Open"], "2": ["Jeugd"], "3": ["Veteranen"], "4": ["Stamboomloos"], "5": ["Specials"] },
    bijlagen: { b1: "", b2: "", b3: "" },
    startNummersPerKlasse: {
      "Jeugd": null,
      "Open": null,
      "Veteranen": null,
      "Stamboomloos": null,
      "Specials": null
    },
    bufferPercentage: STANDAARD_BUFFER_PCT
  };
}

var baanIndeling = maakStandaardBaanIndeling();

var nav = {
  sectie: 1,
  sub: null,
  subLabel: '',
  zoek: '',
  baanFilter: 'ALLE'
};

function laadData() {
  try {
    var ruw = JSON.parse(localStorage.getItem('nnfc_deelnemers_' + jaar)) || [];
    deelnemers = ruw.map(normaliseerDeelnemerRecord);
  } catch (e) { deelnemers = []; }
  baanIndeling = maakStandaardBaanIndeling();
  try {
    var b = JSON.parse(localStorage.getItem('nnfc_baanindeling_' + jaar));
    if (b && b.banen) {
      var std = maakStandaardBaanIndeling();
      baanIndeling = {
        banen: Object.assign({ "1": [], "2": [], "3": [], "4": [], "5": [] }, b.banen),
        bijlagen: Object.assign({ b1: "", b2: "", b3: "" }, b.bijlagen || {}),
        startNummersPerKlasse: Object.assign(std.startNummersPerKlasse, b.startNummersPerKlasse || {}),
        bufferPercentage: (typeof b.bufferPercentage === 'number' && !isNaN(b.bufferPercentage) && b.bufferPercentage >= 0) ? b.bufferPercentage : STANDAARD_BUFFER_PCT
      };
    }
  } catch (e) {}
}

var jaarSlot = { vergrendeld: false, datum: '', toelichting: '' };

function laadSlot() {
  try {
    var raw = JSON.parse(localStorage.getItem('nnfc_slot_' + jaar));
    if (raw && typeof raw === 'object' && typeof raw.vergrendeld === 'boolean') {
      jaarSlot = {
        vergrendeld: raw.vergrendeld,
        datum: raw.datum || '',
        toelichting: raw.toelichting || ''
      };
    } else if (String(jaar) === '2026') {
      jaarSlot = {
        vergrendeld: true,
        datum: 'Afgesloten (2026)',
        toelichting: 'Jaar 2026 is afgesloten en alleen-lezen.'
      };
    } else {
      jaarSlot = { vergrendeld: false, datum: '', toelichting: '' };
    }
  } catch (e) {
    jaarSlot = { vergrendeld: String(jaar) === '2026', datum: '', toelichting: '' };
  }
  var badge = document.getElementById('slotStatusBadge');
  if (badge) {
    badge.innerHTML = jaarSlot.vergrendeld
      ? '<span class="chip-slot">🔒 Jaar ' + esc(jaar) + ' afgesloten (alleen-lezen)</span>'
      : '<span class="chip">Jaar ' + esc(jaar) + ' open</span>';
  }
  if (db) {
    try {
      db.ref('wedstrijd/slot_' + jaar).once('value', function(snap) {
        var remote = snap.val();
        if (remote && typeof remote === 'object' && typeof remote.vergrendeld === 'boolean') {
          jaarSlot = {
            vergrendeld: remote.vergrendeld,
            datum: remote.datum || '',
            toelichting: remote.toelichting || ''
          };
          localStorage.setItem('nnfc_slot_' + jaar, JSON.stringify(jaarSlot));
          var bEl = document.getElementById('slotStatusBadge');
          if (bEl) {
            bEl.innerHTML = jaarSlot.vergrendeld
              ? '<span class="chip-slot">🔒 Jaar ' + esc(jaar) + ' afgesloten (alleen-lezen)</span>'
              : '<span class="chip">Jaar ' + esc(jaar) + ' open</span>';
          }
        }
      });
    } catch (e) {}
  }
}

laadSlot();
laadData();

function syncFirebase() {
  if (!db) return;
  try {
    db.ref('wedstrijd/baanindeling_' + jaar).set(baanIndeling);
    var updates = {};
    var baanLijsten = { baan_1: [], baan_2: [], baan_3: [], baan_4: [], baan_5: [] };
    deelnemers.forEach(function(h) {
      updates[h.id] = h;
      var bKey = 'baan_' + String(h.baan || '1');
      if (baanLijsten[bKey] && h.aanwezig) {
        baanLijsten[bKey].push({
          nr: h.startnummer,
          roepnaam: h.roepnaam,
          stamboom: h.stamboom || '',
          klasse: h.klasse || '',
          geslacht: h.geslacht || '',
          opvolgendBrevet: h.opvolgendBrevet || '',
          buitenMededinging: !!h.buitenMededinging
        });
      }
    });
    db.ref('wedstrijd/beheer_deelnemers_' + jaar).set(updates);
    db.ref('wedstrijd/baan_lijsten_' + jaar).set(baanLijsten);
  } catch (e) {}
}

function bewaarDeelnemers(toastTekst) {
  deelnemers = deelnemers.map(normaliseerDeelnemerRecord);
  localStorage.setItem('nnfc_deelnemers_' + jaar, JSON.stringify(deelnemers));
  syncFirebase();
  render();
  if (toastTekst) toonToast(toastTekst);
}

function bewaarBaanIndeling(toastTekst) {
  localStorage.setItem('nnfc_baanindeling_' + jaar, JSON.stringify(baanIndeling));
  syncFirebase();
  render();
  if (toastTekst) toonToast(toastTekst);
}

function wisselJaar() {
  jaar = selJaarEl.value;
  bewaarActiefJaar(jaar, true);
  document.getElementById('lblJaar').textContent = jaar;
  laadSlot();
  laadData();
  render();
}

function gaNaarSectie(nr) {
  nav.sectie = nr;
  nav.sub = null;
  nav.subLabel = '';
  render();
}

function gaTerug() {
  if (nav.sub) {
    nav.sub = null;
    nav.subLabel = '';
  } else if (nav.sectie > 1) {
    nav.sectie = 1;
  }
  render();
}

function getKlasseStartVanaf(klasse) {
  if (!klasse || !baanIndeling || !baanIndeling.startNummersPerKlasse) return null;
  var raw = baanIndeling.startNummersPerKlasse[klasse];
  var n = parseInt(raw, 10);
  return (!isNaN(n) && n > 0) ? n : null;
}

function getBufferPercentage() {
  var pct = baanIndeling && typeof baanIndeling.bufferPercentage === 'number' ? baanIndeling.bufferPercentage : STANDAARD_BUFFER_PCT;
  return (!isNaN(pct) && pct >= 0) ? pct : STANDAARD_BUFFER_PCT;
}

function berekenBufferAantal(aantalInKlasse) {
  if (!aantalInKlasse || aantalInKlasse <= 0) return 0;
  var pct = getBufferPercentage();
  if (pct <= 0) return 0;
  return Math.max(1, Math.ceil(aantalInKlasse * (pct / 100)));
}

function volgendeStartnummer(klasse) {
  var bezet = new Set();
  deelnemers.forEach(function(h) {
    var n = parseInt(h.startnummer, 10);
    if (!isNaN(n) && n > 0) bezet.add(n);
  });
  var startVanaf = getKlasseStartVanaf(klasse);
  var kandidaat = startVanaf || 1;
  while (bezet.has(kandidaat)) {
    kandidaat++;
  }
  return kandidaat;
}

function nummerStartnummersInBlokkenPerKlasse() {
  if (waarschuwIndienVergrendeld()) return;
  if (!deelnemers.length) {
    alert('Er zijn nog geen deelnemers in ' + jaar + ' om door te nummeren.');
    return;
  }
  var pct = getBufferPercentage();
  if (!confirm('Alle ' + deelnemers.length + ' deelnemers van ' + jaar + ' doornummeren per klasse (incl. +' + pct + '% vrije nummers aan het eind van elke klasserange voor na-/daginschrijving)?')) return;

  var volgordeKlassen = KLASSEN_OPTIES.slice();
  var lopendNr = 1;
  var bijgewerkt = [];

  volgordeKlassen.forEach(function(kl) {
    var groep = deelnemers.filter(function(h) { return h.klasse === kl; });
    if (!groep.length) return;
    var ingesteldStart = getKlasseStartVanaf(kl);
    var startKl = (ingesteldStart && ingesteldStart >= lopendNr) ? ingesteldStart : lopendNr;
    var nr = startKl;
    groep.forEach(function(h) {
      h.startnummer = nr++;
      bijgewerkt.push(h);
    });
    var bufferSpots = berekenBufferAantal(groep.length);
    lopendNr = nr + bufferSpots;
  });

  // Eventuele deelnemers met een afwijkende klasse behouden
  deelnemers.forEach(function(h) {
    if (volgordeKlassen.indexOf(h.klasse) === -1) {
      h.startnummer = lopendNr++;
      bijgewerkt.push(h);
    }
  });

  deelnemers = bijgewerkt;
  bewaarDeelnemers('Startnummers ingedeeld per klasse (incl. +' + pct + '% buffer)');
}

function matchZoek(h, q) {
  if (!q) return true;
  var woorden = q.toLowerCase().trim().split(/\s+/);
  var tekst = [h.startnummer, '#' + h.startnummer, h.roepnaam, h.stamboom, h.eigenaar, h.district || '', h.lidnr, h.klasse, 'baan ' + h.baan].join(' ').toLowerCase();
  return woorden.every(function(w) { return tekst.indexOf(w) !== -1; });
}

var importStatusMelding = "";

function normaliseerKlasse(raw) {
  var s = String(raw || '').trim().toLowerCase();
  if (!s) return 'Open';
  if (s.indexOf('jeugd') !== -1) return 'Jeugd';
  if (s.indexOf('veteran') !== -1) return 'Veteranen';
  if (s.indexOf('stamboomloos') !== -1 || s.indexOf('zonder stamboom') !== -1) return 'Stamboomloos';
  if (s.indexOf('special') !== -1) return 'Specials';
  return 'Open';
}

function normaliseerGeslacht(raw) {
  var s = String(raw || '').trim().toLowerCase();
  if (s.indexOf('teef') !== -1 || s === 'f' || s === 'v') return 'Teef';
  return 'Reu';
}

function pakVeld(row, sleutels) {
  var keys = Object.keys(row || {});
  for (var i = 0; i < sleutels.length; i++) {
    var doel = sleutels[i].toLowerCase();
    for (var k = 0; k < keys.length; k++) {
      var schoonsleutel = keys[k].toLowerCase().replace(/[^a-z0-9]/g, '');
      var schoonDoel = doel.replace(/[^a-z0-9]/g, '');
      if (schoonsleutel === schoonDoel || schoonsleutel.indexOf(schoonDoel) !== -1) {
        var val = row[keys[k]];
        if (val !== undefined && val !== null && String(val).trim() !== '') return String(val).trim();
      }
    }
  }
  return '';
}

function verwerkGeimporteerdeRijen(rijen, modus) {
  if (waarschuwIndienVergrendeld()) return;
  if (!Array.isArray(rijen) || rijen.length === 0) {
    alert('Geen rijen gevonden in het bestand.');
    return;
  }
  if (modus === 'vervang') {
    var ok1 = window.confirm('Weet je het zeker dat je de huidige lijst van ' + jaar + ' volledig wilt vervangen?');
    if (!ok1) return;
    var ok2 = window.confirm('Weet je het écht zeker? De bestaande lijst van ' + jaar + ' wordt hiermee vervangen.');
    if (!ok2) return;
    deelnemers = [];
  }
  var toegevoegd = 0;

  rijen.forEach(function(row) {
    var roepnaam = pakVeld(row, ['roepnaam hond', 'roepnaam', 'hond', 'naam hond']);
    var stamboom = pakVeld(row, ['volledige naam van de hond', 'stamboomnaam', 'stamboom', 'naam']);
    var eigenaar = pakVeld(row, ['naam', 'eigenaar', 'geleider', 'lid naam', 'deelnemer']);
    if (!roepnaam && !stamboom) return;
    if (!roepnaam) roepnaam = stamboom;
    if (!stamboom) stamboom = roepnaam;
    if (!eigenaar) eigenaar = 'Onbekend';

    var district = pakVeld(row, ['traint in regio', 'district', 'regio', 'traint in regio / disctrict']);
    var lidnr = pakVeld(row, ['lidnr', 'lidnummer', 'lid nr']) || '—';
    var geslacht = normaliseerGeslacht(pakVeld(row, ['geslacht', 'sekse']));
    var klasse = normaliseerKlasse(pakVeld(row, ['klasse', 'deelnameklasse']));
    var huidigBrevet = normaliseerBrevet(pakVeld(row, ['heeft nu brevet', 'huidig brevet', 'brevet', 'nu brevet']));
    var opvolgendBrevet = volgendeBrevetNa(huidigBrevet);
    var kcm = pakVeld(row, ['kcm', 'kcm kwalificatie', 'kwalificatie']) || 'GEEN';
    var stamboomnr = pakVeld(row, ['stamboomnummer', 'nhsb', 'stamboomnr']);
    var geboortedatum = pakVeld(row, ['geboortedatum', 'geb. datum', 'geboren']);
    var kleur = pakVeld(row, ['kleur', 'vachtkleur']);
    var email = pakVeld(row, ['e-mail', 'email', 'opgegeven e-mailadres']);

    var nrRaw = parseInt(pakVeld(row, ['startnummer', 'startnr', 'start nr']), 10);
    var startnummer = (!isNaN(nrRaw) && nrRaw > 0 && !deelnemers.some(function(x) { return x.startnummer === nrRaw; })) ? nrRaw : volgendeStartnummer(klasse);

    deelnemers.push({
      id: 'imp_' + jaar + '_' + startnummer + '_' + Math.random().toString(36).slice(2, 6),
      startnummer: startnummer,
      roepnaam: roepnaam,
      stamboom: stamboom + (stamboomnr ? ' (' + stamboomnr + ')' : ''),
      eigenaar: eigenaar,
      district: district,
      lidnr: lidnr,
      geslacht: geslacht,
      klasse: klasse,
      huidigBrevet: huidigBrevet,
      opvolgendBrevet: opvolgendBrevet,
      kcm: kcm,
      geboortedatum: geboortedatum,
      kleur: kleur,
      email: email,
      buitenMededinging: false,
      baan: bepaalBaanVoorKlasse(klasse),
      aanwezig: false,
      betaald: true
    });
    toegevoegd++;
  });

  importStatusMelding = toegevoegd + ' inschrijving(en) verwerkt voor ' + jaar + '.';
  bewaarDeelnemers(toegevoegd + ' inschrijvingen geïmporteerd');
}

function handelBestandUpload(inputEl) {
  var file = inputEl && inputEl.files && inputEl.files[0];
  if (!file) return;
  var modusEl = document.getElementById('importModus');
  var modus = modusEl ? modusEl.value : 'toevoegen';

  if (typeof XLSX === 'undefined') {
    alert('Excel-lezer is niet beschikbaar. Gebruik een .csv-bestand of vul handmatig aan.');
    return;
  }

  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = new Uint8Array(e.target.result);
      var wb = XLSX.read(data, { type: 'array' });
      var sheet = wb.Sheets[wb.SheetNames[0]];
      var rijen = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      verwerkGeimporteerdeRijen(rijen, modus);
    } catch (err) {
      alert('Kon het bestand niet lezen: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function isJaarVergrendeld() {
  return !!(jaarSlot && jaarSlot.vergrendeld);
}

function waarschuwIndienVergrendeld() {
  if (isJaarVergrendeld()) {
    alert('Wedstrijdjaar ' + jaar + ' is vergrendeld en gefinaliseerd. Ontgrendel het jaar eerst in Deel 5 (Back-up & Jaarvergrendeling) als je wijzigingen wilt aanbrengen.');
    return true;
  }
  return false;
}

function toggleJaarSlot() {
  var toelichtingEl = document.getElementById('slotToelichting');
  var toelichting = toelichtingEl ? toelichtingEl.value.trim() : (jaarSlot.toelichting || '');
  if (!jaarSlot.vergrendeld) {
    if (!confirm('Weet je zeker dat je wedstrijdjaar ' + jaar + ' wilt finaliseren en vergrendelen?')) return;
    jaarSlot = {
      vergrendeld: true,
      datum: new Date().toLocaleDateString('nl-NL'),
      toelichting: toelichting
    };
    localStorage.setItem('nnfc_slot_' + jaar, JSON.stringify(jaarSlot));
    if (db) {
      try { db.ref('wedstrijd/slot_' + jaar).set(jaarSlot); } catch (e) {}
    }
    render();
    toonToast('Jaar ' + jaar + ' vergrendeld');
  } else {
    if (!confirm('Wedstrijdjaar ' + jaar + ' weer ontgrendelen voor aanpassingen?')) return;
    jaarSlot = { vergrendeld: false, datum: '', toelichting: toelichting };
    localStorage.setItem('nnfc_slot_' + jaar, JSON.stringify(jaarSlot));
    if (db) {
      try { db.ref('wedstrijd/slot_' + jaar).set(jaarSlot); } catch (e) {}
    }
    render();
    toonToast('Jaar ' + jaar + ' ontgrendeld');
  }
}

function synchroniseerNaarTafel() {
  localStorage.setItem('nnfc_deelnemers_' + jaar, JSON.stringify(deelnemers));
  localStorage.setItem('nnfc_baanindeling_' + jaar, JSON.stringify(baanIndeling));
  var kcmMap = {};
  deelnemers.forEach(function(h) {
    if (h.startnummer != null) kcmMap[String(h.startnummer)] = h.kcm || 'GEEN';
  });
  localStorage.setItem('nnfc_kcm_' + jaar, JSON.stringify(kcmMap));
  syncFirebase();
  if (db) {
    try {
      db.ref('wedstrijd/actief_jaar').set(jaar);
      db.ref('wedstrijd/kcm_selecties_' + jaar).set(kcmMap);
      db.ref('wedstrijd/slot_' + jaar).set(jaarSlot);
    } catch (e) {}
  }
  toonToast('Gesynchroniseerd met Wedstrijdtafel & Banen (' + jaar + ')');
}

function exportJSON() {
  var payload = {
    jaar: jaar,
    geexporteerdOp: new Date().toISOString(),
    slot: jaarSlot,
    baanIndeling: baanIndeling,
    deelnemers: deelnemers
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'nnfc_deelnemers_' + jaar + '_backup.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toonToast('JSON-back-up gedownload');
}

function importJSON(inputEl) {
  if (waarschuwIndienVergrendeld()) { inputEl.value = ''; return; }
  var file = inputEl && inputEl.files && inputEl.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data || !Array.isArray(data.deelnemers)) {
        alert('Ongeldig JSON-back-upbestand: deelnemerslijst ontbreekt.');
        return;
      }
      deelnemers = data.deelnemers.map(normaliseerDeelnemerRecord);
      if (data.baanIndeling && data.baanIndeling.banen) {
        baanIndeling = {
          banen: Object.assign({ "1": [], "2": [], "3": [], "4": [], "5": [] }, data.baanIndeling.banen),
          bijlagen: Object.assign({ b1: "", b2: "", b3: "" }, data.baanIndeling.bijlagen || {})
        };
        localStorage.setItem('nnfc_baanindeling_' + jaar, JSON.stringify(baanIndeling));
      }
      bewaarDeelnemers('JSON-back-up hersteld (' + deelnemers.length + ' deelnemers)');
    } catch (err) {
      alert('Kon JSON niet inlezen: ' + err.message);
    }
  };
  reader.readAsText(file);
}

  var badge = document.getElementById('slotStatusBadge');
  if (badge) {

      : '<span class="chip">Jaar ' + esc(jaar) + ' open</span>';
  }
  updateCrumbBar();
  var html = '';
  if (nav.sectie === 1) html = renderSectie1();
  else if (nav.sectie === 2) html = renderSectie2();
  else if (nav.sectie === 3) html = renderSectie3();
  else if (nav.sectie === 4) html = renderSectie4();
  else if (nav.sectie === 5) html = renderSectie5();
  var bannerHtml = isJaarVergrendeld()
    ? '<div class="warn-box" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">' +
        '<div><b>🔒 Wedstrijdjaar ' + esc(jaar) + ' is afgesloten en vergrendeld (alleen-lezen)</b>' +
        '<div class="sub">Bewerken, importeren, inschrijven en verwijderen zijn uitgeschakeld. Je kunt data bekijken, exporteren of het jaar in Deel 5 ontgrendelen.</div></div>' +
        '<button type="button" class="sm" onclick="gaNaarSectie(5)">Naar jaarvergrendeling →</button>' +
      '</div>'
    : '';
  document.getElementById('appContent').innerHTML = bannerHtml + html;
  if (isJaarVergrendeld()) {
    var container = document.getElementById('appContent');
    container.querySelectorAll('input,select,textarea').forEach(function(el) {
      if (el.id === 'slotToelichting') return;
      el.disabled = true;
    });
    container.querySelectorAll('button').forEach(function(btn) {
      var txt = (btn.textContent || '').trim();
      if (txt.indexOf('Ontgrendel jaar') !== -1 || txt.indexOf('Download') !== -1 || txt.indexOf('Back-up (JSON)') !== -1 || txt.indexOf('Bekijk') !== -1 || txt.indexOf('Naar jaarvergrendeling') !== -1) return;
      btn.disabled = true;
    });
  }
}

render();
</script>
</body>
</html>
