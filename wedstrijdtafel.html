<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedstrijdtafel – NNFC</title>
<style>
:root{
  --bg:#EEF3F5;--sf:#FFFFFF;--sf2:#F7FAFC;--ink:#0E2A3A;--mut:#4D6573;--ac:#0B6E8F;--acink:#FFFFFF;
  --cur:#FFD23F;--curink:#1B1500;--bad:#B3261E;--ok:#1F7A4D;--ln:#C3D3DB;--soft:#DDE8ED;--warn:#B45309;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1A22;--sf:#14293A;--sf2:#102230;--ink:#E8F1F5;--mut:#9DB4C1;--ac:#4CC3E6;--acink:#06222E;
    --cur:#FFD23F;--curink:#1B1500;--bad:#FF8A80;--ok:#6FD6A0;--ln:#2C4558;--soft:#1D3547;--warn:#FBBF6A;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow Semi Condensed',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.35}
.wrap{max-width:1380px;margin:0 auto;padding:14px 18px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:12px 16px}
.top-l{display:flex;align-items:center;gap:12px}
.top img{width:48px;height:48px;border-radius:50%;flex:none}
h1{font-size:23px;margin:0;font-weight:700;line-height:1.15}
h2{font-size:19px;margin:0;font-weight:700}
h3{font-size:16px;margin:0 0 6px;font-weight:700}
.sub{color:var(--mut);font-size:14px}
button,.btn-link{font:inherit;color:inherit;border:1.5px solid var(--ln);background:var(--sf);border-radius:10px;min-height:40px;padding:6px 13px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .12s,border-color .12s}
button:hover,.btn-link:hover{background:var(--sf2)}
.pri{background:var(--ac)!important;border-color:var(--ac)!important;color:var(--acink)!important}
.ok{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important}
.bad{border-color:var(--bad)!important;color:var(--bad)!important;min-height:34px;padding:3px 9px}
.sm{min-height:34px;padding:3px 9px;font-size:15px}

/* Chronologische 6-stappen balk */
.dag-nav{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px;background:var(--sf);border:2px solid var(--ln);border-radius:14px;padding:8px}
@media(max-width:1180px){.dag-nav{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.dag-nav{grid-template-columns:1fr}}
.dag-btn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;padding:8px 12px;border-radius:10px;background:var(--sf2);min-height:58px}
.dag-btn .nr{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
.dag-btn .ttl{font-size:15px;font-weight:700;line-height:1.2}
.dag-btn.on{background:var(--ac)!important;border-color:var(--ac)!important;color:var(--acink)!important}

/* Vaste navigatiebalk voor sub- en sub-subpagina's */
.crumb-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--sf);border:2px solid var(--ac);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.crumb-trail{font-size:14px;color:var(--mut);font-weight:600}
.crumb-trail b{color:var(--ink)}
.crumb-acts{display:flex;gap:8px;flex-wrap:wrap}

.box{background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}
.box-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:1100px){.grid5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
@media(max-width:620px){.grid5{grid-template-columns:1fr}}

.kaart{background:var(--sf2);border:1.5px solid var(--ln);border-radius:12px;padding:12px}
.kaart-click{cursor:pointer;transition:border-color .12s,transform .08s}
.kaart-click:hover{border-color:var(--ac)}

label{display:block;font-weight:600;font-size:14px;margin-bottom:3px;color:var(--mut)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--ln);border-radius:10px;padding:7px 10px;width:100%;margin-bottom:9px;min-height:40px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{min-height:36px;padding:4px 12px;font-size:15px;border-radius:999px;background:var(--sf2)}
.tab.on{background:var(--ac);border-color:var(--ac);color:var(--acink)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.search-wrap{flex:1;min-width:240px;display:flex;gap:6px;align-items:center}
.search-wrap input{margin-bottom:0;border-color:var(--ac)}
.stats-pill{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--mut);background:var(--sf2);padding:8px 12px;border-radius:10px;border:1px solid var(--ln);margin-bottom:12px}

.table-wrap{overflow-x:auto;max-height:68vh;border:1.5px solid var(--ln);border-radius:12px}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;z-index:2;background:var(--sf2);color:var(--mut);font-weight:700;font-size:14px;text-align:left;padding:9px 10px;border-bottom:2px solid var(--ln);white-space:nowrap}
tbody td{padding:8px 10px;border-bottom:1px solid var(--ln);font-size:15px;vertical-align:middle}
tbody tr:nth-child(even){background:var(--sf2)}
tbody tr:hover{background:var(--soft)}

.chip{display:inline-block;background:var(--soft);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.chip-ok{display:inline-block;background:rgba(31,122,77,0.15);color:var(--ok);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.chip-warn{display:inline-block;background:rgba(179,38,30,0.14);color:var(--bad);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.chip-kcm{display:inline-block;background:var(--cur);color:var(--curink);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.chk{width:22px;height:22px;accent-color:var(--ok);cursor:pointer;margin:0}
.hond-main{font-weight:700;font-size:16px}
.hond-sub{color:var(--mut);font-size:13px}
.tijd-mono{font-variant-numeric:tabular-nums;font-weight:700}

@media print{
  body{background:#fff!important;color:#000!important;font-size:12pt}
  .top,.dag-nav,.crumb-bar,.no-print{display:none!important}
  .wrap{max-width:100%;padding:0;margin:0}
  .box{border:none;padding:0;margin:0 0 14px;background:#fff}
  .table-wrap{max-height:none;overflow:visible;border:1px solid #999}
  thead th{background:#eee!important;color:#000!important;position:static}
  tbody tr:nth-child(even){background:#f8f8f8!important}
  .print-kop{display:block!important;margin-bottom:12px;border-bottom:2px solid #000;padding-bottom:6px}
}
.print-kop{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="top-l">
      <img src="nnfc-logo.png" alt="NNFC" onerror="this.style.display='none'">
      <div>
        <h1>Wedstrijdtafel (<span id="lblJaar">2026</span>)</h1>
        <div class="sub">Dagverloop • Direct schakelen per fase</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select id="selJaar" onchange="wisselJaar()" style="width:auto;margin:0;font-weight:700" aria-label="Selecteer wedstrijdjaar"></select>
      <a href="banen.html" class="btn-link">Banen / Klokkers →</a>
      <a href="beheer.html" class="btn-link">Beheer / Admin →</a>
      <a href="index.html" class="btn-link">← Startscherm</a>
    </div>
  </div>

  <!-- 6 CHRONOLOGISCHE DAGSTAPPEN -->
  <div class="dag-nav" role="navigation" aria-label="Dagverloop Wedstrijdtafel">
    <button type="button" id="stepBtn1" class="dag-btn on" onclick="gaNaarStap(1)">
      <span class="nr">Stap 1 • Ochtend</span>
      <span class="ttl">1. Aanmelden & Startnummer</span>
    </button>
    <button type="button" id="stepBtn2" class="dag-btn" onclick="gaNaarStap(2)">
      <span class="nr">Stap 2 • Ochtend / Middag</span>
      <span class="ttl">2. Basis oefeningen & Tijden</span>
    </button>
    <button type="button" id="stepBtn3" class="dag-btn" onclick="gaNaarStap(3)">
      <span class="nr">Stap 3 • Middag</span>
      <span class="ttl">3. Brevetten</span>
    </button>
    <button type="button" id="stepBtn4" class="dag-btn" onclick="gaNaarStap(4)">
      <span class="nr">Stap 4 • Finale</span>
      <span class="ttl">4. Beste Reu & Beste Teef</span>
    </button>
    <button type="button" id="stepBtn5" class="dag-btn" onclick="gaNaarStap(5)">
      <span class="nr">Stap 5 • Prijsuitreiking</span>
      <span class="ttl">5. Tijd/Punten &amp; Export/Print</span>
    </button>
    <button type="button" id="stepBtn6" class="dag-btn" onclick="gaNaarStap(6)">
      <span class="nr">Stap 6 • Trofeeën</span>
      <span class="ttl">6. Bekers</span>
    </button>
  </div>

  <!-- VASTE NAVIGATIEBALK VOOR SUB- EN SUB-SUBPAGINA'S -->
  <div id="crumbBar" class="crumb-bar" style="display:none">
    <div id="crumbTrail" class="crumb-trail"></div>
    <div class="crumb-acts">
      <button type="button" class="sm" onclick="gaTerug()">← Terug</button>
      <button type="button" class="pri sm" onclick="gaNaarWedstrijdtafel()">Wedstrijdtafel</button>
    </div>
  </div>

  <div id="appContent"></div>
</div>

<script src="config.js"></script>
<script src="nnfc-jaar-nav.js"></script>
<script>
var db = null;
var KCM_PUNTEN = {"GEEN":0,"BOB":75,"CAC":70,"Res. CAC":65,"U1":55,"U2":50,"U3":45,"U4":40,"U":35,"ZG":25,"G":15,"M":10,"S":5};
var STAP_NAMEN = {

  4: "4. Beste Reu & Beste Teef",

};
var BEKER_DEFINITIES = [

    opbouw: "Snelste hond in de klasse Jeugd."
  }
];
var berekeningMelding = "";

function initFirebase() {
  try {
    if (typeof firebase !== 'undefined' && typeof firebaseConfig !== 'undefined' && firebaseConfig.apiKey && firebaseConfig.apiKey !== "JOUW_API_KEY") {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    }
  } catch (e) {}
}
initFirebase();

function esc(str) {
  return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtCs(cs) {
  if (cs == null || isNaN(cs)) return '—';
  var v = Math.round(Number(cs));
  var m = Math.floor(v / 6000);
  var s = Math.floor((v % 6000) / 100);
  var c = v % 100;
  var pad2 = function(n) { return n < 10 ? '0' + n : '' + n; };
  return m ? (m + ':' + pad2(s) + ',' + pad2(c)) : (s + ',' + pad2(c));
}

function parseTijdNaarCs(str) {
  if (str == null) return null;
  var clean = String(str).trim();
  if (!clean || clean === '—') return null;
  if (/weigering/i.test(clean) || /^w$/i.test(clean)) return 60000;
  var mMatch = clean.match(/^(\d+):(\d{1,2})[,.](\d{1,2})$/);
  if (mMatch) {
    return parseInt(mMatch[1], 10) * 6000 + parseInt(mMatch[2], 10) * 100 + parseInt((mMatch[3] + '0').slice(0, 2), 10);
  }
  var sMatch = clean.match(/^(\d+)[,.](\d{1,2})$/);
  if (sMatch) {
    return parseInt(sMatch[1], 10) * 100 + parseInt((sMatch[2] + '0').slice(0, 2), 10);
  }
  return null;
}

var selJaarEl = document.getElementById('selJaar');
var huidigKalenderJaar = new Date().getFullYear();
var fallbackTafelJaar = (huidigKalenderJaar >= 2026 && huidigKalenderJaar <= 2040) ? String(huidigKalenderJaar) : '2026';
var standaardJaar = (window.NNFCJaarNav && typeof window.NNFCJaarNav.bepaalStartJaar === 'function')
  ? window.NNFCJaarNav.bepaalStartJaar(fallbackTafelJaar)
  : fallbackTafelJaar;
for (var y = 2026; y <= 2040; y++) {
  var o = document.createElement('option');
  o.value = String(y);
  o.textContent = 'Jaar ' + y;
  if (String(y) === standaardJaar) o.selected = true;
  selJaarEl.appendChild(o);
}

var jaar = selJaarEl.value;
document.getElementById('lblJaar').textContent = jaar;

var deelnemers = [];
var baanIndeling = { banen: { "1": ["Open"], "2": ["Jeugd"], "3": ["Veteranen"], "4": ["Stamboomloos"], "5": ["Specials"] }, bijlagen: { b1: "", b2: "", b3: "" } };
var tafelData = {};
var klokkerLogStore = { registraties: {}, meldingen: {}, verwerkt: {} };
var fbRefsActief = [];

var nav = {
  stap: 1,
  sub: null,
  subLabel: '',
  subSub: null,
  subSubLabel: '',
  zoek: '',
  baanFilter: 'ALLE',
  klasseFilter: 'ALLE'
};

function isJaarVergrendeldTafel() {
  try {
    var raw = localStorage.getItem('nnfc_slot_' + jaar);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed && typeof parsed.vergrendeld === 'boolean') return parsed.vergrendeld;
    }
  } catch (e) {}
  return String(jaar) === '2026';
}

function waarschuwVergrendeldTafel() {
  if (isJaarVergrendeldTafel()) {
    alert('Wedstrijdjaar ' + jaar + ' is afgesloten en vergrendeld (alleen-lezen). Open Beheer / Admin om het jaar te ontgrendelen indien nodig.');
    return true;
  }
  return false;
}

function maakStandaardTafelRecord() {
  return {
    basisPunten: '',
    basisStatus: 'Open',
    tijdA: null,
    tijdB: null,
    tijdC: null,
    totaalTijdCs: null,
    brevetUitslag: (isJaarVergrendeldTafel() ? 'Afgesloten' : 'Nog niet gezwommen'),
    brevetOpmerking: '',
    rtKandidaat: false,
    rtRang: '',
    beker: ''
  };
}

function herberekenHondTotaalTijd(td) {
  if (!td) return;
  var a = td.tijdA && typeof td.tijdA.cs === 'number' ? td.tijdA.cs : null;
  var b = td.tijdB && typeof td.tijdB.cs === 'number' ? td.tijdB.cs : null;
  var c = td.tijdC && typeof td.tijdC.cs === 'number' ? td.tijdC.cs : null;
  if (a !== null && b !== null && c !== null) {
    td.totaalTijdCs = a + b + c;
    if (td.basisStatus === 'Open') td.basisStatus = 'Klaar';
  } else if (a !== null || b !== null || c !== null) {
    td.totaalTijdCs = (a || 0) + (b || 0) + (c || 0);
    if (td.basisStatus === 'Open') td.basisStatus = 'Bezig';
  } else {
    td.totaalTijdCs = null;
  }
}

function verwerkKlokkerRegistratieInTafel(reg) {
  if (!reg) return false;
  var nr = parseInt(reg.startnummer, 10);
  if (!nr) return false;
  var hond = deelnemers.find(function(x) { return Number(x.startnummer) === nr; });
  if (!hond) return false;
  if (!tafelData[hond.id]) tafelData[hond.id] = maakStandaardTafelRecord();
  var td = tafelData[hond.id];
  var oef = String(reg.oefening || '').toUpperCase();
  var cs = typeof reg.tijdCs === 'number' ? reg.tijdCs : parseTijdNaarCs(reg.tijdTekst);
  var isWeig = reg.type === 'WEIGERING' || /weigering/i.test(String(reg.tijdTekst || ''));

  if (oef === 'A' || oef === 'B' || oef === 'C') {
    var veld = 'tijd' + oef;
    var nieuwCs = cs != null ? cs : (isWeig ? 60000 : null);
    if (nieuwCs != null) {
      var bestaand = td[veld];
      if (!bestaand || bestaand.bronId !== reg.id) {
        td[veld] = {
          cs: nieuwCs,
          tekst: isWeig ? 'Weigering (600,00s)' : fmtCs(nieuwCs),
          weigering: isWeig,
          bronId: reg.id || ('REG_' + oef + '_' + nr)
        };
        herberekenHondTotaalTijd(td);
        return true;
      }
    }
  } else if (oef === 'BREVET') {
    var nieuwBrevet = (reg.type === 'BREVET_OK' || /uitgevoerd/i.test(String(reg.tijdTekst || '')))
      ? 'Geslaagd'
      : (isWeig ? 'Niet geslaagd' : null);
    if (nieuwBrevet && td.brevetBronId !== reg.id) {
      td.brevetUitslag = nieuwBrevet;
      td.brevetBronId = reg.id || ('REG_BR_' + nr);
      return true;
    }
  }
  return false;
}

function synchroniseerAlleKlokkerBronnen(ookBewaren) {
  var gewijzigd = false;
  ['1','2','3','4','5'].forEach(function(bNr) {
    try {
      var rawBox = JSON.parse(localStorage.getItem('nnfc_klokker_outbox_' + jaar + '_' + bNr)) || [];
      rawBox.forEach(function(item) {
        if (!item || !item.data) return;
        if (item.pad === 'registraties' && item.data.id) {
          klokkerLogStore.registraties[item.data.id] = item.data;
        }
        if (item.pad === 'meldingen' && item.data.id) {
          klokkerLogStore.meldingen[item.data.id] = item.data;
        }
      });
    } catch (e) {}

    try {
      var rawState = JSON.parse(localStorage.getItem('nnfc_klokker_state_' + jaar + '_' + bNr));
      if (rawState && rawState.ox) {
        ['A','B','C','BREVET'].forEach(function(exKey) {
          var resMap = (rawState.ox[exKey] && rawState.ox[exKey].res) || {};
          Object.keys(resMap).forEach(function(hId) {
            var r = resMap[hId];
            var nr = parseInt(hId, 10);
            var hObj = deelnemers.find(function(x) { return Number(x.startnummer) === nr; });
            var isBasis = (exKey === 'A' || exKey === 'B' || exKey === 'C');
            var cs = r.t === 'tijd' ? r.cs : (r.t === 'weigering' && isBasis ? 60000 : null);
            var tijdTxt = r.t === 'tijd' ? fmtCs(r.cs) : (r.t === 'ok' ? 'UITGEVOERD' : (isBasis ? 'WEIGERING (600,00s)' : 'WEIGERING'));
            var recId = 'STATE_' + jaar + '_B' + bNr + '_' + exKey + '_' + hId;
            if (!klokkerLogStore.registraties[recId]) {
              klokkerLogStore.registraties[recId] = {
                id: recId,
                jaar: jaar,
                baan: bNr,
                oefening: exKey,
                startnummer: nr || hId,
                roepnaam: hObj ? hObj.roepnaam : '',
                type: r.t === 'tijd' ? 'TIJD' : (r.t === 'ok' ? 'BREVET_OK' : 'WEIGERING'),
                tijdTekst: tijdTxt,
                tijdCs: cs,
                bron: 'klokker_state'
              };
            }
          });
        });
      }
    } catch (e) {}
  });

  Object.keys(klokkerLogStore.registraties).forEach(function(id) {
    var reg = klokkerLogStore.registraties[id];
    if (reg && (!reg.jaar || String(reg.jaar) === String(jaar))) {
      if (verwerkKlokkerRegistratieInTafel(reg)) gewijzigd = true;
    }
  });

  localStorage.setItem('nnfc_tafel_klokkerlog_' + jaar, JSON.stringify(klokkerLogStore));
  if (gewijzigd && ookBewaren && !isJaarVergrendeldTafel()) {
    localStorage.setItem('nnfc_tafel_' + jaar, JSON.stringify(tafelData));
    if (db) {
      try {
        db.ref('wedstrijd/tafel_status_' + jaar).set(tafelData);
        db.ref('wedstrijd/tafel_klokkerlog_' + jaar).set(klokkerLogStore);
      } catch (e) {}
    }
  }
}

function koppelFirebaseListeners() {
  if (!db) return;
  fbRefsActief.forEach(function(r) { try { r.off(); } catch (e) {} });
  fbRefsActief = [];

  var refReg = db.ref('wedstrijd/registraties_' + jaar);
  refReg.on('value', function(snap) {
    var val = snap.val() || {};
    var nieuw = false;
    Object.keys(val).forEach(function(k) {
      var item = val[k];
      if (!item) return;
      klokkerLogStore.registraties[item.id || k] = item;
      if (verwerkKlokkerRegistratieInTafel(item)) nieuw = true;
    });
    localStorage.setItem('nnfc_tafel_klokkerlog_' + jaar, JSON.stringify(klokkerLogStore));
    if (nieuw && !isJaarVergrendeldTafel()) {
      localStorage.setItem('nnfc_tafel_' + jaar, JSON.stringify(tafelData));
      try { db.ref('wedstrijd/tafel_status_' + jaar).set(tafelData); } catch (e) {}
    }
    render();
  });
  fbRefsActief.push(refReg);

  var refMel = db.ref('wedstrijd/meldingen_' + jaar);
  refMel.on('value', function(snap) {
    var val = snap.val() || {};
    Object.keys(val).forEach(function(k) {
      var item = val[k];
      if (!item) return;
      klokkerLogStore.meldingen[item.id || k] = item;
    });
    localStorage.setItem('nnfc_tafel_klokkerlog_' + jaar, JSON.stringify(klokkerLogStore));
    render();
  });
  fbRefsActief.push(refMel);
}

function laadData() {
  try { deelnemers = JSON.parse(localStorage.getItem('nnfc_deelnemers_' + jaar)) || []; } catch (e) { deelnemers = []; }
  try {
    var b = JSON.parse(localStorage.getItem('nnfc_baanindeling_' + jaar));
    if (b && b.banen) baanIndeling = b;
  } catch (e) {}
  try { tafelData = JSON.parse(localStorage.getItem('nnfc_tafel_' + jaar)) || {}; } catch (e) { tafelData = {}; }
  try {
    var kl = JSON.parse(localStorage.getItem('nnfc_tafel_klokkerlog_' + jaar));
    if (kl && kl.registraties) klokkerLogStore = kl;
    else klokkerLogStore = { registraties: {}, meldingen: {}, verwerkt: {} };
  } catch (e) { klokkerLogStore = { registraties: {}, meldingen: {}, verwerkt: {} }; }

  deelnemers.forEach(function(h) {
    if (!tafelData[h.id]) {
      tafelData[h.id] = maakStandaardTafelRecord();
    } else {
      herberekenHondTotaalTijd(tafelData[h.id]);
    }
  });
  synchroniseerAlleKlokkerBronnen(true);
  koppelFirebaseListeners();
}
laadData();

function berekenTijdenEnPunten(stil) {
  if (!stil && waarschuwVergrendeldTafel()) return 0;
  var groepen = {};
  deelnemers.forEach(function(h) {
    if (!tafelData[h.id]) tafelData[h.id] = maakStandaardTafelRecord();
    herberekenHondTotaalTijd(tafelData[h.id]);
    if (h.buitenMededinging) return;
    var td = tafelData[h.id];
    if (!td || td.totaalTijdCs == null || td.totaalTijdCs <= 0) return;
    var kl = (h.klasse || 'Overig').trim();
    var groepSleutel = kl.toLowerCase() === 'open'
      ? ('Open_' + (h.geslacht || 'Onbekend'))
      : kl;
    if (!groepen[groepSleutel]) groepen[groepSleutel] = [];
    groepen[groepSleutel].push({ hond: h, td: td, tijd: td.totaalTijdCs });
  });

  var aantalBerekend = 0;
  Object.keys(groepen).forEach(function(gKey) {
    var lijst = groepen[gKey].slice().sort(function(a, b) { return a.tijd - b.tijd; });
    lijst.forEach(function(item, idx) {
      var pnt = Math.max(0, 250 - (idx * 5));
      item.td.basisPunten = pnt;
      item.td.basisStatus = 'Klaar';
      aantalBerekend++;
    });
  });

  berekeningMelding = 'Tijden en punten bijgewerkt (art. 2.15) voor ' + aantalBerekend + ' deelnemers.';
  if (!stil) {
    bewaarAlles();
  }
  return aantalBerekend;
}

function berekenPuntenUitTijden() {
  berekenTijdenEnPunten(false);
}

function pasKlokkerCorrectieToe(melId) {
  if (waarschuwVergrendeldTafel()) return;
  var m = klokkerLogStore.meldingen[melId];
  if (!m) return;
  if (m.soort === 'CORRECTIE' && m.startnummer && m.oefening) {
    var cs = typeof m.nieuweTijdCs === 'number' ? m.nieuweTijdCs : parseTijdNaarCs(m.nieuweTijd);
    var syntheticReg = {
      id: 'CORR_APPLIED_' + melId,
      jaar: jaar,
      baan: m.baan,
      oefening: m.oefening,
      startnummer: m.startnummer,
      roepnaam: m.roepnaam || '',
      type: 'TIJD',
      tijdTekst: m.nieuweTijd || fmtCs(cs),
      tijdCs: cs
    };
    klokkerLogStore.registraties[syntheticReg.id] = syntheticReg;
    verwerkKlokkerRegistratieInTafel(syntheticReg);
  }
  m.status = 'AFGEHANDELD';
  klokkerLogStore.verwerkt[melId] = true;
  if (db) {
    try { db.ref('wedstrijd/meldingen_' + jaar + '/' + melId + '/status').set('AFGEHANDELD'); } catch (e) {}
  }
  bewaarAlles();
}

function matchZoek(h, q) {
  if (!q) return true;
  var woorden = q.toLowerCase().trim().split(/\s+/);
  var tekst = [
    h.startnummer, '#' + h.startnummer, h.roepnaam, h.stamboom, h.eigenaar,
    h.district || '', h.lidnr, h.klasse, h.geslacht, h.huidigBrevet, h.opvolgendBrevet,
    'baan ' + h.baan, h.aanwezig ? 'aanwezig' : 'afwezig', h.betaald ? 'betaald' : 'nog betalen'
  ].join(' ').toLowerCase();
  return woorden.every(function(w) { return tekst.indexOf(w) !== -1; });
}

function wijzigOefeningTijdTafel(id, oef, invoer) {
  if (waarschuwVergrendeldTafel()) return;
  var td = tafelData[id];
  if (!td) return;
  var veld = 'tijd' + oef;
  var clean = String(invoer || '').trim();
  if (!clean) {
    td[veld] = null;
    herberekenHondTotaalTijd(td);
    bewaarAlles();
    return;
  }
  var cs = parseTijdNaarCs(clean);
  if (cs == null) {
    alert('Ongeldige tijd. Gebruik bijv. 45,20 of 1:12,35 of W voor weigering (600,00s).');
    render();
    return;
  }
  var isWeig = /^w/i.test(clean) || cs === 60000;
  td[veld] = {
    cs: cs,
    tekst: isWeig ? 'Weigering (600,00s)' : fmtCs(cs),
    weigering: isWeig,
    bronId: 'TAFEL_HAND_' + oef + '_' + Date.now()
  };
  herberekenHondTotaalTijd(td);
  bewaarAlles();
}

  var eindLijst = deelnemers.slice().sort(function(a, b) {
    var diffPnt = totaalPunten(b) - totaalPunten(a);
    if (diffPnt !== 0) return diffPnt;
    var tA = (tafelData[a.id] && tafelData[a.id].totaalTijdCs != null) ? tafelData[a.id].totaalTijdCs : 9999999;
    var tB = (tafelData[b.id] && tafelData[b.id].totaalTijdCs != null) ? tafelData[b.id].totaalTijdCs : 9999999;
    return tA - tB;
  });

  var standaardKlassen = ['Jeugd', 'Open', 'Veteranen', 'Stamboomloos', 'Specials'];
  var alleKlassen = standaardKlassen.slice();
  deelnemers.forEach(function(h) {
    var k = (h.klasse || '').trim();
    if (k && alleKlassen.indexOf(k) === -1) alleKlassen.push(k);
  });

  var toonUitslagen = !nav.sub || nav.sub === 'UITSLAGEN' || nav.sub === 'PER_KLASSE';
  var toonBrevetten = !nav.sub || nav.sub === 'BREVETTEN_LIJST';
  var toonBekers = !nav.sub || nav.sub === 'BEKERS';

  function bouwUitslagRijen(lijst) {
    return lijst.map(function(h, idx) {
      var td = tafelData[h.id] || {};

      return '<tr>' +
        '<td><b>' + (idx + 1) + '.</b></td>' +
        '<td><b>#' + esc(h.startnummer) + '</b></td>' +
        '<td><b>' + esc(h.roepnaam) + '</b> <span class="hond-sub">(' + esc(h.stamboom) + ')</span>' + (h.buitenMededinging ? ' <span class="chip">* Buiten med.</span>' : '') + '</td>' +
        '<td>' + esc(h.eigenaar) + '</td>' +
        '<td><span class="chip">' + esc(h.klasse || '—') + '</span></td>' +
        '<td class="tijd-mono">' + tijdStr + '</td>' +
        '<td>' + (td.basisPunten || 0) + '</td>' +
        '<td>' + (KCM_PUNTEN[h.kcm || 'GEEN'] || 0) + '</td>' +
        '<td><b>' + totaalPunten(h) + '</b></td>' +
        '<td>' + esc(td.brevetUitslag || '—') + '</td>' +

      uitslagenHtml = '<div class="box no-print" style="padding:12px 16px">' + klassePills + '</div>' +

      var titelSuffix = nav.klasseFilter === 'ALLE' ? 'Alle klassen' : 'Klasse ' + nav.klasseFilter;
      uitslagenHtml = '<div class="box">' +
        '<div class="box-head"><h2>Einduitslag & Puntentelling – ' + esc(titelSuffix) + ' (' + esc(jaar) + ')</h2></div>' +
        klassePills +
        '<div class="table-wrap"><table><thead><tr>' +
          '<th>Pos</th><th>Nr</th><th>Hond</th><th>Eigenaar</th><th>Klasse</th><th>Eindtijd</th><th>Trials</th><th>KCM</th><th>Totaal</th><th>Brevet</th><th>Beker / Prijs</th>' +
        '</tr></thead><tbody>' + (bouwUitslagRijen(gefilterdeEindLijst) || '<tr><td colspan="11" class="sub" style="padding:14px">Nog geen uitslagen beschikbaar voor deze selectie.</td></tr>') + '</tbody></table></div>' +
      '</div>';
    }
  }

  var brevetRows = geslaagdeBrevetten.map(function(h) {
    return '<tr>' +
      '<td><b>#' + esc(h.startnummer) + '</b></td>' +
      '<td><b>' + esc(h.roepnaam) + '</b> (' + esc(h.stamboom) + ')</td>' +
      '<td>' + esc(h.eigenaar) + '</td>' +
      '<td><b>' + esc(h.opvolgendBrevet) + '</b></td>' +
    '</tr>';
  }).join('');

  var bekerLijst = eindLijst.filter(function(h) {
    var td = tafelData[h.id] || {};
    return (td.beker && td.beker.trim()) || (td.rtRang && td.rtRang.trim());
  });
  var bekerRows = bekerLijst.map(function(h) {
    var td = tafelData[h.id] || {};
    var prijs = [td.rtRang, td.beker].filter(Boolean).join(' • ');
    return '<tr>' +
      '<td><b>#' + esc(h.startnummer) + '</b></td>' +
      '<td><b>' + esc(h.roepnaam) + '</b> (' + esc(h.eigenaar) + ')</td>' +
      '<td><span class="chip">' + esc(h.klasse || '—') + '</span></td>' +
      '<td><b>' + esc(prijs) + '</b></td>' +
    '</tr>';
  }).join('');

  var printSubTitel = nav.sub === 'PER_KLASSE'
    ? 'Einduitslagen per klasse'
    : (nav.klasseFilter !== 'ALLE' ? 'Einduitslag Klasse ' + nav.klasseFilter : 'Uitslagen, Geslaagde Brevetten & Bekers');

  return '<div class="print-kop"><h2>NNFC Waterwerk – Eindoverzicht ' + esc(jaar) + '</h2><div>' + esc(printSubTitel) + '</div></div>' +
    '<div class="box no-print">' +
      '<div class="box-head">' +
        '<div><h2>5. Tijd- & Puntentelling → Export / Print</h2><div class="sub">Eerst tijden en punten berekenen, daarna pas het eindoverzicht printen of als PDF opslaan</div></div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
          '<button type="button" class="pri" onclick="berekenPuntenUitTijden()">1. Tijd &amp; punten berekenen</button>' +
          '<button type="button" class="ok" onclick="berekenEnPrintOverzicht()">2. Export / Print (PDF)</button>' +
        '</div>' +
      '</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:' + (berekeningMelding ? '10px' : '0') + '">' +
        '<button type="button" class="sm ' + (!nav.sub ? 'pri' : '') + '" onclick="nav.klasseFilter=\'ALLE\';gaNaarStap(5)">Alles op 1 blad</button>' +
        '<button type="button" class="sm ' + (nav.sub === 'UITSLAGEN' ? 'pri' : '') + '" onclick="openSub(\'UITSLAGEN\',\'Alleen Uitslagen\')">Uitslagen</button>' +
        '<button type="button" class="sm ' + (nav.sub === 'PER_KLASSE' ? 'pri' : '') + '" onclick="openSub(\'PER_KLASSE\',\'Uitslagen per klasse\')">Per klasse</button>' +
        '<button type="button" class="sm ' + (nav.sub === 'BREVETTEN_LIJST' ? 'pri' : '') + '" onclick="openSub(\'BREVETTEN_LIJST\',\'Geslaagde Brevetten\')">Brevetten (' + geslaagdeBrevetten.length + ')</button>' +
        '<button type="button" class="sm ' + (nav.sub === 'BEKERS' ? 'pri' : '') + '" onclick="openSub(\'BEKERS\',\'Bekers & Titels\')">Bekers (' + bekerLijst.length + ')</button>' +
      '</div>' +
      (berekeningMelding ? '<div class="chip-ok">' + esc(berekeningMelding) + '</div>' : '') +
    '</div>' +

    uitslagenHtml +

    (toonBrevetten ? '<div class="box">' +
      '<div class="box-head"><h2>Geslaagde Brevetten (' + geslaagdeBrevetten.length + ')</h2></div>' +
      '<div class="table-wrap"><table><thead><tr>' +
        '<th style="width:90px">Startnr</th><th>Hond</th><th>Eigenaar</th><th>Behaald brevet</th>' +
      '</tr></thead><tbody>' + (brevetRows || '<tr><td colspan="4" class="sub" style="padding:14px">Nog geen geslaagde brevetten geregistreerd.</td></tr>') + '</tbody></table></div>' +
    '</div>' : '') +

    (toonBekers ? '<div class="box">' +
      '<div class="box-head"><h2>Bekers & Titels (' + bekerLijst.length + ')</h2></div>' +
      '<div class="table-wrap"><table><thead><tr>' +
        '<th style="width:90px">Startnr</th><th>Hond & Eigenaar</th><th>Klasse</th><th>Beker / Titel</th>' +
      '</tr></thead><tbody>' + (bekerRows || '<tr><td colspan="4" class="sub" style="padding:14px">Nog geen bekers of Beste Reu/Teef-titels toegekend.</td></tr>') + '</tbody></table></div>' +
    '</div>' : '');
}

function renderStap6() {
  var bekerKeuzes = [''].concat(BEKER_DEFINITIES.map(function(b) { return b.naam; }));

  var kaartenHtml = '<div class="grid2" style="margin-bottom:14px">' +
    BEKER_DEFINITIES.map(function(bk) {
      var toegekend = deelnemers.filter(function(h) {
        var td = tafelData[h.id] || {};
        return String(td.beker || '').toLowerCase() === bk.naam.toLowerCase();
      });
      var winnaarsTxt = toegekend.length
        ? toegekend.map(function(h) { return '#' + h.startnummer + ' ' + h.roepnaam; }).join(', ')
        : 'Nog niet toegekend';
      return '<div class="kaart">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px">' +
          '<b>' + esc(bk.naam) + '</b>' +
          '<span class="chip">' + esc(bk.artikel) + '</span>' +
        '</div>' +
        '<div style="font-size:14px;margin-bottom:6px"><b>Waarvoor:</b> ' + esc(bk.waarvoor) + '</div>' +
        '<div class="sub" style="margin-bottom:8px"><b>Opbouw uitslag:</b> ' + esc(bk.opbouw) + '</div>' +
        '<div style="font-size:14px"><span class="chip-ok">Toegekend: ' + esc(winnaarsTxt) + '</span></div>' +
      '</div>';
    }).join('') +
  '</div>';

  var gefilterd = deelnemers.filter(function(h) {
    if (nav.sub === 'TOEGEKEND') {
      var bVal = ((tafelData[h.id] || {}).beker || '').trim();
      if (!bVal) return false;
    }
    return matchZoek(h, nav.zoek);
  }).slice().sort(function(a, b) {
    return totaalPunten(b) - totaalPunten(a);
  });

  var rows = gefilterd.map(function(h) {
    var td = tafelData[h.id] || {};
    var kcmBadge = (h.kcm && h.kcm !== 'GEEN')
      ? '<span class="chip-kcm">' + esc(h.kcm) + ' (+' + (KCM_PUNTEN[h.kcm] || 0) + ')</span>'
      : '<span class="sub">—</span>';
    return '<tr>' +
      '<td><b>#' + esc(h.startnummer) + '</b></td>' +
      '<td><div class="hond-main">' + esc(h.roepnaam) + ' <span class="sub">(' + esc(h.geslacht) + ')</span></div><div class="hond-sub">' + esc(h.eigenaar) + '</div></td>' +
      '<td><span class="chip">' + esc(h.klasse || '—') + '</span></td>' +
      '<td class="tijd-mono">' + (td.totaalTijdCs != null ? fmtCs(td.totaalTijdCs) : '—') + '</td>' +
      '<td><b>' + (td.basisPunten || 0) + '</b> / ' + kcmBadge + '</td>' +
      '<td><select style="margin:0;min-height:34px" onchange="setBeker(\'' + esc(h.id) + '\',this.value);render()">' +
        bekerKeuzes.map(function(opt) {
          return '<option value="' + esc(opt) + '" ' + ((td.beker || '') === opt ? 'selected' : '') + '>' + (opt || '— Geen beker —') + '</option>';
        }).join('') +
      '</select></td>' +
    '</tr>';
  }).join('');

  return '<div class="box">' +
    '<div class="box-head">' +
      '<div><h2>6. Bekers</h2><div class="sub">Overzicht per beker (waarvoor het is &amp; hoe de uitslag is opgebouwd) en toekenning per deelnemer</div></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button type="button" class="sm ' + (!nav.sub ? 'pri' : '') + '" onclick="gaNaarStap(6)">Alle deelnemers (' + deelnemers.length + ')</button>' +
        '<button type="button" class="sm ' + (nav.sub === 'TOEGEKEND' ? 'pri' : '') + '" onclick="openSub(\'TOEGEKEND\',\'Toegekende bekers\')">Alleen toegekend</button>' +
      '</div>' +
    '</div>' +
    kaartenHtml +
    '<div class="toolbar"><div class="search-wrap">' +
      '<input type="search" value="' + esc(nav.zoek) + '" onchange="nav.zoek=this.value;render()" placeholder="Zoek op startnr, hond, eigenaar, klasse of beker...">' +
      '<button type="button" class="sm" onclick="nav.zoek=\'\';render()">Wis</button>' +
    '</div></div>' +
    '<div class="table-wrap"><table><thead><tr>' +
      '<th style="width:80px">Nr</th><th>Hond & Eigenaar</th><th>Klasse</th><th>Eindtijd</th><th>Trials / KCM</th><th style="width:220px">Beker</th>' +
    '</tr></thead><tbody>' + (rows || '<tr><td colspan="6" class="sub" style="padding:14px">Geen deelnemers gevonden.</td></tr>') + '</tbody></table></div>' +
  '</div>';
}

function leesInkomendeKlokkerData() {
  synchroniseerAlleKlokkerBronnen(false);
  var registraties = Object.keys(klokkerLogStore.registraties).map(function(k) { return klokkerLogStore.registraties[k]; })
    .filter(function(r) { return r && (!r.jaar || String(r.jaar) === String(jaar)); });
  var meldingen = Object.keys(klokkerLogStore.meldingen).map(function(k) { return klokkerLogStore.meldingen[k]; })
    .filter(function(m) { return m && (!m.jaar || String(m.jaar) === String(jaar)); });
  return { registraties: registraties, meldingen: meldingen };
}

function render() {
  if (window.NNFCJaarNav && typeof window.NNFCJaarNav.werkLinksBij === 'function') window.NNFCJaarNav.werkLinksBij(jaar);
  updateCrumbBar();
  var html = '';
  if (nav.stap === 1) html = renderStap1();
  else if (nav.stap === 2) html = renderStap2();
  else if (nav.stap === 3) html = renderStap3();
  else if (nav.stap === 4) html = renderStap4();
  else if (nav.stap === 5) html = renderStap5();
  else if (nav.stap === 6) html = renderStap6();
  document.getElementById('appContent').innerHTML = html;

  var feed = leesInkomendeKlokkerData();
  var hostFeed = document.getElementById('appContent');
  if (hostFeed && (feed.registraties.length || feed.meldingen.length)) {
    var fBox = document.getElementById('klokkerFeedBox');
    if (!fBox) {
      fBox = document.createElement('div');
      fBox.id = 'klokkerFeedBox';
      fBox.className = 'box no-print';
      hostFeed.insertBefore(fBox, hostFeed.firstChild);
    }
    var melHtml = feed.meldingen.slice(-6).reverse().map(function(m) {
      var melId = esc(m.id || '');
      var isAfgehandeld = m.status === 'AFGEHANDELD' || (klokkerLogStore.verwerkt && klokkerLogStore.verwerkt[m.id]);
      var tekst = m.soort === 'CORRECTIE'
        ? ('#' + esc(m.startnummer) + ' ' + esc(m.roepnaam || '') + ' (Oef. ' + esc(m.oefening || '?') + '): ' + esc(m.oudeTijd) + ' → <b>' + esc(m.nieuweTijd) + '</b> (' + esc(m.reden || '') + ')')
        : esc(m.tekst || '');
      var actieBtn = isAfgehandeld
        ? ' <span class="chip-ok">Verwerkt</span>'
        : (' <button type="button" class="sm pri" style="min-height:28px;padding:2px 8px;font-size:13px" onclick="pasKlokkerCorrectieToe(\'' + melId + '\')">' + (m.soort === 'CORRECTIE' ? 'Tijd toepassen' : 'Afhandelen') + '</button>');
      return '<li style="margin-bottom:4px"><b>Baan ' + esc(m.baan) + '</b> (' + esc(m.soort || 'MELDING') + '): ' + tekst + actieBtn + '</li>';
    }).join('');
    var regHtml = feed.registraties.slice(-6).reverse().map(function(r) {
      var nr = parseInt(r.startnummer, 10);
      var hObj = deelnemers.find(function(x) { return Number(x.startnummer) === nr; });
      var naam = r.roepnaam || (hObj ? hObj.roepnaam : '');
      return '<li style="margin-bottom:4px"><b>Baan ' + esc(r.baan) + ' • Oef. ' + esc(r.oefening) + '</b>: #' + esc(r.startnummer) + (naam ? ' ' + esc(naam) : '') + ' → <b>' + esc(r.tijdTekst) + '</b></li>';
    }).join('');
    fBox.innerHTML = '<div class="box-head"><div><h2>Inkomend &amp; Opgeslagen van Klokkers (' + feed.registraties.length + ' tijden/registraties • ' + feed.meldingen.length + ' meldingen)</h2><div class="sub">Klokkertijden worden direct opgeslagen per deelnemer en meegenomen in de uitslag</div></div></div>' +
      '<div class="grid2">' +
        '<div class="kaart"><h3>Laatste klokker-registraties</h3><ul style="margin:0;padding-left:18px;font-size:14px">' + (regHtml || '<li class="sub">Geen registraties</li>') + '</ul></div>' +
        '<div class="kaart"><h3>Meldingen &amp; correcties voor tafel</h3><ul style="margin:0;padding-left:18px;font-size:14px">' + (melHtml || '<li class="sub">Geen meldingen</li>') + '</ul></div>' +
      '</div>';
  }

  var mainHost = document.getElementById('appContent') || document.querySelector('.wrap');
  if (mainHost && isJaarVergrendeldTafel()) {
    var existing = document.getElementById('tafelSlotBanner');
    if (!existing) {
      var b = document.createElement('div');
      b.id = 'tafelSlotBanner';
      b.style.cssText = 'background:rgba(255,210,63,0.18);border:1.5px solid rgba(180,83,9,0.45);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap';
      b.innerHTML = '<div><b>🔒 Wedstrijdjaar ' + esc(jaar) + ' is afgesloten en vergrendeld (alleen-lezen)</b><div style="font-size:14px;opacity:.85">Uitslagen en aanpassingen zijn vergrendeld. Je kunt het overzicht bekijken of afdrukken.</div></div><a href="beheer.html" class="btn-link sm">Beheer / Admin →</a>';
      mainHost.insertBefore(b, mainHost.firstChild);
    }
    mainHost.querySelectorAll('input,select,textarea').forEach(function(el) {
      if (el.id === 'selJaar') return;
      el.disabled = true;
    });
    mainHost.querySelectorAll('button').forEach(function(btn) {
      var t = (btn.textContent || '').trim();
      if (t.indexOf('Print') !== -1 || t.indexOf('PDF') !== -1 || t.indexOf('Stap ') !== -1) return;
      btn.disabled = true;
    });
  } else {
    var oldB = document.getElementById('tafelSlotBanner');
    if (oldB && oldB.parentNode) oldB.parentNode.removeChild(oldB);
  }
}

render();

if (window.NNFCJaarNav && typeof window.NNFCJaarNav.installeerTerugEnSyncListeners === 'function') {
  window.NNFCJaarNav.installeerTerugEnSyncListeners(function (actueelJaar) {
    if (actueelJaar && actueelJaar !== jaar) {
      jaar = actueelJaar;
      if (selJaarEl) selJaarEl.value = jaar;
      var lbl = document.getElementById('lblJaar');
      if (lbl) lbl.textContent = jaar;
      laadData();
      render();
    } else if (window.NNFCJaarNav.werkLinksBij) {
      window.NNFCJaarNav.werkLinksBij(jaar);
    }
  }, fallbackTafelJaar);
}
</script>
</body>
</html>
