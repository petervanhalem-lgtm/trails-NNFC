<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedstrijdtafel – NNFC Waterwerk</title>
<style>
:root{
  --bg:#EEF3F5;--sf:#FFFFFF;--sf2:#F7FAFC;--ink:#0E2A3A;--mut:#4D6573;--ac:#0B6E8F;--acink:#FFFFFF;
  --cur:#FFD23F;--curink:#1B1500;--bad:#B3261E;--ok:#1F7A4D;--ln:#C3D3DB;--soft:#DDE8ED;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1A22;--sf:#14293A;--sf2:#102230;--ink:#E8F1F5;--mut:#9DB4C1;--ac:#4CC3E6;--acink:#06222E;
    --cur:#FFD23F;--curink:#1B1500;--bad:#FF8A80;--ok:#6FD6A0;--ln:#2C4558;--soft:#1D3547;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow Semi Condensed',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.35}
.wrap{max-width:1360px;margin:0 auto;padding:14px 18px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:12px 16px}
.top-l{display:flex;align-items:center;gap:12px}
.top img{width:48px;height:48px;border-radius:50%;flex:none}
h1{font-size:23px;margin:0;font-weight:700}
h2{font-size:19px;margin:0;font-weight:700}
.sub{color:var(--mut);font-size:14px}
button,.btn-link{font:inherit;color:inherit;border:1.5px solid var(--ln);background:var(--sf);border-radius:10px;min-height:40px;padding:6px 14px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover,.btn-link:hover{background:var(--sf2)}
.pri{background:var(--ac)!important;border-color:var(--ac)!important;color:var(--acink)!important}
.box{background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}
.box-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
select,input{font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--ln);border-radius:10px;padding:6px 10px;min-height:38px}
.table-wrap{overflow-x:auto;border:1.5px solid var(--ln);border-radius:12px}
table{width:100%;border-collapse:collapse}
thead th{background:var(--sf2);color:var(--mut);font-weight:700;font-size:14px;text-align:left;padding:9px 10px;border-bottom:2px solid var(--ln)}
tbody td{padding:8px 10px;border-bottom:1px solid var(--ln);font-size:15px}
.chip{display:inline-block;background:var(--soft);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.chip-ok{display:inline-block;background:rgba(31,122,77,0.15);color:var(--ok);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="top-l">
      <img src="nnfc-logo.png" alt="NNFC" onerror="this.style.display='none'">
      <div>
        <h1>Wedstrijdtafel (<span id="lblJaar">2026</span>)</h1>
        <div class="sub">Aanwezigheid, basispunten, brevetuitslagen, RT-kandidaten en bekers</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select id="selJaar" onchange="wisselJaar()" style="font-weight:700"></select>
      <a href="banen.html" class="btn-link">Banen / Klokkers</a>
      <a href="beheer.html" class="btn-link">Beheer</a>
      <a href="index.html" class="btn-link pri">← Menu</a>
    </div>
  </div>

  <div class="box">
    <div class="box-head">
      <div>
        <h2>Deelnemers &amp; uitslagen</h2>
        <div class="sub" id="samenvatting">Laden...</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <select id="selKlasse" onchange="renderTafel()">
          <option value="">Alle klassen</option>
          <option value="Open">Open</option>
          <option value="Jeugd">Jeugd</option>
          <option value="Veteranen">Veteranen</option>
          <option value="Stamboomloos">Stamboomloos</option>
          <option value="Specials">Specials</option>
        </select>
        <input type="search" id="inpZoek" oninput="renderTafel()" placeholder="Zoek op nr, hond of eigenaar...">
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Nr</th>
            <th>Hond &amp; Eigenaar</th>
            <th>Klasse / Baan</th>
            <th>Aanwezig</th>
            <th>Tijd</th>
            <th>Basispunten</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tafelBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
function esc(str) {
  return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

var params = new URLSearchParams(window.location.search);
var selJaarEl = document.getElementById('selJaar');
for (var y = 2026; y <= 2035; y++) {
  var opt = document.createElement('option');
  opt.value = String(y);
  opt.textContent = 'Jaar ' + y;
  selJaarEl.appendChild(opt);
}
if (params.get('jaar')) selJaarEl.value = params.get('jaar');

var jaar = selJaarEl.value;
document.getElementById('lblJaar').textContent = jaar;

function wisselJaar() {
  jaar = selJaarEl.value;
  document.getElementById('lblJaar').textContent = jaar;
  renderTafel();
}

function renderTafel() {
  var deelnemers = [];
  var tafel = {};
  var klok = {};
  try { deelnemers = JSON.parse(localStorage.getItem('nnfc_deelnemers_' + jaar)) || []; } catch (e) {}
  try { tafel = JSON.parse(localStorage.getItem('nnfc_tafel_' + jaar)) || {}; } catch (e) {}
  try { klok = JSON.parse(localStorage.getItem('nnfc_klokkers_' + jaar)) || {}; } catch (e) {}

  var klFilter = document.getElementById('selKlasse').value;
  var q = (document.getElementById('inpZoek').value || '').toLowerCase().trim();

  var lijst = deelnemers.slice().sort(function(a, b) { return (a.startnummer || 0) - (b.startnummer || 0); }).filter(function(h) {
    if (klFilter && h.klasse !== klFilter) return false;
    if (!q) return true;
    var txt = [h.startnummer, '#' + h.startnummer, h.roepnaam, h.stamboom, h.eigenaar, h.klasse].join(' ').toLowerCase();
    return txt.indexOf(q) !== -1;
  });

  var aanwezigCount = deelnemers.filter(function(h) { return !!h.aanwezig; }).length;
  document.getElementById('samenvatting').textContent = deelnemers.length + ' ingeschreven • ' + aanwezigCount + ' aanwezig • ' + lijst.length + ' getoond';

  document.getElementById('tafelBody').innerHTML = lijst.length ? lijst.map(function(h) {
    var td = tafel[h.id] || {};
    var kd = klok[h.id] || {};
    return '<tr>' +
      '<td><b>#' + esc(h.startnummer) + '</b></td>' +
      '<td><b>' + esc(h.roepnaam) + '</b><div class="sub">' + esc(h.eigenaar || '') + '</div></td>' +
      '<td><span class="chip">' + esc(h.klasse || '—') + '</span> <span class="sub">Baan ' + esc(h.baan || '—') + '</span></td>' +
      '<td>' + (h.aanwezig ? '<span class="chip-ok">Aanwezig</span>' : '<span class="sub">Niet gemeld</span>') + '</td>' +
      '<td><b>' + esc(kd.tijdStr || '—') + '</b></td>' +
      '<td><b>' + esc(td.basisPunten || '0') + ' pnt</b></td>' +
      '<td><span class="chip">' + esc(td.basisStatus || 'Open') + '</span></td>' +
    '</tr>';
  }).join('') : '<tr><td colspan="7" class="sub" style="padding:14px">Geen deelnemers gevonden voor ' + esc(jaar) + '.</td></tr>';
}

renderTafel();
</script>
</body>
</html>
