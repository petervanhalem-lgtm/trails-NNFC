<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedstrijdtafel NNFC</title>
<style>
:root{--bg:#EEF3F5;--sf:#FFFFFF;--sf2:#F7FAFC;--ink:#0E2A3A;--mut:#4D6573;--ac:#0B6E8F;--acink:#FFFFFF;--cur:#FFD23F;--curink:#1B1500;--bad:#B3261E;--ok:#1F7A4D;--ln:#C3D3DB;--soft:#DDE8ED;--warn:#B45309}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1A22;--sf:#14293A;--sf2:#102230;--ink:#E8F1F5;--mut:#9DB4C1;--ac:#4CC3E6;--acink:#06222E;--cur:#FFD23F;--curink:#1B1500;--bad:#FF8A80;--ok:#6FD6A0;--ln:#2C4558;--soft:#1D3547;--warn:#FBBF6A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow Semi Condensed',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.35}
#app{max-width:1100px;margin:0 auto;padding:12px 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap;background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:10px 14px}
.top-l{display:flex;align-items:center;gap:12px}
.top img{width:48px;height:48px;border-radius:50%;flex:none}
h1{font-size:24px;margin:0;font-weight:700;line-height:1.1}
h2{font-size:19px;margin:16px 0 8px;font-weight:700}
.sub,.m{color:var(--mut);font-size:14px}
button,.btn-link{font:inherit;color:inherit;border:1.5px solid var(--ln);background:var(--sf);border-radius:10px;min-height:42px;padding:6px 13px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .12s,border-color .12s}
button:hover,.btn-link:hover{background:var(--sf2)}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;background:var(--sf);border:2px solid var(--ln);border-radius:14px;padding:6px}
.nav button{min-height:40px;border-color:transparent;background:transparent}
.nav button:hover{background:var(--sf2)}
.nav button.on{background:var(--ac);border-color:var(--ac);color:var(--acink)}
.nav button.extra{color:var(--ok);border-color:var(--ok);background:var(--sf)}
.nav button.extra.on{background:var(--ok);color:#FFFFFF}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.c{display:block;width:100%;text-align:left;background:var(--sf);border:2px solid var(--ln);border-radius:14px;padding:12px 14px;font-size:16px;font-weight:500}
.c b{font-weight:700;font-size:20px}
.c.w{border-color:var(--warn)}
.bar{height:7px;border-radius:5px;background:var(--soft);margin:8px 0}
.bar i{display:block;height:7px;border-radius:5px;background:var(--ac)}
.chip{display:inline-block;background:var(--cur);color:var(--curink);border-radius:6px;padding:1px 7px;font-weight:700;font-size:13px}
.chip-ok{display:inline-block;background:var(--ok);color:#fff;border-radius:6px;padding:1px 7px;font-size:13px;font-weight:700}
.chip-bad{display:inline-block;background:var(--bad);color:#fff;border-radius:6px;padding:1px 7px;font-size:13px;font-weight:700}
.warn{color:var(--warn);font-weight:700}
.banner{background:var(--cur);color:var(--curink);border-color:var(--cur);margin-bottom:12px;font-size:18px;font-weight:700}
.t{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:9px 10px;border-top:1px solid var(--ln);align-items:center;font-size:17px}
.t:first-child{border-top:none}
.t b{font-size:20px}
.list-box{background:var(--sf);border:2px solid var(--ln);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row button{min-height:50px;font-size:17px}
.pri{background:var(--ac)!important;border-color:var(--ac)!important;color:var(--acink)!important}
.box{background:var(--sf);border:2.5px solid var(--warn);border-radius:14px;padding:14px;margin-bottom:12px}
.box.n{border-color:var(--ln);border-width:2px}
.big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.log{padding-left:20px;margin:0;color:var(--mut);font-size:15px}
.foot{margin-top:20px;font-size:13px;color:var(--mut)}
input,select{font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--ln);border-radius:10px;padding:8px 10px;width:100%;margin-bottom:10px;min-height:42px}
input:focus,select:focus{outline:none;border-color:var(--ac)}
label{display:block;font-weight:600;font-size:14px;margin-bottom:3px;color:var(--mut)}
.chk{width:24px;height:24px;accent-color:var(--ok);cursor:pointer;margin:0}
.chk-wrap{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:700;padding:5px 10px;border-radius:9px;border:1.5px solid var(--ln);background:var(--sf);color:var(--mut);margin:0;white-space:nowrap}
.chk-wrap.on{border-color:var(--ok);color:var(--ok);background:var(--sf2)}
.search-bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.search-bar input{margin-bottom:0;border-color:var(--ac);font-size:17px}
.search-bar button{min-height:42px;white-space:nowrap}
</style>
</head>

  if (isArchiefJaar()) {
    alert('De uitslag van 2026 is al vastgelegd en vergrendeld als alleen-lezen archief.');
    return;
  }
  if (!confirm('Huidige/testuitslagen voor 2026 vervangen door de uitslag van de Watertrials 2026 (74 honden uit alle klassen)?')) return;
  actiefJaar = '2026';
  deelnemersLijst = UITSLAG_2026_DEELNEMERS.map(function(d) { return Object.assign({}, d); });
  registraties = {};
  Object.keys(UITSLAG_2026_REGISTRATIES).forEach(function(k) {
    registraties[k] = Object.assign({}, UITSLAG_2026_REGISTRATIES[k]);
  });
  try {
    localStorage.setItem('nnfc_deelnemers_2026', JSON.stringify(deelnemersLijst));
  } catch (e) {}
  if (db && pushenNaarFirebase) {
    try {
      await db.ref('wedstrijd/actief_jaar').set('2026');
      await db.ref('wedstrijd/registraties').set(registraties);
      var objDeeln = {};
      deelnemersLijst.forEach(function(d) { objDeeln[d.id] = d; });
      await db.ref('wedstrijd/beheer_deelnemers').set(objDeeln);
      await db.ref('wedstrijd/logboek/LOAD2026_' + Date.now()).set({
        baan: '-',
        actie: 'Tafel laadde uitslag Watertrials 2026 (74 deelnemers)',
        timestamp: new Date().toISOString()
      });
    } catch (e) {}
  }
  draw();
}

function matchZoek(d, q) {
  if (!q) return true;
  var woorden = q.toLowerCase().trim().split(/\s+/);
  var kcmVal = kcmSelecties[String(d.startnummer)] || d.kcm || '';
  var tekst = [
    d.startnummer, '#' + d.startnummer,
    d.roepnaam, d.stamboom, d.eigenaar, d.lidnr,
    d.klasse, d.geslacht, d.opvolgendBrevet,
    (kcmVal && kcmVal !== 'GEEN') ? ('kcm ' + kcmVal) : '',
    'baan ' + d.baan, 'b' + d.baan,
    d.betaald ? 'betaald' : 'nog betalen',
    d.aanwezig ? 'aanwezig' : 'niet aanwezig'
  ].join(' ').toLowerCase();
  return woorden.every(function(w) { return tekst.indexOf(w) !== -1; });
}

function initFirebase() {
  try {
    if (typeof firebase !== 'undefined' && typeof firebaseConfig !== 'undefined' && firebaseConfig.apiKey && firebaseConfig.apiKey !== "JOUW_API_KEY") {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      function syncJaarData(jaar) {
        var j = String(jaar);
        try {
          deelnemersLijst = JSON.parse(localStorage.getItem('nnfc_deelnemers_' + j)) || [];
          registraties = JSON.parse(localStorage.getItem('nnfc_registraties_' + j)) || {};
          meldingen = JSON.parse(localStorage.getItem('nnfc_meldingen_' + j)) || {};
          logboek = JSON.parse(localStorage.getItem('nnfc_logboek_' + j)) || {};
          banenStatus = JSON.parse(localStorage.getItem('nnfc_banen_' + j)) || {};
          kcmSelecties = JSON.parse(localStorage.getItem('nnfc_kcm_' + j)) || {};
        } catch (e) {
          deelnemersLijst = [];
          registraties = {};
          meldingen = {};
          logboek = {};
          banenStatus = {};
          kcmSelecties = {};
        }
      }

      db.ref('wedstrijd/actief_jaar').on('value', function(s) {
        if (s.val()) {
          var nieuwJaar = String(s.val());
          if (nieuwJaar !== actiefJaar) {
            actiefJaar = nieuwJaar;
            syncJaarData(actiefJaar);
            safeDraw();
          }
        }
      });
      db.ref('wedstrijd/registraties').on('value', function(s) {
        registraties = s.val() || {};
        try { localStorage.setItem('nnfc_registraties_' + actiefJaar, JSON.stringify(registraties)); } catch (e) {}
        if (!isArchiefJaar()) detectConflicts();
        safeDraw();
      });
      db.ref('wedstrijd/meldingen').on('value', function(s) {
        meldingen = s.val() || {};
        try { localStorage.setItem('nnfc_meldingen_' + actiefJaar, JSON.stringify(meldingen)); } catch (e) {}
        safeDraw();
      });
      db.ref('wedstrijd/logboek').on('value', function(s) {
        logboek = s.val() || {};
        try { localStorage.setItem('nnfc_logboek_' + actiefJaar, JSON.stringify(logboek)); } catch (e) {}
        if (v === 'hist') draw();
      });
      db.ref('wedstrijd/banen_status').on('value', function(s) {
        banenStatus = s.val() || {};
        try { localStorage.setItem('nnfc_banen_' + actiefJaar, JSON.stringify(banenStatus)); } catch (e) {}
        safeDraw();
      });
      db.ref('wedstrijd/kcm_selecties').on('value', function(s) {
        var val = s.val() || {};
        kcmSelecties = Object.assign({}, val);
        try { localStorage.setItem('nnfc_kcm_' + actiefJaar, JSON.stringify(kcmSelecties)); } catch (e) {}
        safeDraw();
      });
      db.ref('wedstrijd/beheer_deelnemers').on('value', function(s) {
        var val = s.val();
        if (val !== null && val !== undefined) {
          deelnemersLijst = Array.isArray(val) ? val.filter(Boolean) : Object.values(val).filter(Boolean);
          deelnemersLijst.forEach(function(d) {
            if (d && d.kcm && d.kcm !== 'GEEN' && !kcmSelecties[String(d.startnummer)]) {
              kcmSelecties[String(d.startnummer)] = d.kcm;
            }
          });
        } else {
          deelnemersLijst = [];
        }
        try { localStorage.setItem('nnfc_deelnemers_' + actiefJaar, JSON.stringify(deelnemersLijst)); } catch (e) {}
        safeDraw();
      });
    }
  } catch (e) {}
}

function getGroepen() {
  var map = {};
  Object.values(registraties).forEach(function(r) {
    if (!r || r.status === 'AFGEWEZEN' || (r.oefening !== 'A' && r.oefening !== 'B' && r.oefening !== 'C')) return;
    if (!map[r.startnummer]) {
      var meta = deelnemersLijst.find(function(d) { return d.startnummer == r.startnummer; }) || {};
      map[r.startnummer] = { nr: r.startnummer, naam: r.roepnaam, klasse: r.klasse, geslacht: r.geslacht, bm: Boolean(meta.buitenMededinging || r.buitenMededinging), oef: {} };
    }
    var ms = r.type === 'WEIGERING' ? WEIGERING_MS : (r.tijdMs || 0);
    map[r.startnummer].oef[r.oefening] = { ms: ms, txt: r.type === 'WEIGERING' ? '600,00 (W)' : r.tijdTekst };
  });

  var gr = [
    { titel: 'Open reuen', lijst: [] }, { titel: 'Open teven', lijst: [] },
    { titel: 'Jeugd', lijst: [] }, { titel: 'Veteranen', lijst: [] },
    { titel: 'Stamboomloos', lijst: [] }, { titel: 'Special', lijst: [] }
  ];

  Object.values(map).forEach(function(h) {
    h.totaalMs = (h.oef.A ? h.oef.A.ms : 0) + (h.oef.B ? h.oef.B.ms : 0) + (h.oef.C ? h.oef.C.ms : 0);
    h.gedaan = Object.keys(h.oef).length;
    if (h.klasse === 'Open' && h.geslacht === 'Reu') gr.slice(0, 1).pop().lijst.push(h);
    else if (h.klasse === 'Open' && h.geslacht === 'Teef') gr.slice(1, 2).pop().lijst.push(h);
    else if (h.klasse === 'Jeugd') gr.slice(2, 3).pop().lijst.push(h);
    else if (h.klasse === 'Veteranen' || h.klasse === 'Senioren') gr.slice(3, 4).pop().lijst.push(h);
    else if (h.klasse === 'Stamboomloos') gr.slice(4, 5).pop().lijst.push(h);
    else if (h.klasse === 'Specials') gr.slice(5, 6).pop().lijst.push(h);
  });

  gr.forEach(function(g) {
    g.lijst.sort(function(x, y) {
      if (x.bm !== y.bm) return x.bm ? 1 : -1;
      return (y.gedaan - x.gedaan) || (x.totaalMs - y.totaalMs);
    });
    var reg = 0;
    g.lijst.forEach(function(h, idx) {
      h.rang = idx + 1;
      if (!h.bm) { h.pnt = Math.max(0, 250 - (reg * 5)); reg++; } else { h.pnt = 0; }
    });
  });
  return gr;
}

function openMeldingen() {

}

function getDagVoortgang() {
  var aanwezige = deelnemersLijst.filter(function(d) { return Boolean(d && d.aanwezig); });
  var totaalHonden = aanwezige.length || deelnemersLijst.length || 0;
  var geldigeRegs = Object.entries(registraties)
    .map(function(entry) { return Object.assign({ _id: entry[0] }, entry[1]); })
    .filter(function(r) { return r && r.status !== 'AFGEWEZEN'; });

  var oefPerHond = {};
  var laatsteRegs = geldigeRegs.slice().sort(function(a, b) {
    return String(b.timestamp || '').localeCompare(String(a.timestamp || ''));
  });

  geldigeRegs.forEach(function(r) {
    var nrKey = String(r.startnummer);
    if (!oefPerHond[nrKey]) oefPerHond[nrKey] = {};
    if (r.oefening === 'A' || r.oefening === 'B' || r.oefening === 'C' || r.oefening === 'BREVET') {
      oefPerHond[nrKey][r.oefening] = r;
    }
  });

  var nogBezig = [];
  var klaarHonden = 0;
  var bronLijst = aanwezige.length ? aanwezige : deelnemersLijst;

  bronLijst.forEach(function(d) {
    var nrKey = String(d.startnummer);
    var gedaanMap = oefPerHond[nrKey] || {};
    var isBrevetTraject = String(d.opvolgendBrevet || '').toLowerCase().indexOf('brevet') !== -1 && d.klasse !== 'Open' && Boolean(gedaanMap.BREVET);
    var voltooide = Object.keys(gedaanMap).length;
    var vereist = isBrevetTraject ? 1 : 3;
    if (voltooide >= vereist && vereist > 0) {
      klaarHonden++;
    } else {
      nogBezig.push({
        nr: d.startnummer,
        roepnaam: d.roepnaam,
        baan: d.baan,
        klasse: d.klasse,
        gedaan: Object.keys(gedaanMap)
      });
    }
  });

  var pctHonden = totaalHonden > 0 ? Math.min(100, Math.round((klaarHonden / totaalHonden) * 100)) : 0;
  return {
    totaalHonden: totaalHonden,
    klaarHonden: klaarHonden,
    nogTeGaan: Math.max(0, totaalHonden - klaarHonden),
    pctHonden: pctHonden,
    totaalRegs: geldigeRegs.length,
    nogBezig: nogBezig,
    laatsteRegs: laatsteRegs.slice(0, 6)
  };
}

function getBehaaldeBrevetten() {
  var lijst = [];
  var gezien = {};
  Object.values(registraties).forEach(function(r) {
    if (!r || r.status === 'AFGEWEZEN') return;
    var isBrevetOk = (r.type === 'BREVET_OK') || (String(r.oefening || '').toUpperCase() === 'BREVET' && r.type !== 'WEIGERING');
    if (isBrevetOk) {
      var meta = deelnemersLijst.find(function(d) { return String(d.startnummer) === String(r.startnummer); }) || {};
      var brevetNaam = r.brevetNaam || r.brevet || meta.opvolgendBrevet || meta.heeftNuBrevet || 'Brevet behaald';
      var key = String(r.startnummer) + '_' + brevetNaam;
      if (!gezien[key]) {
        gezien[key] = true;
        lijst.push({
          nr: r.startnummer,
          naam: r.roepnaam || meta.roepnaam || '-',
          stamboom: meta.stamboom || '-',
          klasse: r.klasse || meta.klasse || '-',
          geslacht: r.geslacht || meta.geslacht || '-',
          baan: r.baan || meta.baan || '-',
          brevet: brevetNaam,
          bron: 'BREVET_OK'
        });
      }
    }
  });
  return lijst;
}


function detectConflicts() {
  if (!db) return;
  var seen = {};
  Object.values(registraties).forEach(function(r) {
    if (!r || r.status === 'AFGEWEZEN') return;
    var key = r.startnummer + '_' + r.oefening;
    if (seen[key] && seen[key].id !== r.id) {
      var cid = 'CONF_' + r.id;
      if (!meldingen[cid]) {
        db.ref('wedstrijd/meldingen/' + cid).set({
          id: cid, soort: 'CONFLICT', status: 'OPEN', baan: r.baan, oefening: r.oefening,
          startnummer: r.startnummer, roepnaam: r.roepnaam,
          oudeRegId: seen[key].id, oudeTijd: seen[key].tijdTekst,
          nieuweRegId: r.id, nieuweTijd: r.tijdTekst, nieuweTijdMs: r.tijdMs,
          reden: 'Dubbele registratie voor dezelfde hond/oefening', timestamp: new Date().toISOString()
        });
      }
    } else {
      seen[key] = r;
    }
  });
}

async function beslis(id, akkoord) {
  if (blokkeerArchiefActie('Meldingen van 2026 zijn alleen-lezen.')) return;
  var m = meldingen[id]; if (!m) return;
  if (db) {
    if (akkoord) {
      if (m.oudeRegId && registraties[m.oudeRegId]) await db.ref('wedstrijd/registraties/' + m.oudeRegId).update({ status: 'AFGEWEZEN' });
      if (m.nieuweRegId && registraties[m.nieuweRegId]) await db.ref('wedstrijd/registraties/' + m.nieuweRegId).update({ status: 'GEACCEPTEERD' });
      else {
        var k = Object.keys(registraties).find(function(key) { return registraties[key].startnummer == m.startnummer && registraties[key].oefening == m.oefening && registraties[key].status !== 'AFGEWEZEN'; });
        if (k) await db.ref('wedstrijd/registraties/' + k).update({ tijdTekst: m.nieuweTijd, tijdMs: m.nieuweTijdMs, type: 'TIJD' });
      }
    } else if (m.nieuweRegId && registraties[m.nieuweRegId]) {
      await db.ref('wedstrijd/registraties/' + m.nieuweRegId).update({ status: 'AFGEWEZEN' });
    }
    await db.ref('wedstrijd/meldingen/' + id).update({ status: akkoord ? 'GEACCEPTEERD' : 'AFGEWEZEN' });
    await db.ref('wedstrijd/logboek/BESL_' + Date.now()).set({ baan: m.baan, actie: 'Tafel ' + (akkoord ? 'accepteert' : 'wijst af') + ' wijziging #' + m.startnummer, timestamp: new Date().toISOString() });
  } else {
    if (!akkoord && m.nieuweRegId && registraties[m.nieuweRegId]) registraties[m.nieuweRegId].status = 'AFGEWEZEN';
    meldingen[id].status = akkoord ? 'GEACCEPTEERD' : 'AFGEWEZEN';
    draw();
  }
}


async function verwijderRegistratie(regId) {
  if (blokkeerArchiefActie('Tijden van 2026 kunnen niet worden verwijderd.')) return;
  if (!regId) return;
  var r = registraties[regId];
  var label = r ? ('#' + r.startnummer + ' ' + r.roepnaam + ' (Oef. ' + r.oefening + ': ' + r.tijdTekst + ')') : regId;
  if (!confirm('Tijd verwijderen voor ' + label + '? Daarna kun je deze handmatig invoeren.')) return;
  if (db) {
    await db.ref('wedstrijd/registraties/' + regId).remove();
    if (r) {
      await db.ref('wedstrijd/logboek/DEL_' + Date.now()).set({
        baan: r.baan,
        actie: 'Tafel verwijderde tijd voor #' + r.startnummer + ' ' + r.roepnaam + ' (Oef. ' + r.oefening + ')',
        timestamp: new Date().toISOString()
      });
    }
  } else {
    delete registraties[regId];
    draw();
  }
}

async function verwijderHondTijden(startnr, baanNr) {
  if (blokkeerArchiefActie('Tijden van 2026 kunnen niet worden gewist.')) return;
  var keys = Object.keys(registraties).filter(function(k) {
    var r = registraties[k];
    return r && String(r.startnummer) === String(startnr) && (!baanNr || String(r.baan) === String(baanNr));
  });
  if (!keys.length) { alert('Geen geregistreerde oefeningen gevonden voor #' + startnr + '.'); return; }
  if (!confirm('Alle ' + keys.length + ' geregistreerde oefening(en) van #' + startnr + ' verwijderen zodat ze handmatig ingevoerd kunnen worden?')) return;
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    if (db) await db.ref('wedstrijd/registraties/' + k).remove();
    else delete registraties[k];
  }
  if (db) {
    await db.ref('wedstrijd/logboek/DELALL_' + Date.now()).set({
      baan: baanNr || '-',
      actie: 'Tafel verwijderde alle oefeningen voor #' + startnr + ' voor handmatige invoer',
      timestamp: new Date().toISOString()
    });
  } else {
    draw();
  }
}

function verwijderGekozenNoodTijd() {
  var hondEl = document.getElementById('ndHond');
  var oefEl = document.getElementById('ndOef');
  if (!hondEl || !oefEl) return;
  var nrSel = hondEl.value;
  var oefSel = oefEl.value;
  var hit = Object.entries(registraties).find(function(e) {
    return e[1] && String(e[1].startnummer) === String(nrSel) && e[1].oefening === oefSel && e[1].status !== 'AFGEWEZEN';
  });
  if (hit) verwijderRegistratie(hit[0]);
  else alert('Geen bestaande tijd gevonden voor deze hond en oefening.');
}

async function leesBericht(id) { if (blokkeerArchiefActie('Berichten van 2026 zijn alleen-lezen.')) return; if (db) await db.ref('wedstrijd/meldingen/' + id).update({ status: 'GELEZEN' }); else if (meldingen[id]) { meldingen[id].status = 'GELEZEN'; draw(); } }


async function verwijderDeelnemer(nr) {
  if (blokkeerArchiefActie('Deelnemers van 2026 kunnen niet worden verwijderd.')) return;
  var d = deelnemersLijst.find(function(x) { return String(x.startnummer) === String(nr); });
  if (!d) return;
  if (!confirm('Deelnemer #' + d.startnummer + ' ' + d.roepnaam + ' verwijderen uit de aanmelding en deelnemerslijst?')) return;
  var baanNr = d.baan;
  deelnemersLijst = deelnemersLijst.filter(function(x) { return String(x.startnummer) !== String(nr); });
  try { localStorage.setItem('nnfc_deelnemers_' + actiefJaar, JSON.stringify(deelnemersLijst)); } catch (e) {}
  draw();
  if (db) {
    if (d.id) await db.ref('wedstrijd/beheer_deelnemers/' + d.id).remove();
    var snap = await db.ref('wedstrijd/beheer_deelnemers').once('value');
    var raw = snap.val();
    if (raw && typeof raw === 'object') {
      var entries = Object.entries(raw);
      for (var i = 0; i < entries.length; i++) {
        var k = entries[i][0], item = entries[i][1];
        if (item && String(item.startnummer) === String(nr)) {
          await db.ref('wedstrijd/beheer_deelnemers/' + k).remove();
        }
      }
    }
    await stuurBaan(baanNr);
    await db.ref('wedstrijd/logboek/DELDEEL_' + Date.now()).set({
      baan: baanNr || '-',
      actie: 'Tafel verwijderde deelnemer #' + d.startnummer + ' ' + d.roepnaam,
      timestamp: new Date().toISOString()
    });
  }
}

async function toggleAanwezig(nr) {
  if (blokkeerArchiefActie('Aanwezigheid van 2026 kan niet worden gewijzigd.')) return;
  var d = deelnemersLijst.find(function(x) { return x.startnummer == nr; }); if (!d) return;
  d.aanwezig = !d.aanwezig;
  localStorage.setItem('nnfc_deelnemers_' + actiefJaar, JSON.stringify(deelnemersLijst));
  draw();
  if (db) {
    await db.ref('wedstrijd/beheer_deelnemers/' + d.id).set(d);
    await stuurBaan(d.baan);
  }
}

async function stuurBaan(baanNr) {
  if (!db) return;
  var lijst = deelnemersLijst.filter(function(x) { return x.baan == baanNr && x.aanwezig; }).map(function(h) {
    return { nr: h.startnummer, roepnaam: h.roepnaam, klasse: h.klasse, geslacht: h.geslacht, opvolgendBrevet: h.opvolgendBrevet, buitenMededinging: Boolean(h.buitenMededinging) };
  });
  await db.ref('wedstrijd/baan_lijsten/baan_' + baanNr).set(lijst);
}

async function syncAlleBanen() { if (blokkeerArchiefActie('Banen van 2026 kunnen niet worden gesynchroniseerd.')) return; if (!db) { alert('Firebase is nog niet gekoppeld in config.js.'); return; } for (var b = 1; b <= 5; b++) await stuurBaan(b); alert('Alle aanwezige honden zijn doorgestuurd naar Baan 1 t/m 5.'); }

async function slaExtraOp() {
  if (blokkeerArchiefActie('Aan het archiefjaar 2026 kunnen geen extra deelnemers worden toegevoegd.')) return;
  var roep = document.getElementById('exRoep').value.trim(), stam = document.getElementById('exStam').value.trim();

    mobiel: document.getElementById('exMob') ? document.getElementById('exMob').value.trim() : '',
    geboortedatum: document.getElementById('exGeb') ? document.getElementById('exGeb').value.trim() : '',
    kleur: document.getElementById('exKleur') ? document.getElementById('exKleur').value.trim() : '',
    stamboomnummer: document.getElementById('exStbnr') ? document.getElementById('exStbnr').value.trim() : '',
    district: document.getElementById('exDist') ? document.getElementById('exDist').value.trim() : '',
    heeftNuBrevet: document.getElementById('exNuBrev') ? document.getElementById('exNuBrev').value : 'Geen',
    geslacht: document.getElementById('exGesl').value,

  };

  localStorage.setItem('nnfc_kcm_' + actiefJaar, JSON.stringify(kcmSelecties));
  if (db) {
    await db.ref('wedstrijd/beheer_deelnemers/' + nieuw.id).set(nieuw);
    if (kcmVal !== 'GEEN') await db.ref('wedstrijd/kcm_selecties/' + nr).set(kcmVal);

async function slaNoodOp() {
  if (blokkeerArchiefActie('Aan het archiefjaar 2026 kunnen geen handmatige tijden worden toegevoegd.')) return;
  var nr = document.getElementById('ndHond').value, d = deelnemersLijst.find(function(x) { return x.startnummer == nr; });
  if (!d) { alert('Kies eerst een deelnemer.'); return; }
  var oef = document.getElementById('ndOef').value, type = document.getElementById('ndType').value, txt = type === 'WEIGERING' ? 'WEIGERING' : 'UITGEVOERD', ms = null;
  if (type === 'TIJD') {
    var raw = document.getElementById('ndCijf').value.replace(/\D/g, ''); if (!raw) { alert('Voer cijfers in.'); return; }
    var pad = raw.padStart(3, '0'), h = parseInt(pad.slice(-2), 10), s = parseInt(pad.slice(-4, -2) || '0', 10), m = parseInt(pad.slice(0, -4) || '0', 10);
    if (s > 59) { alert('Seconden moeten onder 60 liggen.'); return; }
    ms = (m * 60000) + (s * 1000) + (h * 10);
    if (ms === 0) { alert('Tijd van 0,00 is niet toegestaan.'); return; }
    txt = m > 0 ? (m + ':' + String(s).padStart(2, '0') + ',' + String(h).padStart(2, '0')) : (s + ',' + String(h).padStart(2, '0'));
  }
  var rid = 'TAFEL_' + d.baan + '_' + oef + '_' + d.startnummer + '_' + Date.now();
  var payload = { id: rid, baan: d.baan, klasse: d.klasse, oefening: oef, startnummer: d.startnummer, roepnaam: d.roepnaam, geslacht: d.geslacht, buitenMededinging: Boolean(d.buitenMededinging), type: type, tijdTekst: txt, tijdMs: ms, timestamp: new Date().toISOString() };
  if (db) await db.ref('wedstrijd/registraties/' + rid).set(payload); else registraties[rid] = payload;
  go('home');
}

function exporteerUitslagCsv() {
  var regels = ['Klasse;Plaats;Startnummer;Roepnaam;Oefening A;Oefening B;Oefening C;Totaal Seconden;Bekerpunten;KCM;Buiten Mededinging'];
  getGroepen().forEach(function(g) {
    g.lijst.forEach(function(d, j) {
      var kcm = kcmSelecties[String(d.nr)] || 'GEEN';
      regels.push([
        g.titel, j + 1, d.nr, d.naam,
        d.oef.A ? d.oef.A.txt : '-', d.oef.B ? d.oef.B.txt : '-', d.oef.C ? d.oef.C.txt : '-',
        formatSec(d.totaalMs, false), d.bm ? 0 : d.pnt, kcm === 'GEEN' ? '-' : kcm, d.bm ? 'Ja' : 'Nee'
      ].join(';'));
    });
  });
  var blob = new Blob(['\uFEFF' + regels.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nnfc_officiele_uitslag_' + actiefJaar + '.csv';
  a.click();
}

      '<div class="row"><div><label>Startnummer</label><input type="number" id="exNr" value="' + (deelnemersLijst.length + 101) + '"></div>' +
      '<div><label>Baan</label><select id="exBaan"><option value="1">Baan 1</option><option value="2">Baan 2</option><option value="3">Baan 3</option><option value="4">Baan 4</option><option value="5">Baan 5</option></select></div></div>' +
      '<div class="row"><div><label>Roepnaam hond</label><input type="text" id="exRoep" placeholder="bijv. Max"></div>' +
      '<div><label>Stamboomnaam</label><input type="text" id="exStam" placeholder="bijv. Max v.d. Waterkant"></div></div>' +
      '<div class="row"><div><label>Naam eigenaar</label><input type="text" id="exEig" placeholder="bijv. J. Jansen"></div>' +
      '<div><label>Geslacht</label><select id="exGesl"><option value="Reu">Reu</option><option value="Teef">Teef</option></select></div></div>' +
      '<div class="row"><div><label>Klasse</label><select id="exKlas"><option value="Open">Open (50m)</option><option value="Jeugd">Jeugd (30m)</option><option value="Veteranen">Veteranen (30m)</option><option value="Stamboomloos">Stamboomloos (30m)</option><option value="Specials">Specials (30m)</option></select></div>' +
      '<div><label>Opvolgend brevet</label><select id="exBrev"><option value="Brevet A">Brevet A</option><option value="Jeugdbrevet">Jeugdbrevet</option><option value="Brevet B">Brevet B</option><option value="Brevet C">Brevet C</option><option value="Brevet D">Brevet D</option><option value="Brevet E">Brevet E</option><option value="Seaman Brevet">Seaman Brevet</option></select></div></div>' +
      '<label>KCM-uitslag (indien van toepassing)</label><select id="exKcm">' + kcmOptsEx + '</select>' +
      '<label style="display:flex;align-items:center;gap:8px;margin:6px 0"><input type="checkbox" id="exBet" checked style="width:auto;margin:0;min-height:auto"> Betaald aan tafel (+ €2,50)</label>' +
      '<div class="row"><div><label>Lidnummer (optioneel)</label><input type="text" id="exLidnr" placeholder="bijv. 10002381"></div>' +
      '<div><label>Stamboomnummer NHSB / overig (optioneel)</label><input type="text" id="exStbnr" placeholder="bijv. NHSB / VDH/VND"></div></div>' +
      '<div class="row"><div><label>Geboortedatum dd/mm/jjjj (optioneel)</label><input type="text" id="exGeb" placeholder="bijv. 09/05/2025"></div>' +
      '<div><label>Kleur (optioneel)</label><input type="text" id="exKleur" placeholder="bijv. Zwart"></div></div>' +
      '<div class="row"><div><label>Traint in Regio / District (optioneel)</label><input type="text" id="exDist" placeholder="bijv. Baywatch - Limburg"></div>' +
      '<div><label>Heeft nu Brevet (optioneel)</label><select id="exNuBrev"><option value="Geen">Geen</option><option value="Brevet A">Brevet A</option><option value="Jeugdbrevet">Jeugdbrevet</option><option value="Brevet B">Brevet B</option><option value="Brevet C">Brevet C</option><option value="Brevet D">Brevet D</option><option value="Brevet E">Brevet E</option></select></div></div>' +
      '<div class="row"><div><label>E-mail (optioneel)</label><input type="email" id="exEmail" placeholder="bijv. naam@voorbeeld.nl"></div>' +
      '<div><label>Telefoon / Mobiel (optioneel)</label><input type="text" id="exMob" placeholder="bijv. 06-12345678"></div></div>' +
      '<label style="display:flex;align-items:center;gap:8px;margin:6px 0"><input type="checkbox" id="exBet" checked style="width:auto;margin:0;min-height:auto"> Betaald aan tafel (+ €2,50)</label>' +
      '<label style="display:flex;align-items:center;gap:8px;margin:6px 0 14px"><input type="checkbox" id="exBm" style="width:auto;margin:0;min-height:auto"> Buiten mededinging (*)</label>' +
      '<button class="pri" style="width:100%" onclick="slaExtraOp()">Opslaan en direct naar klokker sturen</button></div>';

  } else if (v === 'nood') {
    var opties = deelnemersLijst.length
      ? deelnemersLijst.map(function(d) { return '<option value="' + esc(d.startnummer) + '">Baan ' + esc(d.baan) + ' | #' + esc(d.startnummer) + ' ' + esc(d.roepnaam) + ' (' + esc(d.klasse) + ')</option>'; }).join('')
      : '<option value="">Geen deelnemers beschikbaar</option>';
    h += back() + '<div class="box n" style="max-width:600px"><h2 style="margin-top:0">Handmatige tijd / weigering invoeren</h2>' +
      '<label>Deelnemer</label><select id="ndHond">' + opties + '</select>' +
      '<label>Oefening</label><select id="ndOef" onchange="var t=document.getElementById(\'ndType\');if(this.value!==\'BREVET\'&&t.value===\'BREVET_OK\')t.value=\'TIJD\';document.getElementById(\'ndVak\').style.display=t.value===\'TIJD\'?\'block\':\'none\'"><option value="A">Oefening A (Object)</option><option value="B">Oefening B (Pop)</option><option value="C">Oefening C (Springen)</option><option value="BREVET">Brevetoefening E t/m J</option></select>' +
      '<label>Resultaat</label><select id="ndType" onchange="if(this.value===\'BREVET_OK\'&&document.getElementById(\'ndOef\').value!==\'BREVET\'){alert(\'Brevet uitgevoerd geldt alleen voor Brevetoefening E t/m J.\');this.value=\'TIJD\';}document.getElementById(\'ndVak\').style.display=this.value===\'TIJD\'?\'block\':\'none\'"><option value="TIJD">Geklokte tijd</option><option value="WEIGERING">Weigering (600,00 sec)</option><option value="BREVET_OK">Brevet uitgevoerd (alleen E–J)</option></select>' +
      '<div id="ndVak"><label>Tijd in cijfers (bijv. 945 = 9,45 sec)</label><input type="tel" id="ndCijf" placeholder="bijv. 1425"></div>' +
      '<button class="pri" style="width:100%" onclick="slaNoodOp()">Resultaat direct toevoegen</button><button style="width:100%;margin-top:8px;color:var(--bad);border-color:var(--bad)" onclick="verwijderGekozenNoodTijd()">Bestaande tijd voor gekozen hond & oefening verwijderen</button></div>';

  } else if (v === 'meld') {
    h += back();
    if (!openM.length) h += '<div class="m">Geen open meldingen.</div>';
    openM.forEach(function(m) {
      if (m.soort === 'BERICHT') {
        h += '<div class="box n"><div class="m">Baan ' + esc(m.baan) + ', Oefening ' + esc(m.oefening) + '</div><div style="font-size:19px;margin:4px 0 10px">' + esc(m.tekst) + '</div><button onclick="leesBericht(\'' + esc(m.id) + '\')" style="width:100%">Gelezen</button></div>';
      } else {
        h += '<div class="box"><div class="m">Baan ' + esc(m.baan) + ', Oefening ' + esc(m.oefening) + '</div>' +
          '<div style="font-size:20px;font-weight:700;margin:2px 0 8px">Conflict: twee tijden voor ' + esc(m.roepnaam) + ' (nr ' + esc(m.startnummer) + ')</div>' +
          '<div class="m">Eerst geregistreerd</div><div class="big">' + esc(m.oudeTijd) + '</div>' +
          '<div class="m" style="margin-top:6px">Correctie van de klokker</div><div class="big">' + esc(m.nieuweTijd) + '</div>' +
          '<div class="m" style="margin:6px 0 12px">Reden: ' + esc(m.reden) + '. Tot de tafel beslist telt ' + esc(m.oudeTijd) + '.</div>' +
          '<div class="row"><button onclick="beslis(\'' + esc(m.id) + '\', false)">Houd ' + esc(m.oudeTijd) + '</button>' +
          '<button class="pri" onclick="beslis(\'' + esc(m.id) + '\', true)">Neem ' + esc(m.nieuweTijd) + ' over</button></div></div>';
      }
    });

  } else if (v === 'beker') {
    var gr = getGroepen();
    var openH = gr.slice(0, 1).pop().lijst.concat(gr.slice(1, 2).pop().lijst).filter(function(x) { return !x.bm; });
    var jeugdH = gr.slice(2, 3).pop().lijst.filter(function(x) { return !x.bm; });

    var bouwSpetter = function(titel, lijst) {
      var s = '<div class="box n"><h2 style="margin-top:0">' + esc(titel) + '</h2><div class="m" style="margin-bottom:8px">KCM-uitslagen vanuit Beheer worden hier automatisch ingevuld en zijn direct bij te stellen.</div>';
      if (!lijst.length) return s + '<div class="m">Nog geen deelnemers binnen mededinging.</div></div>';
      var metTot = lijst.map(function(d) {
        var meta = deelnemersLijst.find(function(x) { return x.startnummer == d.nr; }) || {};
        var k = kcmSelecties[String(d.nr)] || meta.kcm || 'GEEN';
        return Object.assign({}, d, { kcm: k, tot: d.pnt + (KCM_PUNTEN[k] || 0) });
      }).sort(function(a, b) { return b.tot - a.tot; });

      metTot.forEach(function(d) {
        var opts = Object.entries(KCM_PUNTEN).map(function(e) {
          var kNaam = e.slice(0, 1).pop(), kPnt = e.slice(1, 2).pop();
          return '<option value="' + esc(kNaam) + '" ' + (d.kcm === kNaam ? 'selected' : '') + '>' + (kNaam === 'GEEN' ? 'Geen KCM' : esc(kNaam) + ' (+' + kPnt + ')') + '</option>';
        }).join('');
        s += '<div class="t"><b>' + d.tot + '</b><div>' + esc(d.naam) + ' <span class="m">nr ' + esc(d.nr) + ' • Trials: ' + d.pnt + '</span></div>' +
          '<select style="width:auto;margin:0;min-height:36px" onchange="setKcm(' + esc(d.nr) + ', this.value)">' + opts + '</select></div>';
      });
      return s + '</div>';
    };

    h += back() + '<div class="g">' + bouwSpetter('Spettertrofee (Open + KCM)', openH) + bouwSpetter('Junior Spettertrofee (Jeugd + KCM)', jeugdH) + '</div>';

  } else if (v === 'klok') {
    var bSel = String(klokBaan || '1');
    var stKlok = banenStatus['baan_' + bSel] || { oefening: 'A', klaar: 0, totaal: 0, nuHond: 'Wacht op start', serverTijd: null };
    var aanwezigeBaan = deelnemersLijst.filter(function(d) { return String(d.baan) === bSel && d.aanwezig; });
    var baanRecs = Object.values(registraties).filter(function(r) { return r && String(r.baan) === bSel && r.status !== 'AFGEWEZEN'; });

    var baanKnoppen = ['1', '2', '3', '4', '5'].map(function(n) {
      var cntAanw = deelnemersLijst.filter(function(d) { return String(d.baan) === n && d.aanwezig; }).length;
      return '<button class="' + (bSel === n ? 'pri' : '') + '" onclick="klokBaan=\'' + n + '\';draw()">Baan ' + n + ' (' + cntAanw + ' aanwezig)</button>';
    }).join('');

    var klokLaatstGezien = 'Nog geen signaal van de baan';
    if (stKlok.serverTijd) {
      var dtK = new Date(stKlok.serverTijd);
      klokLaatstGezien = 'Laatst gezien om ' + dtK.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
    }

    h += back() +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">' +
        '<div><h2 style="margin:0">Klokkersbeeld & Startlijstcontrole</h2><div class="m">Bekijk exact welke aanwezige honden, oefening en tijden er voor de klokker op de baan staan.</div></div>' +
        '<a href="klokker.html?baan=' + esc(bSel) + '" target="_blank" class="btn-link">Open klokker.html (Baan ' + esc(bSel) + ') ↗</a>' +
      '</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">' + baanKnoppen + '</div>' +
      '<div class="g" style="margin-bottom:12px">' +
        '<div class="box n" style="margin-bottom:0"><div class="m">Actieve oefening & status</div><div class="big">Oefening ' + esc(stKlok.oefening || 'A') + '</div><div class="m" style="margin-top:4px">' + esc(klokLaatstGezien) + '</div></div>' +
        '<div class="box n" style="margin-bottom:0"><div class="m">Aanwezige honden op startlijst</div><div class="big">' + aanwezigeBaan.length + '</div><div class="m" style="margin-top:4px">Alleen aangevinkte honden gaan naar de baan</div></div>' +
        '<div class="box n" style="margin-bottom:0"><div class="m">Geregistreerde tijden op baan</div><div class="big">' + baanRecs.length + '</div><div class="m" style="margin-top:4px">Huidige hond: <b>' + esc(stKlok.nuHond || 'Wacht op start') + '</b></div></div>' +
      '</div>' +
      '<div class="box n"><h2 style="margin-top:0">Startlijst klokker — Baan ' + esc(bSel) + ' (Aanwezig)</h2>';

    if (!aanwezigeBaan.length) {
      h += '<div class="m">Geen aanwezige honden op Baan ' + esc(bSel) + '. Controleer <b>Aanmelding</b> of synchroniseer vanuit Beheer.</div>';
    } else {
      h += '<div class="list-box">' + aanwezigeBaan.map(function(d, idx) {
        var hondTijden = baanRecs.filter(function(r) { return String(r.startnummer) === String(d.startnummer); });
        var samenvatting = hondTijden.length
          ? hondTijden.map(function(r) { return 'Oef ' + esc(r.oefening) + ': <b>' + esc(r.tijdTekst) + '</b>'; }).join(' • ')
          : '<span class="m">Nog geen tijd geregistreerd</span>';
        return '<div class="t"><b>' + (idx + 1) + '</b><div>' +
          '#' + esc(d.startnummer) + ' ' + esc(d.roepnaam) +
          (d.buitenMededinging ? ' <span class="chip">*</span>' : '') +
          '<div class="m">' + esc(d.klasse) + ' • ' + esc(d.opvolgendBrevet) + '</div>' +
          '<div style="font-size:14px;margin-top:2px">' + samenvatting + '</div></div>' +
          '<span class="chip-ok">Aanwezig</span></div>';
      }).join('') + '</div>';
    }
    h += '</div>';

  } else if (v === 'brevet') {
    var behaald = getBehaaldeBrevetten();
    h += back() + '<h2 style="margin-top:4px">Behaalde brevetten (' + esc(actiefJaar) + ')</h2>' +
      '<div class="m" style="margin-bottom:10px">Overzicht van geregistreerde brevetresultaten (BREVET_OK).</div>';
    if (behaald.length) {
      h += '<div class="list-box">' + behaald.map(function(b) {
        return '<div class="t"><b>#' + esc(b.nr) + '</b><div>' + esc(b.naam) + ' <span class="chip-ok">' + esc(b.brevet) + '</span>' +
          '<div class="m">' + esc(b.stamboom) + ' • ' + esc(b.klasse) + ' • Baan ' + esc(b.baan) + '</div></div>' +
          '<span class="m">Behaald</span></div>';
      }).join('') + '</div>';
    } else {
      h += '<div class="box n"><div class="m">Nog geen behaalde brevetten geregistreerd voor ' + esc(actiefJaar) + '.</div></div>';
    }

  } else if (v === 'hist') {
    var logs = Object.values(logboek).filter(Boolean).sort(function(a, b) { return b.timestamp.localeCompare(a.timestamp); });
    h += back() + '<h2 style="margin-top:4px">Wijzigingen</h2>';
    if (logs.length) {
      h += '<ul class="log">' + logs.map(function(l) {
        var t = new Date(l.timestamp).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
        return '<li>' + t + ' Baan ' + esc(l.baan) + ': ' + esc(l.actie) + '</li>';
      }).join('') + '</ul>';
    } else {
      h += '<div class="m">Nog geen wijzigingen geregistreerd.</div>';
    }
  }

  h += '<div class="foot">NNFC Digitale Waarneming • Reglement Trials 4 oktober 2026</div>';
  document.getElementById('app').innerHTML = h;
}

initFirebase();
draw();
</script>
</body>
</html>
