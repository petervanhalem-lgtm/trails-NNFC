<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedstrijdtafel NNFC</title>
<style>
:root{--bg:#EEF3F5;--sf:#FFFFFF;--sf2:#F7FAFC;--ink:#0E2A3A;--mut:#4D6573;--ac:#0B6E8F;--acink:#FFFFFF;--cur:#FFD23F;--curink:#1B1500;--bad:#B3261E;--ok:#1F7A4D;--ln:#C3D3DB;--soft:#DDE8ED;--warn:#B45309}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1A22;--sf:#14293A;--sf2:#102230;--ink:#E8F1F5;--mut:#9DB4C1;--ac:#4CC3E6;--acink:#06222E;--cur:#FFD23F;--curink:#1B1500;--bad:#FF8A80;--ok:#6FD6A0;--ln:#2C4558;--soft:#1D3547;--warn:#FBBF6A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow Semi Condensed',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.35}
#app{max-width:1100px;margin:0 auto;padding:12px 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap;background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:10px 14px}
.top-l{display:flex;align-items:center;gap:12px}
.top img{width:48px;height:48px;border-radius:50%;flex:none}
h1{font-size:24px;margin:0;font-weight:700;line-height:1.1}
h2{font-size:19px;margin:16px 0 8px;font-weight:700}
.sub,.m{color:var(--mut);font-size:14px}
button,.btn-link{font:inherit;color:inherit;border:1.5px solid var(--ln);background:var(--sf);border-radius:10px;min-height:42px;padding:6px 13px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .12s,border-color .12s}
button:hover,.btn-link:hover{background:var(--sf2)}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;background:var(--sf);border:2px solid var(--ln);border-radius:14px;padding:6px}
.nav button{min-height:40px;border-color:transparent;background:transparent}
.nav button:hover{background:var(--sf2)}
.nav button.on{background:var(--ac);border-color:var(--ac);color:var(--acink)}
.nav button.extra{color:var(--ok);border-color:var(--ok);background:var(--sf)}
.nav button.extra.on{background:var(--ok);color:#FFFFFF}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.c{display:block;width:100%;text-align:left;background:var(--sf);border:2px solid var(--ln);border-radius:14px;padding:12px 14px;font-size:16px;font-weight:500}
.c b{font-weight:700;font-size:20px}
.c.w{border-color:var(--warn)}
.bar{height:7px;border-radius:5px;background:var(--soft);margin:8px 0}
.bar i{display:block;height:7px;border-radius:5px;background:var(--ac)}
.chip{display:inline-block;background:var(--cur);color:var(--curink);border-radius:6px;padding:1px 7px;font-weight:700;font-size:13px}
.chip-ok{display:inline-block;background:var(--ok);color:#fff;border-radius:6px;padding:1px 7px;font-size:13px;font-weight:700}
.chip-bad{display:inline-block;background:var(--bad);color:#fff;border-radius:6px;padding:1px 7px;font-size:13px;font-weight:700}
.warn{color:var(--warn);font-weight:700}
.banner{background:var(--cur);color:var(--curink);border-color:var(--cur);margin-bottom:12px;font-size:18px;font-weight:700}
.t{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:9px 10px;border-top:1px solid var(--ln);align-items:center;font-size:17px}
.t:first-child{border-top:none}
.t b{font-size:20px}
.list-box{background:var(--sf);border:2px solid var(--ln);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row button{min-height:50px;font-size:17px}
.pri{background:var(--ac)!important;border-color:var(--ac)!important;color:var(--acink)!important}
.box{background:var(--sf);border:2.5px solid var(--warn);border-radius:14px;padding:14px;margin-bottom:12px}
.box.n{border-color:var(--ln);border-width:2px}
.big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.log{padding-left:20px;margin:0;color:var(--mut);font-size:15px}
.foot{margin-top:20px;font-size:13px;color:var(--mut)}
input,select{font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--ln);border-radius:10px;padding:8px 10px;width:100%;margin-bottom:10px;min-height:42px}
input:focus,select:focus{outline:none;border-color:var(--ac)}
label{display:block;font-weight:600;font-size:14px;margin-bottom:3px;color:var(--mut)}
.chk{width:24px;height:24px;accent-color:var(--ok);cursor:pointer;margin:0}
.chk-wrap{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:700;padding:5px 10px;border-radius:9px;border:1.5px solid var(--ln);background:var(--sf);color:var(--mut);margin:0;white-space:nowrap}
.chk-wrap.on{border-color:var(--ok);color:var(--ok);background:var(--sf2)}
.search-bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.search-bar input{margin-bottom:0;border-color:var(--ac);font-size:17px}
.search-bar button{min-height:42px;white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
var params = new URLSearchParams(window.location.search);
var IS_ADMIN = params.get('admin') === '1';
var LOGO = 'nnfc-logo.png', db = null;
var KCM_PUNTEN = {"GEEN":0,"BOB":75,"CAC":70,"Res. CAC":65,"U1":55,"U2":50,"U3":45,"U4":40,"U":35,"ZG":25,"G":15,"M":10,"S":5};
var WEIGERING_MS = 600000;
var nuJaar = new Date().getFullYear();
var actiefJaar = (nuJaar >= 2026 && nuJaar <= 2040) ? String(nuJaar) : '2026';
var registraties = {}, meldingen = {}, logboek = {}, banenStatus = {}, deelnemersLijst = [], kcmSelecties = {}, v = 'home', zoekAanm = '', klokBaan = '1';

function laadLokaleData() {
  try {
    deelnemersLijst = JSON.parse(localStorage.getItem('nnfc_deelnemers_' + actiefJaar)) || [];
    var lokaalKcm = JSON.parse(localStorage.getItem('nnfc_kcm_' + actiefJaar)) || {};
    deelnemersLijst.forEach(function(d) {
      if (d && d.kcm && d.kcm !== 'GEEN' && !lokaalKcm[String(d.startnummer)]) {
        lokaalKcm[String(d.startnummer)] = d.kcm;
      }
    });
    kcmSelecties = Object.assign({}, lokaalKcm, kcmSelecties);
  } catch (e) {}
}
laadLokaleData();

function esc(str) {
  return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function safeDraw() {
  if (v === 'extra' || v === 'nood') return;
  if (v === 'aanm' && document.activeElement && document.activeElement.id === 'zoekAanmInp') return;
  draw();
}
function back() {
  return '<button onclick="go(\'home\')" style="margin-bottom:12px">← Terug naar overzicht</button>';
}

function matchZoek(d, q) {
  if (!q) return true;
  var woorden = q.toLowerCase().trim().split(/\s+/);
  var kcmVal = kcmSelecties[String(d.startnummer)] || d.kcm || '';
  var tekst = [
    d.startnummer, '#' + d.startnummer,
    d.roepnaam, d.stamboom, d.eigenaar, d.lidnr,
    d.klasse, d.geslacht, d.opvolgendBrevet,
    (kcmVal && kcmVal !== 'GEEN') ? ('kcm ' + kcmVal) : '',
    'baan ' + d.baan, 'b' + d.baan,
    d.betaald ? 'betaald' : 'nog betalen',
    d.aanwezig ? 'aanwezig' : 'niet aanwezig'
  ].join(' ').toLowerCase();
  return woorden.every(function(w) { return tekst.indexOf(w) !== -1; });
}

function updateZoekAanm(val) {
  zoekAanm = val;
  var cont = document.getElementById('aanmLijstContainer');
  if (cont) cont.innerHTML = renderAanmLijst();
  else draw();
}

function wisZoekAanm() {
  zoekAanm = '';
  draw();
  var el = document.getElementById('zoekAanmInp');
  if (el) el.focus();
}

function renderAanmLijst() {
  if (!deelnemersLijst.length) {
    return '<div class="box n"><div class="m">Nog geen deelnemers ingeladen. Gebruik "+ Extra deelnemer" of laad vanuit Beheer.</div></div>';
  }
  var gefilterd = deelnemersLijst.filter(function(d) { return matchZoek(d, zoekAanm); });
  var teller = zoekAanm.trim()
    ? '<div class="m" style="margin-bottom:8px">Gevonden: <b>' + gefilterd.length + '</b> van ' + deelnemersLijst.length + ' deelnemers</div>'
    : '';
  if (!gefilterd.length) {
    return teller + '<div class="box n"><div class="m">Geen deelnemers gevonden voor "<b>' + esc(zoekAanm) + '</b>".</div></div>';
  }
  return teller + '<div class="list-box">' + gefilterd.map(function(d) {
    var kcmVal = kcmSelecties[String(d.startnummer)] || d.kcm || 'GEEN';
    var kcmTag = (kcmVal && kcmVal !== 'GEEN') ? ' <span class="chip">KCM: ' + esc(kcmVal) + '</span>' : '';
    return '<div class="t"><b>B' + esc(d.baan) + '</b><div>#' + esc(d.startnummer) + ' ' + esc(d.roepnaam) + ' <span class="' + (d.betaald ? 'chip-ok' : 'chip-bad') + '">' + (d.betaald ? 'Betaald' : 'Nog betalen') + '</span>' + kcmTag +
      '<div class="m">' + esc(d.stamboom) + ' • ' + esc(d.eigenaar || '-') + (d.lidnr && d.lidnr !== 'ONBEKEND' ? ' (Lidnr: ' + esc(d.lidnr) + ')' : '') + ' • ' + esc(d.klasse) + '</div></div>' +
      '<label class="chk-wrap' + (d.aanwezig ? ' on' : '') + '"><span>' + (d.aanwezig ? 'Aanwezig' : 'Niet aanwezig') + '</span><input type="checkbox" class="chk" ' + (d.aanwezig ? 'checked' : '') + ' onchange="toggleAanwezig(' + esc(d.startnummer) + ')"></label></div>';
  }).join('') + '</div>';
}

function initFirebase() {
  try {
    if (typeof firebase !== 'undefined' && typeof firebaseConfig !== 'undefined' && firebaseConfig.apiKey && firebaseConfig.apiKey !== "JOUW_API_KEY") {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      db.ref('wedstrijd/actief_jaar').on('value', function(s) {
        if (s.val()) {
          actiefJaar = String(s.val());
          laadLokaleData();
          safeDraw();
        }
      });
      db.ref('wedstrijd/registraties').on('value', function(s) { registraties = s.val() || {}; detectConflicts(); safeDraw(); });
      db.ref('wedstrijd/meldingen').on('value', function(s) { meldingen = s.val() || {}; safeDraw(); });
      db.ref('wedstrijd/logboek').on('value', function(s) { logboek = s.val() || {}; if (v === 'hist') draw(); });
      db.ref('wedstrijd/banen_status').on('value', function(s) { banenStatus = s.val() || {}; safeDraw(); });
      db.ref('wedstrijd/kcm_selecties').on('value', function(s) {
        var val = s.val() || {};
        kcmSelecties = Object.assign({}, kcmSelecties, val);
        safeDraw();
      });
      db.ref('wedstrijd/beheer_deelnemers').on('value', function(s) {
        var val = s.val();
        if (val) {
          deelnemersLijst = Array.isArray(val) ? val.filter(Boolean) : Object.values(val).filter(Boolean);
          deelnemersLijst.forEach(function(d) {
            if (d && d.kcm && d.kcm !== 'GEEN' && !kcmSelecties[String(d.startnummer)]) {
              kcmSelecties[String(d.startnummer)] = d.kcm;
            }
          });
          safeDraw();
        }
      });
    }
  } catch (e) {}
}

function go(x) {
  v = x;
  draw();
  window.scrollTo(0, 0);
  if (x === 'aanm') {
    var inp = document.getElementById('zoekAanmInp');
    if (inp) inp.focus();
  }
}
function formatSec(ms, bm) { var s = (ms / 1000).toFixed(2).replace('.', ','); return bm ? s + '*' : s; }

async function setKcm(nr, val) {
  var key = String(nr);
  if (val === 'GEEN') {
    delete kcmSelecties[key];
  } else {
    kcmSelecties[key] = val;
  }
  var d = deelnemersLijst.find(function(x) { return String(x.startnummer) === key; });
  if (d) d.kcm = val;
  try {
    localStorage.setItem('nnfc_kcm_' + actiefJaar, JSON.stringify(kcmSelecties));
    localStorage.setItem('nnfc_deelnemers_' + actiefJaar, JSON.stringify(deelnemersLijst));
  } catch (e) {}
  draw();
  if (db) {
    try {
      await db.ref('wedstrijd/kcm_selecties/' + key).set(val === 'GEEN' ? null : val);
      if (d && d.id) await db.ref('wedstrijd/beheer_deelnemers/' + d.id + '/kcm').set(val);
    } catch (e) {}
  }
}

function getGroepen() {
  var map = {};
  Object.values(registraties).forEach(function(r) {
    if (!r || r.status === 'AFGEWEZEN' || (r.oefening !== 'A' && r.oefening !== 'B' && r.oefening !== 'C')) return;
    if (!map[r.startnummer]) {
      var meta = deelnemersLijst.find(function(d) { return d.startnummer == r.startnummer; }) || {};
      map[r.startnummer] = { nr: r.startnummer, naam: r.roepnaam, klasse: r.klasse, geslacht: r.geslacht, bm: Boolean(meta.buitenMededinging || r.buitenMededinging), oef: {} };
    }
    var ms = r.type === 'WEIGERING' ? WEIGERING_MS : (r.tijdMs || 0);
    map[r.startnummer].oef[r.oefening] = { ms: ms, txt: r.type === 'WEIGERING' ? '600,00 (W)' : r.tijdTekst };
  });

  var gr = [
    { titel: 'Open reuen', lijst: [] }, { titel: 'Open teven', lijst: [] },
    { titel: 'Jeugd', lijst: [] }, { titel: 'Veteranen', lijst: [] },
    { titel: 'Stamboomloos', lijst: [] }, { titel: 'Special', lijst: [] }
  ];

  Object.values(map).forEach(function(h) {
    h.totaalMs = (h.oef.A ? h.oef.A.ms : 0) + (h.oef.B ? h.oef.B.ms : 0) + (h.oef.C ? h.oef.C.ms : 0);
    h.gedaan = Object.keys(h.oef).length;
    if (h.klasse === 'Open' && h.geslacht === 'Reu') gr.slice(0, 1).pop().lijst.push(h);
    else if (h.klasse === 'Open' && h.geslacht === 'Teef') gr.slice(1, 2).pop().lijst.push(h);
    else if (h.klasse === 'Jeugd') gr.slice(2, 3).pop().lijst.push(h);
    else if (h.klasse === 'Veteranen' || h.klasse === 'Senioren') gr.slice(3, 4).pop().lijst.push(h);
    else if (h.klasse === 'Stamboomloos') gr.slice(4, 5).pop().lijst.push(h);
    else if (h.klasse === 'Specials') gr.slice(5, 6).pop().lijst.push(h);
  });

  gr.forEach(function(g) {
    g.lijst.sort(function(x, y) {
      if (x.bm !== y.bm) return x.bm ? 1 : -1;
      return (y.gedaan - x.gedaan) || (x.totaalMs - y.totaalMs);
    });
    var reg = 0;
    g.lijst.forEach(function(h, idx) {
      h.rang = idx + 1;
      if (!h.bm) { h.pnt = Math.max(0, 250 - (reg * 5)); reg++; } else { h.pnt = 0; }
    });
  });
  return gr;
}

function openMeldingen() { return Object.values(meldingen).filter(function(m) { return m && m.status === 'OPEN'; }); }

function detectConflicts() {
  if (!db) return;
  var seen = {};
  Object.values(registraties).forEach(function(r) {
    if (!r || r.status === 'AFGEWEZEN') return;
    var key = r.startnummer + '_' + r.oefening;
    if (seen[key] && seen[key].id !== r.id) {
      var cid = 'CONF_' + r.id;
      if (!meldingen[cid]) {
        db.ref('wedstrijd/meldingen/' + cid).set({
          id: cid, soort: 'CONFLICT', status: 'OPEN', baan: r.baan, oefening: r.oefening,
          startnummer: r.startnummer, roepnaam: r.roepnaam,
          oudeRegId: seen[key].id, oudeTijd: seen[key].tijdTekst,
          nieuweRegId: r.id, nieuweTijd: r.tijdTekst, nieuweTijdMs: r.tijdMs,
          reden: 'Dubbele registratie voor dezelfde hond/oefening', timestamp: new Date().toISOString()
        });
      }
    } else {
      seen[key] = r;
    }
  });
}

async function beslis(id, akkoord) {
  var m = meldingen[id]; if (!m) return;
  if (db) {
    if (akkoord) {
      if (m.oudeRegId && registraties[m.oudeRegId]) await db.ref('wedstrijd/registraties/' + m.oudeRegId).update({ status: 'AFGEWEZEN' });
      if (m.nieuweRegId && registraties[m.nieuweRegId]) await db.ref('wedstrijd/registraties/' + m.nieuweRegId).update({ status: 'GEACCEPTEERD' });
      else {
        var k = Object.keys(registraties).find(function(key) { return registraties[key].startnummer == m.startnummer && registraties[key].oefening == m.oefening && registraties[key].status !== 'AFGEWEZEN'; });
        if (k) await db.ref('wedstrijd/registraties/' + k).update({ tijdTekst: m.nieuweTijd, tijdMs: m.nieuweTijdMs, type: 'TIJD' });
      }
    } else if (m.nieuweRegId && registraties[m.nieuweRegId]) {
      await db.ref('wedstrijd/registraties/' + m.nieuweRegId).update({ status: 'AFGEWEZEN' });
    }
    await db.ref('wedstrijd/meldingen/' + id).update({ status: akkoord ? 'GEACCEPTEERD' : 'AFGEWEZEN' });
    await db.ref('wedstrijd/logboek/BESL_' + Date.now()).set({ baan: m.baan, actie: 'Tafel ' + (akkoord ? 'accepteert' : 'wijst af') + ' wijziging #' + m.startnummer, timestamp: new Date().toISOString() });
  } else {
    if (!akkoord && m.nieuweRegId && registraties[m.nieuweRegId]) registraties[m.nieuweRegId].status = 'AFGEWEZEN';
    meldingen[id].status = akkoord ? 'GEACCEPTEERD' : 'AFGEWEZEN';
    draw();
  }
}


async function verwijderRegistratie(regId) {
  if (!regId) return;
  var r = registraties[regId];
  var label = r ? ('#' + r.startnummer + ' ' + r.roepnaam + ' (Oef. ' + r.oefening + ': ' + r.tijdTekst + ')') : regId;
  if (!confirm('Tijd verwijderen voor ' + label + '? Daarna kun je deze handmatig opnieuw invoeren.')) return;
  if (db) {
    await db.ref('wedstrijd/registraties/' + regId).remove();
    if (r) {
      await db.ref('wedstrijd/logboek/DEL_' + Date.now()).set({
        baan: r.baan,
        actie: 'Tijd verwijderd voor #' + r.startnummer + ' ' + r.roepnaam + ' (Oef. ' + r.oefening + ')',
        timestamp: new Date().toISOString()
      });
    }
  } else {
    delete registraties[regId];
    draw();
  }
}

async function verwijderHondTijden(startnr, baanNr) {
  var keys = Object.keys(registraties).filter(function(k) {
    var r = registraties[k];
    return r && String(r.startnummer) === String(startnr) && (!baanNr || String(r.baan) === String(baanNr));
  });
  if (!keys.length) { alert('Geen geregistreerde oefeningen gevonden voor #' + startnr + '.'); return; }
  if (!confirm('Alle ' + keys.length + ' geregistreerde oefening(en) van #' + startnr + ' verwijderen zodat ze handmatig ingevoerd kunnen worden?')) return;
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    if (db) await db.ref('wedstrijd/registraties/' + k).remove();
    else delete registraties[k];
  }
  if (db) {
    await db.ref('wedstrijd/logboek/DELALL_' + Date.now()).set({
      baan: baanNr || '-',
      actie: 'Alle oefeningen verwijderd voor #' + startnr + ' voor handmatige invoer',
      timestamp: new Date().toISOString()
    });
  } else {
    draw();
  }
}

async function leesBericht(id) { if (db) await db.ref('wedstrijd/meldingen/' + id).update({ status: 'GELEZEN' }); else if (meldingen[id]) { meldingen[id].status = 'GELEZEN'; draw(); } }

async function toggleAanwezig(nr) {
  var d = deelnemersLijst.find(function(x) { return x.startnummer == nr; }); if (!d) return;
  d.aanwezig = !d.aanwezig;
  localStorage.setItem('nnfc_deelnemers_' + actiefJaar, JSON.stringify(deelnemersLijst));
  draw();
  if (db) {
    await db.ref('wedstrijd/beheer_deelnemers/' + d.id).set(d);
    await stuurBaan(d.baan);
  }
}

async function stuurBaan(baanNr) {
  if (!db) return;
  var lijst = deelnemersLijst.filter(function(x) { return x.baan == baanNr && x.aanwezig; }).map(function(h) {
    return { nr: h.startnummer, roepnaam: h.roepnaam, klasse: h.klasse, geslacht: h.geslacht, opvolgendBrevet: h.opvolgendBrevet, buitenMededinging: Boolean(h.buitenMededinging) };
  });
  await db.ref('wedstrijd/baan_lijsten/baan_' + baanNr).set(lijst);
}

async function syncAlleBanen() { if (!db) { alert('Firebase is nog niet gekoppeld in config.js.'); return; } for (var b = 1; b <= 5; b++) await stuurBaan(b); alert('Alle aanwezige honden zijn doorgestuurd naar Baan 1 t/m 5.'); }

async function slaExtraOp() {
  var roep = document.getElementById('exRoep').value.trim(), stam = document.getElementById('exStam').value.trim();
  if (!roep && !stam) { alert('Vul minimaal een roepnaam of stamboomnaam in.'); return; }
  var nr = parseInt(document.getElementById('exNr').value, 10) || (deelnemersLijst.length + 101), baan = document.getElementById('exBaan').value;
  if (deelnemersLijst.some(function(x) { return x.startnummer == nr; })) { alert('Startnummer ' + nr + ' bestaat al.'); return; }
  var kcmVal = document.getElementById('exKcm').value || 'GEEN';
  var nieuw = { id: 'EXTRA_' + Date.now(), startnummer: nr, baan: baan, roepnaam: roep || stam, stamboom: stam || roep, eigenaar: document.getElementById('exEig').value.trim() || 'Daginschrijving', geslacht: document.getElementById('exGesl').value, klasse: document.getElementById('exKlas').value, opvolgendBrevet: document.getElementById('exBrev').value, kcm: kcmVal, betaald: document.getElementById('exBet').checked, buitenMededinging: document.getElementById('exBm').checked, aanwezig: true };
  deelnemersLijst.push(nieuw);
  if (kcmVal !== 'GEEN') kcmSelecties[String(nr)] = kcmVal;
  localStorage.setItem('nnfc_deelnemers_' + actiefJaar, JSON.stringify(deelnemersLijst));
  localStorage.setItem('nnfc_kcm_' + actiefJaar, JSON.stringify(kcmSelecties));
  if (db) {
    await db.ref('wedstrijd/beheer_deelnemers/' + nieuw.id).set(nieuw);
    if (kcmVal !== 'GEEN') await db.ref('wedstrijd/kcm_selecties/' + nr).set(kcmVal);
    await stuurBaan(baan);
  }
  go('aanm');
}

async function slaNoodOp() {
  var nr = document.getElementById('ndHond').value, d = deelnemersLijst.find(function(x) { return x.startnummer == nr; });
  if (!d) { alert('Kies eerst een deelnemer.'); return; }
  var oef = document.getElementById('ndOef').value, type = document.getElementById('ndType').value, txt = type === 'WEIGERING' ? 'WEIGERING' : 'UITGEVOERD', ms = null;
  if (type === 'TIJD') {
    var raw = document.getElementById('ndCijf').value.replace(/\D/g, ''); if (!raw) { alert('Voer cijfers in.'); return; }
    var pad = raw.padStart(3, '0'), h = parseInt(pad.slice(-2), 10), s = parseInt(pad.slice(-4, -2) || '0', 10), m = parseInt(pad.slice(0, -4) || '0', 10);
    if (s > 59) { alert('Seconden moeten onder 60 liggen.'); return; }
    ms = (m * 60000) + (s * 1000) + (h * 10);
    if (ms === 0) { alert('Tijd van 0,00 is niet toegestaan.'); return; }
    txt = m > 0 ? (m + ':' + String(s).padStart(2, '0') + ',' + String(h).padStart(2, '0')) : (s + ',' + String(h).padStart(2, '0'));
  }
  var rid = 'TAFEL_' + d.baan + '_' + oef + '_' + d.startnummer + '_' + Date.now();
  var payload = { id: rid, baan: d.baan, klasse: d.klasse, oefening: oef, startnummer: d.startnummer, roepnaam: d.roepnaam, geslacht: d.geslacht, buitenMededinging: Boolean(d.buitenMededinging), type: type, tijdTekst: txt, tijdMs: ms, timestamp: new Date().toISOString() };
  if (db) await db.ref('wedstrijd/registraties/' + rid).set(payload); else registraties[rid] = payload;
  go('home');
}

function exporteerUitslagCsv() {
  var regels = ['Klasse;Plaats;Startnummer;Roepnaam;Oefening A;Oefening B;Oefening C;Totaal Seconden;Bekerpunten;KCM;Buiten Mededinging'];
  getGroepen().forEach(function(g) {
    g.lijst.forEach(function(d, j) {
      var kcm = kcmSelecties[String(d.nr)] || 'GEEN';
      regels.push([
        g.titel, j + 1, d.nr, d.naam,
        d.oef.A ? d.oef.A.txt : '-', d.oef.B ? d.oef.B.txt : '-', d.oef.C ? d.oef.C.txt : '-',
        formatSec(d.totaalMs, false), d.bm ? 0 : d.pnt, kcm === 'GEEN' ? '-' : kcm, d.bm ? 'Ja' : 'Nee'
      ].join(';'));
    });
  });
  var blob = new Blob(['\uFEFF' + regels.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nnfc_officiele_uitslag_' + actiefJaar + '.csv';
  a.click();
}

  } else if (v === 'klok') {

    var aanwezigeBaan = deelnemersLijst.filter(function(d) { return String(d.baan) === bSel && d.aanwezig; });
    var baanRecs = Object.values(registraties).filter(function(r) { return r && String(r.baan) === bSel && r.status !== 'AFGEWEZEN'; });

    var baanKnoppen = ['1', '2', '3', '4', '5'].map(function(n) {
      var cntAanw = deelnemersLijst.filter(function(d) { return String(d.baan) === n && d.aanwezig; }).length;
      return '<button class="' + (bSel === n ? 'pri' : '') + '" onclick="klokBaan=\'' + n + '\';draw()">Baan ' + n + ' (' + cntAanw + ' aanwezig)</button>';
    }).join('');

    var klokLaatstGezien = 'Nog geen signaal van de baan';
    if (stKlok.serverTijd) {
      var dtK = new Date(stKlok.serverTijd);
      klokLaatstGezien = 'Laatst gezien om ' + dtK.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
    }

    h += back() +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">' +
        '<div><h2 style="margin:0">Klokkersbeeld & Startlijstcontrole</h2><div class="m">Bekijk exact welke aanwezige honden, oefening en tijden er voor de klokker op de baan staan.</div></div>' +
        '<a href="klokker.html?baan=' + esc(bSel) + '" target="_blank" class="btn-link">Open klokker.html (Baan ' + esc(bSel) + ') ↗</a>' +
      '</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">' + baanKnoppen + '</div>' +
      '<div class="g" style="margin-bottom:12px">' +
        '<div class="box n" style="margin-bottom:0"><div class="m">Actieve oefening & status</div><div class="big">Oefening ' + esc(stKlok.oefening || 'A') + '</div><div class="m" style="margin-top:4px">' + esc(klokLaatstGezien) + '</div></div>' +
        '<div class="box n" style="margin-bottom:0"><div class="m">Aanwezige honden op startlijst</div><div class="big">' + aanwezigeBaan.length + '</div><div class="m" style="margin-top:4px">Alleen aangevinkte honden gaan naar de baan</div></div>' +
        '<div class="box n" style="margin-bottom:0"><div class="m">Geregistreerde tijden op baan</div><div class="big">' + baanRecs.length + '</div><div class="m" style="margin-top:4px">Huidige hond: <b>' + esc(stKlok.nuHond || 'Wacht op start') + '</b></div></div>' +
      '</div>' +
      '<div class="box n"><h2 style="margin-top:0">Startlijst klokker — Baan ' + esc(bSel) + ' (Aanwezig)</h2>';

    if (!aanwezigeBaan.length) {
      h += '<div class="m">Geen aanwezige honden op Baan ' + esc(bSel) + '. Controleer <b>Aanmelding</b> of synchroniseer vanuit Beheer.</div>';
    } else {
      h += '<div class="list-box">' + aanwezigeBaan.map(function(d, idx) {
        var hondTijden = baanRecs.filter(function(r) { return String(r.startnummer) === String(d.startnummer); });
        var samenvatting = hondTijden.length
          ? hondTijden.map(function(r) { return 'Oef ' + esc(r.oefening) + ': <b>' + esc(r.tijdTekst) + '</b>'; }).join(' • ')
          : '<span class="m">Nog geen tijd geregistreerd</span>';
        return '<div class="t"><b>' + (idx + 1) + '</b><div>' +
          '#' + esc(d.startnummer) + ' ' + esc(d.roepnaam) +
          (d.buitenMededinging ? ' <span class="chip">*</span>' : '') +
          '<div class="m">' + esc(d.klasse) + ' • ' + esc(d.opvolgendBrevet) + '</div>' +
          '<div style="font-size:14px;margin-top:2px">' + samenvatting + '</div></div>' +
          '<span class="chip-ok">Aanwezig</span></div>';
      }).join('') + '</div>';
    }
    h += '</div>';

  } else if (v === 'hist') {
    var logs = Object.values(logboek).filter(Boolean).sort(function(a, b) { return b.timestamp.localeCompare(a.timestamp); });
    h += back() + '<h2 style="margin-top:4px">Wijzigingen</h2>';
    if (logs.length) {
      h += '<ul class="log">' + logs.map(function(l) {
        var t = new Date(l.timestamp).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
        return '<li>' + t + ' Baan ' + esc(l.baan) + ': ' + esc(l.actie) + '</li>';
      }).join('') + '</ul>';
    } else {
      h += '<div class="m">Nog geen wijzigingen geregistreerd.</div>';
    }
  }

  h += '<div class="foot">NNFC Digitale Waarneming • Reglement Trials 4 oktober 2026</div>';
  document.getElementById('app').innerHTML = h;
}

initFirebase();
draw();
</script>
</body>
</html>
