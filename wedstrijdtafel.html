<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedstrijdtafel NNFC</title>
<link rel="stylesheet" href="https://googleapis.com">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #DCE4EC;
    color: #091E2C;
    font-family: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif;
    font-size: 18px;
    line-height: 1.35;
  }
  .topbar {
    background: #091E2C;
    color: #FFFFFF;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.25);
  }
  .topbar h1 { margin: 0; font-size: 26px; letter-spacing: 0.3px; }
  .topbar .sub { color: #93C5FD; font-size: 15px; font-weight: 600; }
  .btn-menu {
    background: #1E3A5F;
    color: #FFFFFF;
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 700;
    border: 2px solid #3B82F6;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 16px 16px 50px; }

  .nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .nav button {
    font: inherit;
    font-weight: 700;
    font-size: 17px;
    padding: 10px 16px;
    border-radius: 10px;
    border: 2px solid #091E2C;
    background: #FFFFFF;
    color: #091E2C;
    cursor: pointer;
  }
  .nav button.on { background: #005A8D; color: #FFFFFF; border-color: #005A8D; }
  .nav button.btn-groen { background: #116530; color: #FFFFFF; border-color: #116530; }

  h2 { font-size: 22px; margin: 20px 0 10px; color: #091E2C; border-left: 5px solid #005A8D; padding-left: 10px; }

  .grid-banen { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .grid-stand { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 14px; }

  .kaart {
    display: block;
    width: 100%;
    text-align: left;
    background: #FFFFFF;
    border: 2px solid #94A3B8;
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 2px 6px rgba(9,30,44,0.1);
    cursor: pointer;
    font: inherit;
    color: #091E2C;
  }
  .kaart:hover { border-color: #005A8D; transform: translateY(-2px); }
  .kaart.warn { border: 3px solid #DC2626; background: #FEF2F2; }
  .kaart-titel { font-size: 21px; font-weight: 700; color: #005A8D; }
  .kaart-sub { font-size: 15px; color: #475569; font-weight: 600; }

  .bar { height: 10px; border-radius: 6px; background: #CBD5E1; margin: 10px 0; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #005A8D; }

  .chip-nu { display: inline-block; background: #FFC700; color: #091E2C; padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 15px; }
  .chip-ok { display: inline-block; background: #116530; color: #FFFFFF; padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 14px; }
  .chip-bad { display: inline-block; background: #B91C1C; color: #FFFFFF; padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 14px; }

  .banner-alert {
    display: block; width: 100%; text-align: left;
    background: #FFC700; color: #091E2C; border: 3px solid #091E2C;
    border-radius: 12px; padding: 12px 16px; font-size: 19px; font-weight: 700;
    margin-bottom: 16px; cursor: pointer;
  }

  .panel { background: #FFFFFF; border: 2px solid #94A3B8; border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .rij { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: center; padding: 10px 4px; border-top: 1px solid #CBD5E1; }
  .rij-nr { font-size: 22px; font-weight: 700; color: #005A8D; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: block; font-weight: 700; font-size: 15px; margin-bottom: 4px; color: #1E293B; }
  input, select {
    font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 2px solid #64748B; background: #FFFFFF; color: #091E2C; margin-bottom: 12px;
  }
  .btn-actie {
    font: inherit; font-weight: 700; padding: 12px 18px; border-radius: 10px;
    border: none; background: #005A8D; color: #FFFFFF; cursor: pointer; font-size: 18px;
  }
  .btn-actie.groen { background: #116530; }
  .btn-actie.rood { background: #B91C1C; }
  .chk { width: 26px; height: 26px; accent-color: #116530; cursor: pointer; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>
<script src="config.js"></script>

<script>
var db = null;
try {
  if (typeof firebaseConfig !== 'undefined' && firebaseConfig.apiKey && firebaseConfig.apiKey !== "JOUW_API_KEY") {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  }
} catch (e) {}

var KCM_PUNTEN = {
  "GEEN": 0, "BOB": 75, "CAC": 70, "Res. CAC": 65,
  "U1": 55, "U2": 50, "U3": 45, "U4": 40, "U": 35,
  "ZG": 25, "G": 15, "M": 10, "S": 5
};
var WEIGERING_MS = 600000;

var registraties = {};
var meldingen = {};
var logboek = {};
var banenStatus = {};
var deelnemersLijst = [];
var kcmSelecties = {};

try {
  deelnemersLijst = JSON.parse(localStorage.getItem('nnfc_deelnemers_2027')) || [];
  kcmSelecties = JSON.parse(localStorage.getItem('nnfc_kcm_2026')) || {};
} catch (e) {}

var scherm = 'home';

if (db) {
  db.ref('wedstrijd/registraties').on('value', function(snap) { registraties = snap.val() || {}; tekenScherm(); });
  db.ref('wedstrijd/meldingen').on('value', function(snap) { meldingen = snap.val() || {}; tekenScherm(); });
  db.ref('wedstrijd/logboek').on('value', function(snap) { logboek = snap.val() || {}; if (scherm === 'hist') tekenScherm(); });
  db.ref('wedstrijd/banen_status').on('value', function(snap) { banenStatus = snap.val() || {}; tekenScherm(); });
  db.ref('wedstrijd/beheer_deelnemers').on('value', function(snap) {
    var val = snap.val();
    if (val) {
      deelnemersLijst = Array.isArray(val) ? val : Object.values(val);
      tekenScherm();
    }
  });
}

function gaNaar(s) { scherm = s; tekenScherm(); window.scrollTo(0, 0); }

function formatSec(ms, bm) {
  var s = (ms / 1000).toFixed(2).replace('.', ',');
  return bm ? s + '*' : s;
}

function berekenGroepen() {
  var map = {};
  Object.values(registraties).forEach(function(r) {
    if (!r || (r.oefening !== 'A' && r.oefening !== 'B' && r.oefening !== 'C')) return;
    if (!map[r.startnummer]) {
      var meta = deelnemersLijst.find(function(d) { return d.startnummer == r.startnummer; }) || {};
      map[r.startnummer] = {
        nr: r.startnummer, naam: r.roepnaam, klasse: r.klasse, geslacht: r.geslacht,
        bm: Boolean(meta.buitenMededinging || r.buitenMededinging), oef: {}
      };
    }
    var ms = r.type === 'WEIGERING' ? WEIGERING_MS : (r.tijdMs || 0);
    map[r.startnummer].oef[r.oefening] = { ms: ms, txt: r.type === 'WEIGERING' ? '600,00 (W)' : r.tijdTekst };
  });

  var groepen = [
    { titel: 'Open Reuen', lijst: [] },
    { titel: 'Open Teven', lijst: [] },
    { titel: 'Jeugdklasse', lijst: [] },
    { titel: 'Veteranen (Senioren)', lijst: [] },
    { titel: 'Stamboomloos', lijst: [] },
    { titel: 'Specials', lijst: [] }
  ];

  Object.values(map).forEach(function(h) {
    var a = h.oef.A ? h.oef.A.ms : 0;
    var b = h.oef.B ? h.oef.B.ms : 0;
    var c = h.oef.C ? h.oef.C.ms : 0;
    h.totaalMs = a + b + c;
    h.gedaan = Object.keys(h.oef).length;

    if (h.klasse === 'Open' && h.geslacht === 'Reu') groepen.at(0).lijst.push(h);
    else if (h.klasse === 'Open' && h.geslacht === 'Teef') groepen.at(1).lijst.push(h);
    else if (h.klasse === 'Jeugd') groepen.at(2).lijst.push(h);
    else if (h.klasse === 'Veteranen' || h.klasse === 'Senioren') groepen.at(3).lijst.push(h);
    else if (h.klasse === 'Stamboomloos') groepen.at(4).lijst.push(h);
    else if (h.klasse === 'Specials') groepen.at(5).lijst.push(h);
  });

  groepen.forEach(function(g) {
    g.lijst.sort(function(x, y) {
      if (x.bm !== y.bm) return x.bm ? 1 : -1;
      return (y.gedaan - x.gedaan) || (x.totaalMs - y.totaalMs);
    });
    var reg = 0;
    g.lijst.forEach(function(h, idx) {
      h.rang = idx + 1;
      if (!h.bm) { h.pnt = Math.max(0, 250 - (reg * 5)); reg++; }
      else { h.pnt = 0; }
    });
  });
  return groepen;
}

async function toggleAanwezig(nr) {
  var d = deelnemersLijst.find(function(x) { return x.startnummer == nr; });
  if (!d) return;
  d.aanwezig = !d.aanwezig;
  localStorage.setItem('nnfc_deelnemers_2027', JSON.stringify(deelnemersLijst));
  tekenScherm();
  if (db) {
    await db.ref('wedstrijd/beheer_deelnemers').set(deelnemersLijst);
    await stuurBaan(d.baan);
  }
}

async function stuurBaan(baanNr) {
  if (!db) return;
  var lijst = deelnemersLijst.filter(function(x) { return x.baan == baanNr && x.aanwezig; }).map(function(h) {
    return {
      nr: h.startnummer, roepnaam: h.roepnaam, stamboom: h.stamboom,
      geslacht: h.geslacht, klasse: h.klasse, opvolgendBrevet: h.opvolgendBrevet,
      buitenMededinging: Boolean(h.buitenMededinging)
    };
  });
  await db.ref('wedstrijd/baan_lijsten/baan_' + baanNr).set(lijst);
}

async function syncAlleBanen() {
  if (!db) { alert('Firebase is nog niet gekoppeld in config.js.'); return; }
  for (var b = 1; b <= 5; b++) await stuurBaan(b);
  alert('Alle aanwezige honden zijn doorgestuurd naar Baan 1 t/m 5.');
}

async function slaExtraOp() {
  var roep = document.getElementById('exRoep').value.trim();
  var stam = document.getElementById('exStam').value.trim();
  if (!roep && !stam) { alert('Vul minimaal een roepnaam of stamboomnaam in.'); return; }
  var nr = parseInt(document.getElementById('exNr').value, 10) || (deelnemersLijst.length + 101);
  var baan = document.getElementById('exBaan').value;

  var nieuw = {
    id: 'EXTRA_' + Date.now(), startnummer: nr, baan: baan,
