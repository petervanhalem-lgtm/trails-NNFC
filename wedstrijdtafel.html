<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedstrijdtafel – NNFC</title>
<style>
:root{
  --bg:#EEF3F5;--sf:#FFFFFF;--sf2:#F7FAFC;--ink:#0E2A3A;--mut:#4D6573;--ac:#0B6E8F;--acink:#FFFFFF;
  --cur:#FFD23F;--curink:#1B1500;--bad:#B3261E;--ok:#1F7A4D;--ln:#C3D3DB;--soft:#DDE8ED;--warn:#B45309;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1A22;--sf:#14293A;--sf2:#102230;--ink:#E8F1F5;--mut:#9DB4C1;--ac:#4CC3E6;--acink:#06222E;
    --cur:#FFD23F;--curink:#1B1500;--bad:#FF8A80;--ok:#6FD6A0;--ln:#2C4558;--soft:#1D3547;--warn:#FBBF6A;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow Semi Condensed',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.35}
.wrap{max-width:1380px;margin:0 auto;padding:14px 18px 60px}

/* UNIFORME BOVENSTE BALK */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px;flex-wrap:wrap;background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:12px 16px}
.top-l{display:flex;align-items:center;gap:12px;min-width:240px;flex:1 1 320px}
.top img{width:48px;height:48px;border-radius:50%;flex:none}
h1{font-size:23px;margin:0;font-weight:700;line-height:1.15}
h2{font-size:19px;margin:0;font-weight:700}
h3{font-size:16px;margin:0 0 6px;font-weight:700}
.sub{color:var(--mut);font-size:14px}

.top-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.top-r select,.top-r button,.top-r .btn-link{height:40px;min-height:40px;max-height:40px;padding:0 13px;font-size:15px;line-height:1;border-radius:10px;white-space:nowrap}
.top-r select{width:auto;margin:0;font-weight:700;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink)}
.top-sep{width:10px;flex:none}

button,.btn-link{font:inherit;color:inherit;border:1.5px solid var(--ln);background:var(--sf);border-radius:10px;min-height:40px;padding:6px 13px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .12s,border-color .12s}
button:hover,.btn-link:hover{background:var(--sf2)}
.btn-link.active{background:var(--soft);border-color:var(--ac);color:var(--ink)}
.pri{background:var(--ac)!important;border-color:var(--ac)!important;color:var(--acink)!important}
.ok{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important}
.bad{border-color:var(--bad)!important;color:var(--bad)!important;min-height:36px;padding:4px 10px}
.sm{min-height:36px;padding:4px 10px;font-size:15px}

/* 6-STAPPEN DAGVERLOOPBALK */
.steps-bar{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px;background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:10px}
@media(max-width:1120px){.steps-bar{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.steps-bar{grid-template-columns:repeat(2,1fr)}}
.step-btn{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;padding:10px 12px;border-radius:11px;background:var(--sf2);border:1.5px solid var(--ln);min-height:76px;height:auto;line-height:1.2}
.step-btn .fase{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin-bottom:4px}
.step-btn .naam{font-size:15px;font-weight:700;color:var(--ink)}
.step-btn.on{background:var(--ac)!important;border-color:var(--ac)!important}
.step-btn.on .fase,.step-btn.on .naam{color:var(--acink)!important}

.status-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--sf);border:1.5px solid var(--ln);border-radius:12px;padding:8px 14px;margin-bottom:12px}
.status-left,.status-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.box{background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}
.box-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:1100px){.grid5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
@media(max-width:620px){.grid5{grid-template-columns:1fr}}
.kaart{background:var(--sf2);border:1.5px solid var(--ln);border-radius:12px;padding:12px}

label{display:block;font-weight:600;font-size:14px;margin-bottom:3px;color:var(--mut)}
input,select{font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--ln);border-radius:10px;padding:7px 10px;width:100%;margin-bottom:9px;min-height:40px}
input:focus,select:focus{outline:none;border-color:var(--ac)}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.search-wrap{flex:1;min-width:240px;display:flex;gap:6px;align-items:center}
.search-wrap input{margin-bottom:0;border-color:var(--ac)}
.stats-pill{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--mut);background:var(--sf2);padding:8px 12px;border-radius:10px;border:1px solid var(--ln);margin-bottom:12px}

.table-wrap{overflow-x:auto;max-height:66vh;border:1.5px solid var(--ln);border-radius:12px}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;z-index:2;background:var(--sf2);color:var(--mut);font-weight:700;font-size:14px;text-align:left;padding:9px 10px;border-bottom:2px solid var(--ln);white-space:nowrap}
tbody td{padding:8px 10px;border-bottom:1px solid var(--ln);font-size:15px;vertical-align:middle}
tbody tr:nth-child(even){background:var(--sf2)}
tbody tr:hover{background:var(--soft)}

.chip{display:inline-block;background:var(--soft);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.chip-ok{display:inline-block;background:rgba(31,122,77,0.15);color:var(--ok);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.chip-warn{display:inline-block;background:rgba(179,38,30,0.14);color:var(--bad);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.chip-slot{display:inline-block;background:rgba(255,210,63,0.28);color:var(--ink);border:1px solid rgba(180,83,9,0.45);padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700}
.warn-box{background:rgba(255,210,63,0.16);border:1.5px solid rgba(180,83,9,0.4);border-radius:12px;padding:12px;margin-bottom:12px}
.hond-main{font-weight:700;font-size:16px}
.hond-sub{color:var(--mut);font-size:13px}

.toast{position:fixed;bottom:18px;right:18px;background:var(--ok);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.22);z-index:99;display:none}
@media print{
  .top,.steps-bar,.status-strip,.toolbar,.toast{display:none!important}
  .box{border:none;padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <!-- UNIFORME BOVENSTE BALK -->
  <header class="top">
    <div class="top-l">
      <img src="nnfc-logo.png" alt="NNFC" onerror="this.style.display='none'">
      <div>
        <h1>Wedstrijdtafel (<span id="lblJaar">2027</span>)</h1>
        <div class="sub">Dagverloop · Direct schakelen per fase</div>
      </div>
    </div>
    <div class="top-r" role="navigation" aria-label="Hoofdnavigatie">
      <select id="selJaar" onchange="wisselJaar()" aria-label="Selecteer wedstrijdjaar"></select>
      <a href="beheer.html" class="btn-link">Beheer / Admin</a>
      <a href="index.html" class="btn-link">Startscherm</a>
      <a href="wedstrijdtafel.html" class="btn-link active" aria-current="page">Wedstrijdtafel</a>
      <a href="banen.html" class="btn-link">Banen / Klokkers</a>
      <span class="top-sep" aria-hidden="true"></span>
      <button type="button" id="btnVervers" onclick="verversNu()">Ververs</button>
    </div>
  </header>

  <!-- 6-STAPPEN DAGVERLOOPBALK (BIJLAGE 2) -->
  <nav class="steps-bar" aria-label="Dagverloop stappen">
    <button type="button" id="stepBtn1" class="step-btn on" onclick="kiesStap(1)">
      <span class="fase">STAP 1 · OCHTEND</span>
      <span class="naam">1. Aanmelden &amp; Startnummer</span>
    </button>
    <button type="button" id="stepBtn2" class="step-btn" onclick="kiesStap(2)">
      <span class="fase">STAP 2 · OCHTEND / MIDDAG</span>
      <span class="naam">2. Basis oefeningen &amp; Tijden</span>
    </button>
    <button type="button" id="stepBtn3" class="step-btn" onclick="kiesStap(3)">
      <span class="fase">STAP 3 · MIDDAG</span>
      <span class="naam">3. Brevetten</span>
    </button>
    <button type="button" id="stepBtn4" class="step-btn" onclick="kiesStap(4)">
      <span class="fase">STAP 4 · FINALE</span>
      <span class="naam">4. Beste Reu &amp; Beste Teef</span>
    </button>
    <button type="button" id="stepBtn5" class="step-btn" onclick="kiesStap(5)">
      <span class="fase">STAP 5 · PRIJSUITREIKING</span>
      <span class="naam">5. Tijd/Punten &amp; Export/Print</span>
    </button>
    <button type="button" id="stepBtn6" class="step-btn" onclick="kiesStap(6)">
      <span class="fase">STAP 6 · TROFEEËN</span>
      <span class="naam">6. Bekers</span>
    </button>
  </nav>

  <div class="status-strip">
    <div class="status-left">
      <span id="fbStatusBadge"></span>
      <span id="slotStatusBadge"></span>
      <span class="sub">Live gesynchroniseerd met Beheer &amp; Banen</span>
    </div>
    <div class="status-right">
      <button type="button" class="sm pri" onclick="publiceerActiefJaar()">Zet <span id="lblJaarActief">2027</span> als actief jaar</button>
    </div>
  </div>

  <div id="appContent"></div>
</div>

<div id="toast" class="toast">Opgeslagen</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>
var db = null;
var KLASSEN_OPTIES = ["Jeugd", "Open", "Veteranen", "Stamboomloos", "Specials"];
var KCM_OPTIES = ["GEEN", "BOB", "CAC", "Res. CAC", "U1", "U2", "U3", "U4", "U", "ZG", "G", "M", "S"];

function esc(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function toonToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg || 'Opgeslagen';
  el.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function() { el.style.display = 'none'; }, 1800);
}

function updateFbBadge(verbonden) {
  var el = document.getElementById('fbStatusBadge');
  if (!el) return;
  el.innerHTML = verbonden
    ? '<span class="chip-ok">Live Firebase</span>'
    : '<span class="chip-warn">Geen Firebase</span>';
}

function initFirebase() {
  try {
    if (typeof firebase !== 'undefined' && typeof firebaseConfig !== 'undefined' && firebaseConfig.apiKey && firebaseConfig.apiKey !== "JOUW_API_KEY") {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      updateFbBadge(true);
      return;
    }
  } catch (e) {}
  updateFbBadge(false);
}
initFirebase();

function isGeldigJaar(y) {
  return /^20\d{2}$/.test(String(y == null ? '' : y).trim());
}

function bepaalStartJaar() {
  try {
    var params = new URLSearchParams(window.location.search || '');
    var q = params.get('jaar') || params.get('y') || params.get('year');
    if (isGeldigJaar(q)) return String(q).trim();
  } catch (e) {}
  try {
    var k1 = localStorage.getItem('nnfc_jaar');
    if (isGeldigJaar(k1)) return String(k1).trim();
    var k2 = localStorage.getItem('nnfc_actief_jaar');
    if (isGeldigJaar(k2)) return String(k2).trim();
  } catch (e) {}
  return '2027';
}

function bewaarActiefJaar(y, updateUrl) {
  if (!isGeldigJaar(y)) return;
  var s = String(y).trim();
  try {
    localStorage.setItem('nnfc_jaar', s);
    localStorage.setItem('nnfc_actief_jaar', s);
  } catch (e) {}
  if (updateUrl && window.history && window.history.replaceState) {
    try {
      var url = new URL(window.location.href);
      url.searchParams.set('jaar', s);
      window.history.replaceState(window.history.state, '', url.toString());
    } catch (e) {}
  }
}

var selJaarEl = document.getElementById('selJaar');
var standaardJaar = bepaalStartJaar();
for (var y = 2026; y <= 2040; y++) {
  var o = document.createElement('option');
  o.value = String(y);
  o.textContent = 'Jaar ' + y;
  if (String(y) === standaardJaar) o.selected = true;
  selJaarEl.appendChild(o);
}

var jaar = selJaarEl.value;
bewaarActiefJaar(jaar, false);

function zetJaarLabels(yStr) {
  document.getElementById('lblJaar').textContent = yStr;
  var actLbl = document.getElementById('lblJaarActief');
  if (actLbl) actLbl.textContent = yStr;
  document.querySelectorAll('a.btn-link').forEach(function(a) {
    var href = a.getAttribute('href') || '';
    if (href.indexOf('index.html') !== -1) return;
    var basis = href.split('?')[0];
    a.setAttribute('href', basis + '?jaar=' + encodeURIComponent(yStr));
  });
}
zetJaarLabels(jaar);

var actieveStap = 1;
var zoekTekst = '';
var baanFilter = 'ALLE';
var deelnemers = [];
var baanIndeling = {
  banen: { "1": ["Open"], "2": ["Jeugd"], "3": ["Veteranen"], "4": ["Stamboomloos"], "5": ["Specials"] },
  bijlagen: { b1: "", b2: "", b3: "" }
};
var uitslagen = {};
var bekersData = { besteReu: '', besteTeef: '', wisselbekers: '' };
var jaarSlot = { vergrendeld: false, datum: '', toelichting: '' };

function isVergrendeld() {
  return !!(jaarSlot && jaarSlot.vergrendeld);
}

function renderSlotBadge() {
  var el = document.getElementById('slotStatusBadge');
  if (!el) return;
  el.innerHTML = isVergrendeld()
    ? '<span class="chip-slot">Jaar ' + esc(jaar) + ' afgesloten</span>'
    : '<span class="chip">Jaar ' + esc(jaar) + ' open</span>';
}

function normaliseerDeelnemer(h, fallbackId) {
  if (!h || typeof h !== 'object') return null;
  var nr = parseInt(h.startnummer != null ? h.startnummer : h.nr, 10);
  return {
    id: String(h.id || fallbackId || ('h_' + Math.random().toString(36).slice(2, 7))),
    startnummer: !isNaN(nr) ? nr : null,
    roepnaam: String(h.roepnaam || h.naam || 'Onbekend'),
    stamboom: String(h.stamboom || h.roepnaam || ''),
    eigenaar: String(h.eigenaar || '—'),
    district: String(h.district || ''),
    lidnr: String(h.lidnr || '—'),
    geslacht: String(h.geslacht || 'Reu'),
    klasse: String(h.klasse || 'Open'),
    huidigBrevet: String(h.huidigBrevet || 'Geen'),
    opvolgendBrevet: String(h.opvolgendBrevet || 'Brevet A'),
    kcm: String(h.kcm || 'GEEN'),
    buitenMededinging: !!h.buitenMededinging,
    baan: String(h.baan || '1'),
    aanwezig: !!h.aanwezig,
    betaald: h.betaald !== false
  };
}

function laadLokaal() {
  try {
    var d = JSON.parse(localStorage.getItem('nnfc_deelnemers_' + jaar)) || [];
    deelnemers = d.map(function(item, i) { return normaliseerDeelnemer(item, 'loc_' + i); }).filter(Boolean);
  } catch (e) { deelnemers = []; }

  try {
    var b = JSON.parse(localStorage.getItem('nnfc_baanindeling_' + jaar));
    if (b && b.banen) {
      baanIndeling = {
        banen: Object.assign({ "1": [], "2": [], "3": [], "4": [], "5": [] }, b.banen),
        bijlagen: Object.assign({ b1: "", b2: "", b3: "" }, b.bijlagen || {})
      };
    }
  } catch (e) {}

  try {
    uitslagen = JSON.parse(localStorage.getItem('nnfc_uitslagen_' + jaar)) || {};
    if (!uitslagen || typeof uitslagen !== 'object') uitslagen = {};
  } catch (e) { uitslagen = {}; }

  try {
    var bk = JSON.parse(localStorage.getItem('nnfc_bekers_' + jaar));
    bekersData = (bk && typeof bk === 'object') ? Object.assign({ besteReu: '', besteTeef: '', wisselbekers: '' }, bk) : { besteReu: '', besteTeef: '', wisselbekers: '' };
  } catch (e) { bekersData = { besteReu: '', besteTeef: '', wisselbekers: '' }; }

  try {
    var s = JSON.parse(localStorage.getItem('nnfc_slot_' + jaar));
    if (s && typeof s.vergrendeld === 'boolean') {
      jaarSlot = { vergrendeld: s.vergrendeld, datum: s.datum || '', toelichting: s.toelichting || '' };
    } else if (String(jaar) === '2026') {
      jaarSlot = { vergrendeld: true, datum: '2026', toelichting: 'Afgesloten' };
    } else {
      jaarSlot = { vergrendeld: false, datum: '', toelichting: '' };
    }
  } catch (e) {
    jaarSlot = { vergrendeld: String(jaar) === '2026', datum: '', toelichting: '' };
  }
  renderSlotBadge();
}

function bewaarAlles(toastMsg) {
  localStorage.setItem('nnfc_deelnemers_' + jaar, JSON.stringify(deelnemers));
  localStorage.setItem('nnfc_uitslagen_' + jaar, JSON.stringify(uitslagen));
  localStorage.setItem('nnfc_bekers_' + jaar, JSON.stringify(bekersData));
  if (db) {
    try {
      var updates = {};
      var kcmMap = {};
      var baanLijsten = { baan_1: [], baan_2: [], baan_3: [], baan_4: [], baan_5: [] };
      deelnemers.forEach(function(h) {
        updates[h.id] = h;
        if (h.startnummer != null) kcmMap[String(h.startnummer)] = h.kcm || 'GEEN';
        var bKey = 'baan_' + String(h.baan || '1');
        if (baanLijsten[bKey] && h.aanwezig) {
          baanLijsten[bKey].push({
            nr: h.startnummer,
            roepnaam: h.roepnaam,
            stamboom: h.stamboom || '',
            klasse: h.klasse || '',
            geslacht: h.geslacht || '',
            opvolgendBrevet: h.opvolgendBrevet || '',
            buitenMededinging: !!h.buitenMededinging
          });
        }
      });
      db.ref('wedstrijd/beheer_deelnemers_' + jaar).set(updates);
      db.ref('wedstrijd/baan_lijsten_' + jaar).set(baanLijsten);
      db.ref('wedstrijd/kcm_selecties_' + jaar).set(kcmMap);
      db.ref('wedstrijd/uitslagen_' + jaar).set(uitslagen);
      db.ref('wedstrijd/bekers_' + jaar).set(bekersData);
    } catch (e) {}
  }
  render();
  if (toastMsg) toonToast(toastMsg);
}

var _refs = [];
function stopFirebaseListeners() {
  _refs.forEach(function(r) {
    try { r.off(); } catch (e) {}
  });
  _refs = [];
}

function startFirebaseListeners() {
  stopFirebaseListeners();
  if (!db || !jaar) return;

  try {
    var rDeeln = db.ref('wedstrijd/beheer_deelnemers_' + jaar);
    rDeeln.on('value', function(snap) {
      updateFbBadge(true);
      var val = snap.val();
      if (!val) return;
      var lijst = Array.isArray(val)
        ? val.map(function(x, i) { return normaliseerDeelnemer(x, 'fb_' + i); })
        : Object.keys(val).map(function(k) { return normaliseerDeelnemer(val[k], k); });
      var schoon = lijst.filter(Boolean);
      if (JSON.stringify(schoon) !== JSON.stringify(deelnemers)) {
        deelnemers = schoon;
        localStorage.setItem('nnfc_deelnemers_' + jaar, JSON.stringify(deelnemers));
        render();
      }
    });
    _refs.push(rDeeln);

    var rBanen = db.ref('wedstrijd/baanindeling_' + jaar);
    rBanen.on('value', function(snap) {
      updateFbBadge(true);
      var b = snap.val();
      if (b && b.banen) {
        var nieuwB = {
          banen: Object.assign({ "1": [], "2": [], "3": [], "4": [], "5": [] }, b.banen),
          bijlagen: Object.assign({ b1: "", b2: "", b3: "" }, b.bijlagen || {})
        };
        if (JSON.stringify(nieuwB) !== JSON.stringify(baanIndeling)) {
          baanIndeling = nieuwB;
          localStorage.setItem('nnfc_baanindeling_' + jaar, JSON.stringify(baanIndeling));
          render();
        }
      }
    });
    _refs.push(rBanen);

    var rUitslagen = db.ref('wedstrijd/uitslagen_' + jaar);
    rUitslagen.on('value', function(snap) {
      updateFbBadge(true);
      var u = snap.val();
      if (u && typeof u === 'object') {
        if (JSON.stringify(u) !== JSON.stringify(uitslagen)) {
          uitslagen = u;
          localStorage.setItem('nnfc_uitslagen_' + jaar, JSON.stringify(uitslagen));
          render();
        }
      }
    });
    _refs.push(rUitslagen);

    var rBekers = db.ref('wedstrijd/bekers_' + jaar);
    rBekers.on('value', function(snap) {
      updateFbBadge(true);
      var bk = snap.val();
      if (bk && typeof bk === 'object') {
        var nieuwBk = Object.assign({ besteReu: '', besteTeef: '', wisselbekers: '' }, bk);
        if (JSON.stringify(nieuwBk) !== JSON.stringify(bekersData)) {
          bekersData = nieuwBk;
          localStorage.setItem('nnfc_bekers_' + jaar, JSON.stringify(bekersData));
          render();
        }
      }
    });
    _refs.push(rBekers);

    var rSlot = db.ref('wedstrijd/slot_' + jaar);
    rSlot.on('value', function(snap) {
      updateFbBadge(true);
      var s = snap.val();
      if (s && typeof s.vergrendeld === 'boolean') {
        var nieuwSlot = { vergrendeld: s.vergrendeld, datum: s.datum || '', toelichting: s.toelichting || '' };
        if (JSON.stringify(nieuwSlot) !== JSON.stringify(jaarSlot)) {
          jaarSlot = nieuwSlot;
          localStorage.setItem('nnfc_slot_' + jaar, JSON.stringify(jaarSlot));
          renderSlotBadge();
          render();
        }
      }
    });
    _refs.push(rSlot);
  } catch (e) {
    updateFbBadge(false);
  }
}

function wisselJaar() {
  jaar = selJaarEl.value;
  bewaarActiefJaar(jaar, true);
  zetJaarLabels(jaar);
  laadLokaal();
  startFirebaseListeners();
  render();
}

function verversNu() {
  laadLokaal();
  startFirebaseListeners();
  render();
  toonToast('Jaar ' + jaar + ' ververst');
}

function publiceerActiefJaar() {
  bewaarActiefJaar(jaar, true);
  if (db) {
    try { db.ref('wedstrijd/actief_jaar').set(jaar); } catch (e) {}
  }
  toonToast('Actief jaar ingesteld op ' + jaar);
}

function kiesStap(nr) {
  actieveStap = nr;
  for (var i = 1; i <= 6; i++) {
    document.getElementById('stepBtn' + i).classList.toggle('on', actieveStap === i);
  }
  render();
}

function toggleAanwezig(id) {
  if (isVergrendeld()) return;
  var h = deelnemers.find(function(x) { return x.id === id; });
  if (!h) return;
  h.aanwezig = !h.aanwezig;
  bewaarAlles(h.roepnaam + (h.aanwezig ? ' aangemeld' : ' afgemeld'));
}

function wijzigStartnr(id, waarde) {
  if (isVergrendeld()) return;
  var h = deelnemers.find(function(x) { return x.id === id; });
  if (!h) return;
  var nr = parseInt(waarde, 10);
  h.startnummer = (!isNaN(nr) && nr > 0) ? nr : null;
  bewaarAlles('Startnummer bijgewerkt');
}

function wijzigKcm(id, waarde) {
  if (isVergrendeld()) return;
  var h = deelnemers.find(function(x) { return x.id === id; });
  if (!h) return;
  h.kcm = waarde;
  bewaarAlles('KCM bijgewerkt');
}

function wijzigUitslag(id, veld, waarde) {
  if (isVergrendeld()) return;
  if (!uitslagen[id] || typeof uitslagen[id] !== 'object') {
    uitslagen[id] = { tijd: '', punten: '', plaatsing: '', opmerking: '', geslaagd: false };
  }
  if (veld === 'geslaagd') {
    uitslagen[id].geslaagd = !!waarde;
  } else {
    uitslagen[id][veld] = waarde;
  }
  bewaarAlles('Opgeslagen');
}

function wijzigBeker(veld, waarde) {
  if (isVergrendeld()) return;
  bekersData[veld] = waarde;
  bewaarAlles('Trofee-gegevens opgeslagen');
}

function matchFilter(h) {
  if (baanFilter !== 'ALLE' && String(h.baan) !== baanFilter) return false;
  if (!zoekTekst) return true;
  var woorden = zoekTekst.toLowerCase().trim().split(/\s+/);
  var hay = [h.startnummer, '#' + h.startnummer, h.roepnaam, h.stamboom, h.eigenaar, h.klasse, h.geslacht, 'baan ' + h.baan].join(' ').toLowerCase();
  return woorden.every(function(w) { return hay.indexOf(w) !== -1; });
}

function gesorteerdeLijst() {
  return deelnemers
    .filter(matchFilter)
    .sort(function(a, b) { return (a.startnummer || 999999) - (b.startnummer || 999999); });
}

function zoekFilterBalk() {
  return '<div class="toolbar">' +
    '<div class="search-wrap">' +
      '<input type="search" value="' + esc(zoekTekst) + '" oninput="zoekTekst=this.value;render()" placeholder="Zoek op startnr, hond, eigenaar, klasse of geslacht...">' +
      '<button type="button" class="sm" onclick="zoekTekst=\'\';render()">Wis</button>' +
    '</div>' +
    '<select style="width:auto;margin:0;min-height:36px" onchange="baanFilter=this.value;render()">' +
      '<option value="ALLE" ' + (baanFilter === 'ALLE' ? 'selected' : '') + '>Alle banen</option>' +
      ['1','2','3','4','5'].map(function(b) { return '<option value="' + b + '" ' + (baanFilter === b ? 'selected' : '') + '>Baan ' + b + '</option>'; }).join('') +
    '</select>' +
  '</div>';
}

/* STAP 1: Aanmelden & Startnummer */
function renderStap1() {
  var lijst = gesorteerdeLijst();
  var aanwezigCnt = deelnemers.filter(function(h) { return h.aanwezig; }).length;
  var rows = lijst.map(function(h) {
    return '<tr>' +
      '<td><input type="number" min="1" value="' + esc(h.startnummer != null ? h.startnummer : '') + '" style="width:82px;margin:0;min-height:34px;font-weight:700" onchange="wijzigStartnr(\'' + esc(h.id) + '\',this.value)"></td>' +
      '<td><div class="hond-main">' + esc(h.roepnaam) + (h.buitenMededinging ? ' <span class="chip">*</span>' : '') + '</div><div class="hond-sub">' + esc(h.stamboom) + '</div></td>' +
      '<td><div>' + esc(h.eigenaar) + '</div><div class="hond-sub">' + esc(h.district || '—') + '</div></td>' +
      '<td><span class="chip">' + esc(h.klasse) + '</span></td>' +
      '<td>Baan ' + esc(h.baan) + '</td>' +
      '<td>' + (h.aanwezig ? '<span class="chip-ok">Aanwezig</span>' : '<span class="chip-warn">Niet gemeld</span>') + '</td>' +
      '<td><button type="button" class="sm ' + (h.aanwezig ? '' : 'ok') + '" onclick="toggleAanwezig(\'' + esc(h.id) + '\')">' + (h.aanwezig ? 'Afmelden' : 'Aanmelden') + '</button></td>' +
    '</tr>';
  }).join('');

  return '<div class="box">' +
    '<div class="box-head"><div><h2>1. Aanmelden &amp; Startnummer (' + esc(jaar) + ')</h2><div class="sub">Controleer startnummers en meld honden aan op de wedstrijddag</div></div></div>' +
    '<div class="stats-pill"><span>Totaal: <b>' + deelnemers.length + '</b></span><span>Aanwezig: <b style="color:var(--ok)">' + aanwezigCnt + '</b></span><span>Getoond: <b>' + lijst.length + '</b></span></div>' +
    zoekFilterBalk() +
    '<div class="table-wrap"><table><thead><tr><th>Startnr</th><th>Hond</th><th>Eigenaar</th><th>Klasse</th><th>Baan</th><th>Status</th><th>Actie</th></tr></thead><tbody>' +
    (rows || '<tr><td colspan="7" class="sub" style="padding:14px">Geen deelnemers gevonden voor ' + esc(jaar) + '.</td></tr>') +
    '</tbody></table></div></div>';
}

/* STAP 2: Basis oefeningen & Tijden */
function renderStap2() {
  var lijst = gesorteerdeLijst();
  var rows = lijst.map(function(h) {
    var u = uitslagen[h.id] || {};
    return '<tr>' +
      '<td><span class="chip">' + (h.startnummer != null ? ('#' + esc(h.startnummer)) : '—') + '</span></td>' +
      '<td><div class="hond-main">' + esc(h.roepnaam) + '</div><div class="hond-sub">' + esc(h.klasse) + ' · Baan ' + esc(h.baan) + '</div></td>' +
      '<td><input type="text" value="' + esc(u.tijd || '') + '" placeholder="Bijv. 01:24.5" style="width:115px;margin:0;min-height:34px" onchange="wijzigUitslag(\'' + esc(h.id) + '\',\'tijd\',this.value)"></td>' +
      '<td><input type="text" value="' + esc(u.punten || '') + '" placeholder="Punten..." style="width:105px;margin:0;min-height:34px" onchange="wijzigUitslag(\'' + esc(h.id) + '\',\'punten\',this.value)"></td>' +
      '<td><input type="text" value="' + esc(u.opmerking || '') + '" placeholder="Basis oefeningen / opmerking..." style="min-width:170px;margin:0;min-height:34px" onchange="wijzigUitslag(\'' + esc(h.id) + '\',\'opmerking\',this.value)"></td>' +
    '</tr>';
  }).join('');

  return '<div class="box">' +
    '<div class="box-head"><div><h2>2. Basis oefeningen &amp; Tijden (' + esc(jaar) + ')</h2><div class="sub">Noteer tijden, punten en opmerkingen over de basisoefeningen</div></div></div>' +
    zoekFilterBalk() +
    '<div class="table-wrap"><table><thead><tr><th>Startnr</th><th>Hond</th><th>Tijd</th><th>Punten</th><th>Opmerking</th></tr></thead><tbody>' +
    (rows || '<tr><td colspan="5" class="sub" style="padding:14px">Geen deelnemers gevonden.</td></tr>') +
    '</tbody></table></div></div>';
}

/* STAP 3: Brevetten */
function renderStap3() {
  var lijst = gesorteerdeLijst();
  var rows = lijst.map(function(h) {
    var u = uitslagen[h.id] || {};
    return '<tr>' +
      '<td><span class="chip">' + (h.startnummer != null ? ('#' + esc(h.startnummer)) : '—') + '</span></td>' +
      '<td><div class="hond-main">' + esc(h.roepnaam) + '</div><div class="hond-sub">' + esc(h.klasse) + ' · ' + esc(h.eigenaar) + '</div></td>' +
      '<td>' + esc(h.huidigBrevet) + '</td>' +
      '<td><b>' + esc(h.opvolgendBrevet) + '</b></td>' +
      '<td><label style="display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer"><input type="checkbox" ' + (u.geslaagd ? 'checked' : '') + ' style="width:auto;min-height:auto;margin:0" onchange="wijzigUitslag(\'' + esc(h.id) + '\',\'geslaagd\',this.checked)"> Geslaagd</label></td>' +
    '</tr>';
  }).join('');

  return '<div class="box">' +
    '<div class="box-head"><div><h2>3. Brevetten (' + esc(jaar) + ')</h2><div class="sub">Overzicht opvolgende brevetten en geslaagde combinaties</div></div></div>' +
    zoekFilterBalk() +
    '<div class="table-wrap"><table><thead><tr><th>Startnr</th><th>Hond</th><th>Huidig</th><th>Opvolgend brevet</th><th>Resultaat</th></tr></thead><tbody>' +
    (rows || '<tr><td colspan="5" class="sub" style="padding:14px">Geen deelnemers gevonden.</td></tr>') +
    '</tbody></table></div></div>';
}

/* STAP 4: Beste Reu & Beste Teef */
function renderStap4() {
  var lijst = gesorteerdeLijst();
  var rows = lijst.map(function(h) {
    return '<tr>' +
      '<td><span class="chip">' + (h.startnummer != null ? ('#' + esc(h.startnummer)) : '—') + '</span></td>' +
      '<td><div class="hond-main">' + esc(h.roepnaam) + '</div><div class="hond-sub">' + esc(h.eigenaar) + '</div></td>' +
      '<td>' + esc(h.geslacht) + '</td>' +
      '<td><span class="chip">' + esc(h.klasse) + '</span></td>' +
      '<td><select style="width:auto;margin:0;min-height:34px" onchange="wijzigKcm(\'' + esc(h.id) + '\',this.value)">' +
        KCM_OPTIES.map(function(k) { return '<option value="' + esc(k) + '" ' + (h.kcm === k ? 'selected' : '') + '>' + esc(k) + '</option>'; }).join('') +
      '</select></td>' +
    '</tr>';
  }).join('');

  return '<div class="box">' +
    '<div class="box-head"><div><h2>4. Beste Reu &amp; Beste Teef (' + esc(jaar) + ')</h2><div class="sub">KCM-kwalificaties en kandidaten voor Beste Reu en Beste Teef</div></div></div>' +
    zoekFilterBalk() +
    '<div class="table-wrap"><table><thead><tr><th>Startnr</th><th>Hond</th><th>Geslacht</th><th>Klasse</th><th>KCM</th></tr></thead><tbody>' +
    (rows || '<tr><td colspan="5" class="sub" style="padding:14px">Geen deelnemers gevonden.</td></tr>') +
    '</tbody></table></div></div>';
}

/* STAP 5: Tijd/Punten & Export/Print */
function renderStap5() {
  var lijst = gesorteerdeLijst();
  var rows = lijst.map(function(h) {
    var u = uitslagen[h.id] || {};
    return '<tr>' +
      '<td>#' + esc(h.startnummer != null ? h.startnummer : '—') + '</td>' +
      '<td><b>' + esc(h.roepnaam) + '</b> (' + esc(h.eigenaar) + ')</td>' +
      '<td>' + esc(h.klasse) + '</td>' +
      '<td>' + esc(h.opvolgendBrevet) + '</td>' +
      '<td>' + esc(u.tijd || '—') + '</td>' +
      '<td>' + esc(u.punten || '—') + '</td>' +
      '<td>' + (u.geslaagd ? 'Geslaagd' : '—') + '</td>' +
    '</tr>';
  }).join('');

  return '<div class="box">' +
    '<div class="box-head">' +
      '<div><h2>5. Tijd/Punten &amp; Export/Print (' + esc(jaar) + ')</h2><div class="sub">Overzicht gereed voor printen of delen</div></div>' +
      '<button type="button" class="pri sm" onclick="window.print()">Print overzicht</button>' +
    '</div>' +
    '<div class="table-wrap"><table><thead><tr><th>Startnr</th><th>Hond &amp; Eigenaar</th><th>Klasse</th><th>Brevet</th><th>Tijd</th><th>Punten</th><th>Status</th></tr></thead><tbody>' +
    (rows || '<tr><td colspan="7" class="sub" style="padding:14px">Geen gegevens om af te drukken.</td></tr>') +
    '</tbody></table></div></div>';
}

/* STAP 6: Bekers */
function renderStap6() {
  return '<div class="box">' +
    '<div class="box-head"><div><h2>6. Bekers (' + esc(jaar) + ')</h2><div class="sub">Vastleggen van ereprijzen, Beste Reu, Beste Teef en wisselbekers</div></div></div>' +
    '<div class="grid2">' +
      '<div class="kaart">' +
        '<label for="bekerReu">Beste Reu</label>' +
        '<input id="bekerReu" type="text" value="' + esc(bekersData.besteReu || '') + '" placeholder="Bijv. #17 Bram – Jan de Vries" onchange="wijzigBeker(\'besteReu\',this.value)">' +
        '<label for="bekerTeef">Beste Teef</label>' +
        '<input id="bekerTeef" type="text" value="' + esc(bekersData.besteTeef || '') + '" placeholder="Bijv. #4 Luna – Sanne Bakker" onchange="wijzigBeker(\'besteTeef\',this.value)">' +
      '</div>' +
      '<div class="kaart">' +
        '<label for="bekerWissel">Wisselbekers / Bijzondere trofeeën</label>' +
        '<input id="bekerWissel" type="text" value="' + esc(bekersData.wisselbekers || '') + '" placeholder="Noteer wisselbekers en winnaars..." onchange="wijzigBeker(\'wisselbekers\',this.value)">' +
      '</div>' +
    '</div></div>';
}

function render() {
  renderSlotBadge();
  var banner = isVergrendeld()
    ? '<div class="warn-box"><b>Wedstrijdjaar ' + esc(jaar) + ' is afgesloten en vergrendeld (alleen-lezen).</b> Wijzigingen zijn geblokkeerd.</div>'
    : '';
  var bodyHtml = '';
  if (actieveStap === 1) bodyHtml = renderStap1();
  else if (actieveStap === 2) bodyHtml = renderStap2();
  else if (actieveStap === 3) bodyHtml = renderStap3();
  else if (actieveStap === 4) bodyHtml = renderStap4();
  else if (actieveStap === 5) bodyHtml = renderStap5();
  else if (actieveStap === 6) bodyHtml = renderStap6();

  document.getElementById('appContent').innerHTML = banner + bodyHtml;

  if (isVergrendeld()) {
    document.getElementById('appContent').querySelectorAll('input,select,button').forEach(function(el) {
      el.disabled = true;
    });
  }
}

laadLokaal();
startFirebaseListeners();
render();
</script>
</body>
