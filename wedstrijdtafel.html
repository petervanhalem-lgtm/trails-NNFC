<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedstrijdtafel NNFC</title>
<style>
:root{--bg:#EEF3F5;--sf:#FFFFFF;--ink:#0E2A3A;--mut:#4D6573;--ac:#0B6E8F;--acink:#FFFFFF;--cur:#FFD23F;--curink:#1B1500;--bad:#B3261E;--ok:#1F7A4D;--ln:#C3D3DB;--soft:#DDE8ED;--warn:#B45309}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1A22;--sf:#14293A;--ink:#E8F1F5;--mut:#9DB4C1;--ac:#4CC3E6;--acink:#06222E;--cur:#FFD23F;--curink:#1B1500;--bad:#FF8A80;--ok:#6FD6A0;--ln:#2C4558;--soft:#1D3547;--warn:#FBBF6A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow Semi Condensed',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;line-height:1.3}
#app{max-width:980px;margin:0 auto;padding:12px 14px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.top-l{display:flex;align-items:center;gap:12px}
.top img{width:52px;height:52px;border-radius:50%;flex:none}
h1{font-size:26px;margin:0;font-weight:700;line-height:1.1}
h2{font-size:19px;margin:16px 0 8px}
.sub,.m{color:var(--mut);font-size:15px}
button,.btn-link{font:inherit;color:inherit;border:2px solid var(--ln);background:var(--sf);border-radius:12px;min-height:48px;padding:6px 14px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.nav button.on{background:var(--ac);border-color:var(--ac);color:var(--acink)}
.nav button.extra{background:var(--ok);border-color:var(--ok);color:#FFFFFF}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.c{display:block;width:100%;text-align:left;background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:12px 14px;font-size:17px;font-weight:500}
.c b{font-weight:700;font-size:21px}
.c.w{border-color:var(--warn)}
.bar{height:8px;border-radius:5px;background:var(--soft);margin:8px 0}
.bar i{display:block;height:8px;border-radius:5px;background:var(--ac)}
.chip{display:inline-block;background:var(--cur);color:var(--curink);border-radius:8px;padding:1px 8px;font-weight:700}
.chip-ok{display:inline-block;background:var(--ok);color:#fff;border-radius:8px;padding:1px 8px;font-size:14px;font-weight:700}
.chip-bad{display:inline-block;background:var(--bad);color:#fff;border-radius:8px;padding:1px 8px;font-size:14px;font-weight:700}
.warn{color:var(--warn);font-weight:700}
.banner{background:var(--cur);color:var(--curink);border-color:var(--cur);margin-bottom:12px;font-size:20px;font-weight:700}
.t{display:grid;grid-template-columns:44px 1fr auto;gap:10px;padding:10px 4px;border-top:1px solid var(--ln);align-items:center;font-size:20px}
.t b{font-size:23px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row button{min-height:58px;font-size:19px}
.pri{background:var(--ac)!important;border-color:var(--ac)!important;color:var(--acink)!important}
.box{background:var(--sf);border:3px solid var(--warn);border-radius:16px;padding:14px;margin-bottom:12px}
.box.n{border-color:var(--ln);border-width:2px}
.big{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.log{padding-left:20px;margin:0;color:var(--mut);font-size:16px}
.foot{margin-top:18px;font-size:14px;color:var(--mut)}
input,select{font:inherit;color:var(--ink);background:var(--sf);border:2px solid var(--ln);border-radius:12px;padding:10px 12px;width:100%;margin-bottom:10px;min-height:46px}
label{display:block;font-weight:600;font-size:16px;margin-bottom:4px;color:var(--mut)}
.chk{width:28px;height:28px;accent-color:var(--ok);cursor:pointer;margin:0}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
var LOGO = 'assets/nnfc-logo.png', db = null;
var KCM_PUNTEN = {"GEEN":0,"BOB":75,"CAC":70,"Res. CAC":65,"U1":55,"U2":50,"U3":45,"U4":40,"U":35,"ZG":25,"G":15,"M":10,"S":5};
var WEIGERING_MS = 600000, registraties = {}, meldingen = {}, logboek = {}, banenStatus = {}, deelnemersLijst = [], kcmSelecties = {}, v = 'home';

try {
  deelnemersLijst = JSON.parse(localStorage.getItem('nnfc_deelnemers_2027')) || [];
  kcmSelecties = JSON.parse(localStorage.getItem('nnfc_kcm_2026')) || {};
} catch (e) {}

function esc(str) {
  return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function safeDraw() {
  if (v === 'extra' || v === 'nood') return;
  draw();
}

function initFirebase() {
  try {
    if (typeof firebase !== 'undefined' && typeof firebaseConfig !== 'undefined' && firebaseConfig.apiKey && firebaseConfig.apiKey !== "JOUW_API_KEY") {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      db.ref('wedstrijd/registraties').on('value', function(s) { registraties = s.val() || {}; detectConflicts(); safeDraw(); });
      db.ref('wedstrijd/meldingen').on('value', function(s) { meldingen = s.val() || {}; safeDraw(); });
      db.ref('wedstrijd/logboek').on('value', function(s) { logboek = s.val() || {}; if (v === 'hist') draw(); });
      db.ref('wedstrijd/banen_status').on('value', function(s) { banenStatus = s.val() || {}; safeDraw(); });
      db.ref('wedstrijd/beheer_deelnemers').on('value', function(s) {
        var val = s.val();
        if (val) { deelnemersLijst = Array.isArray(val) ? val : Object.values(val); safeDraw(); }
      });
    }
  } catch (e) {}
}

function go(x) { v = x; draw(); window.scrollTo(0, 0); }
function formatSec(ms, bm) { var s = (ms / 1000).toFixed(2).replace('.', ','); return bm ? s + '*' : s; }

function getGroepen() {
  var map = {};
  Object.values(registraties).forEach(function(r) {
    if (!r || r.status === 'AFGEWEZEN' || (r.oefening !== 'A' && r.oefening !== 'B' && r.oefening !== 'C')) return;
    if (!map[r.startnummer]) {
      var meta = deelnemersLijst.find(function(d) { return d.startnummer == r.startnummer; }) || {};
      map[r.startnummer] = { nr: r.startnummer, naam: r.roepnaam, klasse: r.klasse, geslacht: r.geslacht, bm: Boolean(meta.buitenMededinging || r.buitenMededinging), oef: {} };
    }
    var ms = r.type === 'WEIGERING' ? WEIGERING_MS : (r.tijdMs || 0);
    map[r.startnummer].oef[r.oefening] = { ms: ms, txt: r.type === 'WEIGERING' ? '600,00 (W)' : r.tijdTekst };
  });

  var gr = [
    { titel: 'Open reuen', lijst: [] }, { titel: 'Open teven', lijst: [] },
    { titel: 'Jeugd', lijst: [] }, { titel: 'Veteranen', lijst: [] },
    { titel: 'Stamboomloos', lijst: [] }, { titel: 'Special', lijst: [] }
  ];

  Object.values(map).forEach(function(h) {
    h.totaalMs = (h.oef.A ? h.oef.A.ms : 0) + (h.oef.B ? h.oef.B.ms : 0) + (h.oef.C ? h.oef.C.ms : 0);
    h.gedaan = Object.keys(h.oef).length;
    if (h.klasse === 'Open' && h.geslacht === 'Reu') gr.slice(0, 1).pop().lijst.push(h);
    else if (h.klasse === 'Open' && h.geslacht === 'Teef') gr.slice(1, 2).pop().lijst.push(h);
    else if (h.klasse === 'Jeugd') gr.slice(2, 3).pop().lijst.push(h);
    else if (h.klasse === 'Veteranen' || h.klasse === 'Senioren') gr.slice(3, 4).pop().lijst.push(h);
    else if (h.klasse === 'Stamboomloos') gr.slice(4, 5).pop().lijst.push(h);
    else if (h.klasse === 'Specials') gr.slice(5, 6).pop().lijst.push(h);
  });

  gr.forEach(function(g) {
    g.lijst.sort(function(x, y) {
      if (x.bm !== y.bm) return x.bm ? 1 : -1;
      return (y.gedaan - x.gedaan) || (x.totaalMs - y.totaalMs);
    });
    var reg = 0;
    g.lijst.forEach(function(h, idx) {
      h.rang = idx + 1;
      if (!h.bm) { h.pnt = Math.max(0, 250 - (reg * 5)); reg++; } else { h.pnt = 0; }
    });
  });
  return gr;
}

function openMeldingen() { return Object.values(meldingen).filter(function(m) { return m && m.status === 'OPEN'; }); }

function detectConflicts() {
  if (!db) return;
  var seen = {};
  Object.values(registraties).forEach(function(r) {
    if (!r || r.status === 'AFGEWEZEN') return;
    var key = r.startnummer + '_' + r.oefening;
    if (seen[key] && seen[key].id !== r.id) {
      var cid = 'CONF_' + r.id;
      if (!meldingen[cid]) {
        db.ref('wedstrijd/meldingen/' + cid).set({
          id: cid, soort: 'CONFLICT', status: 'OPEN', baan: r.baan, oefening: r.oefening,
          startnummer: r.startnummer, roepnaam: r.roepnaam,
          oudeRegId: seen[key].id, oudeTijd: seen[key].tijdTekst,
          nieuweRegId: r.id, nieuweTijd: r.tijdTekst, nieuweTijdMs: r.tijdMs,
          reden: 'Dubbele registratie voor dezelfde hond/oefening', timestamp: new Date().toISOString()
        });
      }
    } else {
      seen[key] = r;
    }
  });
}

async function beslis(id, akkoord) {
  var m = meldingen[id]; if (!m) return;
  if (db) {
    if (akkoord) {
      if (m.oudeRegId && registraties[m.oudeRegId]) {
        await db.ref('wedstrijd/registraties/' + m.oudeRegId).update({ status: 'AFGEWEZEN' });
      }
      if (m.nieuweRegId && registraties[m.nieuweRegId]) {
        await db.ref('wedstrijd/registraties/' + m.nieuweRegId).update({ status: 'GEACCEPTEERD' });
      } else {
        var k = Object.keys(registraties).find(function(key) { return registraties[key].startnummer == m.startnummer && registraties[key].oefening == m.oefening && registraties[key].status !== 'AFGEWEZEN'; });
        if (k) await db.ref('wedstrijd/registraties/' + k).update({ tijdTekst: m.nieuweTijd, tijdMs: m.nieuweTijdMs, type: 'TIJD' });
      }
    } else if (m.nieuweRegId && registraties[m.nieuweRegId]) {
      await db.ref('wedstrijd/registraties/' + m.nieuweRegId).update({ status: 'AFGEWEZEN' });
    }
    await db.ref('wedstrijd/meldingen/' + id).update({ status: akkoord ? 'GEACCEPTEERD' : 'AFGEWEZEN' });
    await db.ref('wedstrijd/logboek/BESL_' + Date.now()).set({ baan: m.baan, actie: 'Tafel ' + (akkoord ? 'accepteert' : 'wijst af') + ' wijziging #' + m.startnummer, timestamp: new Date().toISOString() });
  } else {
    if (!akkoord && m.nieuweRegId && registraties[m.nieuweRegId]) registraties[m.nieuweRegId].status = 'AFGEWEZEN';
    meldingen[id].status = akkoord ? 'GEACCEPTEERD' : 'AFGEWEZEN';
    draw();
  }
}

async function leesBericht(id) { if (db) await db.ref('wedstrijd/meldingen/' + id).update({ status: 'GELEZEN' }); else if (meldingen[id]) { meldingen[id].status = 'GELEZEN'; draw(); } }

async function toggleAanwezig(nr) {
  var idx = deelnemersLijst.findIndex(function(x) { return x.startnummer == nr; });
  if (idx === -1) return;
  var d = deelnemersLijst[idx];
  d.aanwezig = !d.aanwezig;
  localStorage.setItem('nnfc_deelnemers_2027', JSON.stringify(deelnemersLijst));
  draw();
  if (db) {
    await db.ref('wedstrijd/beheer_deelnemers').set(deelnemersLijst);
    await stuurBaan(d.baan);
  }
}


async function stuurBaan(baanNr) {
  if (!db) return;
  var lijst = deelnemersLijst.filter(function(x) { return x.baan == baanNr && x.aanwezig; }).map(function(h) {
    return { nr: h.startnummer, roepnaam: h.roepnaam, klasse: h.klasse, geslacht: h.geslacht, opvolgendBrevet: h.opvolgendBrevet, buitenMededinging: Boolean(h.buitenMededinging) };
  });
  await db.ref('wedstrijd/baan_lijsten/baan_' + baanNr).set(lijst);
}

async function syncAlleBanen() { if (!db) { alert('Firebase is nog niet gekoppeld in config.js.'); return; } for (var b = 1; b <= 5; b++) await stuurBaan(b); alert('Alle aanwezige honden zijn doorgestuurd naar Baan 1 t/m 5.'); }

async function slaExtraOp() {
  var roep = document.getElementById('exRoep').value.trim(), stam = document.getElementById('exStam').value.trim();
  if (!roep && !stam) { alert('Vul minimaal een roepnaam of stamboomnaam in.'); return; }
  var nr = parseInt(document.getElementById('exNr').value, 10) || (deelnemersLijst.length + 101), baan = document.getElementById('exBaan').value;
  if (deelnemersLijst.some(function(x) { return x.startnummer == nr; })) { alert('Startnummer ' + nr + ' bestaat al.'); return; }
  var nieuw = { id: 'EXTRA_' + Date.now(), startnummer: nr, baan: baan, roepnaam: roep || stam, stamboom: stam || roep, eigenaar: document.getElementById('exEig').value.trim() || 'Daginschrijving', geslacht: document.getElementById('exGesl').value, klasse: document.getElementById('exKlas').value, opvolgendBrevet: document.getElementById('exBrev').value, betaald: document.getElementById('exBet').checked, buitenMededinging: document.getElementById('exBm').checked, aanwezig: true };
  deelnemersLijst.push(nieuw); localStorage.setItem('nnfc_deelnemers_2027', JSON.stringify(deelnemersLijst));
  if (db) { await db.ref('wedstrijd/beheer_deelnemers').set(deelnemersLijst); await stuurBaan(baan); }
  go('aanm');
}

async function slaNoodOp() {
  var nr = document.getElementById('ndHond').value, d = deelnemersLijst.find(function(x) { return x.startnummer == nr; });
  if (!d) { alert('Kies eerst een deelnemer.'); return; }
  var oef = document.getElementById('ndOef').value, type = document.getElementById('ndType').value, txt = type === 'WEIGERING' ? 'WEIGERING' : 'UITGEVOERD', ms = null;
  if (type === 'TIJD') {
    var raw = document.getElementById('ndCijf').value.replace(/\D/g, ''); if (!raw) { alert('Voer cijfers in.'); return; }
    var pad = raw.padStart(3, '0'), h = parseInt(pad.slice(-2), 10), s = parseInt(pad.slice(-4, -2) || '0', 10), m = parseInt(pad.slice(0, -4) || '0', 10);
    if (s > 59) { alert('Seconden moeten onder 60 liggen.'); return; }
    ms = (m * 60000) + (s * 1000) + (h * 10);
    if (ms === 0) { alert('Tijd van 0,00 is niet toegestaan.'); return; }
    txt = m > 0 ? (m + ':' + String(s).padStart(2, '0') + ',' + String(h).padStart(2, '0')) : (s + ',' + String(h).padStart(2, '0'));
  }
  var rid = 'TAFEL_' + d.baan + '_' + oef + '_' + d.startnummer + '_' + Date.now();
  var payload = { id: rid, baan: d.baan, klasse: d.klasse, oefening: oef, startnummer: d.startnummer, roepnaam: d.roepnaam, geslacht: d.geslacht, buitenMededinging: Boolean(d.buitenMededinging), type: type, tijdTekst: txt, tijdMs: ms, timestamp: new Date().toISOString() };
  if (db) await db.ref('wedstrijd/registraties/' + rid).set(payload); else registraties[rid] = payload;
  go('home');
}

function setKcm(nr, val) { kcmSelecties[nr] = val; localStorage.setItem('nnfc_kcm_2026', JSON.stringify(kcmSelecties)); draw(); }
function back() { return '<button onclick="go(\'home\')" style="margin-bottom:8px"><span aria-hidden="true">←</span> Overzicht</button>'; }
function exporteerUitslagCsv() {
  var regels = ['Klasse;Plaats;Startnummer;Roepnaam;Oefening A;Oefening B;Oefening C;Totaal Seconden;Bekerpunten;Buiten Mededinging'];
  getGroepen().forEach(function(g) {
    g.lijst.forEach(function(d, j) {
      regels.push([
        g.titel, j + 1, d.nr, d.naam,
        d.oef.A ? d.oef.A.txt : '-', d.oef.B ? d.oef.B.txt : '-', d.oef.C ? d.oef.C.txt : '-',
        formatSec(d.totaalMs, false), d.bm ? 0 : d.pnt, d.bm ? 'Ja' : 'Nee'
      ].join(';'));
    });
  });
  var blob = new Blob(['\uFEFF' + regels.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nnfc_officiele_uitslag.csv';
  a.click();
}

function draw() {
  var nuTijd = new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
  var openM = openMeldingen();
  var openCorr = openM.filter(function(m) { return m.soort !== 'BERICHT'; });

  var h = '<div class="top"><div class="top-l"><img src="' + LOGO + '" alt="NNFC" onerror="this.style.display=\'none\'"><div><h1>Wedstrijdtafel</h1><div class="sub">NNFC Trials, ' + nuTijd + (db ? ' • Live' : ' • Lokaal') + '</div></div></div><a href="index.html" class="btn-link">← Menu</a></div>';

  var nv = function(k, t, extraClass) {
    return '<button class="' + (v === k ? 'on ' : '') + (extraClass || '') + '" onclick="go(\'' + k + '\')">' + t + '</button>';
  };

  h += '<div class="nav">' +
    nv('home', 'Overzicht') +
    nv('aanm', 'Aanmelding (' + deelnemersLijst.filter(function(d) { return d.aanwezig; }).length + '/' + deelnemersLijst.length + ')') +
    nv('extra', '+ Extra deelnemer', 'extra') +
    nv('nood', 'Handmatige tijd') +
    nv('meld', 'Meldingen' + (openM.length ? ' (' + openM.length + ')' : '')) +
    nv('beker', 'Bekers & KCM') +
    nv('hist', 'Wijzigingen') +
    '</div>';

  if (v === 'home') {
    if (openM.length) {
      h += '<button class="c banner" onclick="go(\'meld\')">' + openM.length + (openM.length === 1 ? ' melding wacht' : ' meldingen wachten') + ' op de tafel</button>';
    }

    h += '<h2>Banen</h2><div class="g">';
    for (var i = 1; i <= 5; i++) {
      var baanDeeln = deelnemersLijst.filter(function(d) { return d.baan == i && d.aanwezig; });
      var klassen = Array.from(new Set(baanDeeln.map(function(d) { return d.klasse; }))).join(', ');
      var titel = 'Baan ' + i + (klassen ? ', ' + klassen : '');
      var st = banenStatus['baan_' + i] || { oefening: 'A', klaar: 0, totaal: baanDeeln.length, nuHond: 'Wacht op start', laatstGezien: null };
      var tot = st.totaal || baanDeeln.length || 0;
      var pct = tot > 0 ? Math.min(100, Math.round((st.klaar / tot) * 100)) : 0;
      var heeftWarn = openCorr.some(function(m) { return m.baan == i; });
      var tijdStr = 'Nog geen data';
      if (st.laatstGezien) {
        var dt = new Date(st.laatstGezien);
        var minGeleden = Math.floor((Date.now() - dt.getTime()) / 60000);
        tijdStr = 'Laatst gezien ' + dt.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
        if (minGeleden >= 5 && st.klaar < tot) {
          heeftWarn = true;
          tijdStr += ' <span class="warn">(' + minGeleden + ' min geleden, controleer de baan)</span>';
        }
      }

      h += '<button class="c' + (heeftWarn ? ' w' : '') + '" onclick="go(\'l' + i + '\')">' +
        '<b>' + esc(titel) + '</b>' +
        '<div class="m">Oefening ' + esc(st.oefening) + ', ' + st.klaar + ' van ' + tot + '</div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        (st.nuHond && st.nuHond !== 'Klaar' ? '<span class="chip">Nu</span> ' + esc(st.nuHond) : 'Klaar met oefening ' + esc(st.oefening)) +
        '<div class="m" style="margin-top:6px">' + tijdStr + '</div>' +
        '</button>';
    }
    h += '</div>';

    var groepen = getGroepen();
    h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px"><h2 style="margin:0">Voorlopige stand (Som A+B+C in seconden)</h2><button onclick="exporteerUitslagCsv()">Exporteer Uitslag (CSV)</button></div><div class="g" style="margin-top:8px">';
    groepen.forEach(function(g, idx) {
      var top3 = g.lijst.slice(0, 3);
      h += '<button class="c" onclick="go(\'s' + idx + '\')"><b>' + esc(g.titel) + '</b>';
      if (top3.length) {
        top3.forEach(function(d, j) {
          h += '<div style="display:flex;justify-content:space-between;margin-top:4px">' +
            '<span>' + (j + 1) + '. ' + esc(d.naam) + '</span>' +
            '<b style="font-size:19px">' + formatSec(d.totaalMs, d.bm) + '</b></div>';
        });
      } else {
        h += '<div class="m" style="margin-top:6px">Nog geen tijden</div>';
      }
      h += '</button>';
    });
    h += '</div>';

  } else if (v.charAt(0) === 'l') {
    var bNr = +v.slice(1);
    var recs = Object.values(registraties).filter(function(r) { return r && r.baan == bNr; });
    h += back() + '<h2 style="margin-top:4px">Baan ' + bNr + '</h2>';
    if (recs.length) {
      recs.forEach(function(r) {
        h += '<div class="t"><b>' + esc(r.startnummer) + '</b><div>' + esc(r.roepnaam) + ' <span class="m">(Oef. ' + esc(r.oefening) + ')</span></div><b>' + esc(r.tijdTekst) + '</b></div>';
      });
    } else {
      h += '<div class="m">Nog geen geregistreerde tijden op Baan ' + bNr + '.</div>';
    }

  } else if (v.charAt(0) === 's') {
    var grpIdx = parseInt(v.slice(1), 10);
    var grp = getGroepen().slice(grpIdx, grpIdx + 1).pop();
    h += back() + '<h2 style="margin-top:4px">' + esc(grp.titel) + ', volledige stand</h2><div class="m">Som A + B + C in seconden, snelste eerst</div>';
    if (grp.lijst.length) {
      grp.lijst.forEach(function(d, j) {
        h += '<div class="t"><b>' + (j + 1) + '</b><div>' + esc(d.naam) + ' <span class="m">nr ' + esc(d.nr) + '</span><div class="m">A: ' + (d.oef.A ? esc(d.oef.A.txt) : '-') + ' | B: ' + (d.oef.B ? esc(d.oef.B.txt) : '-') + ' | C: ' + (d.oef.C ? esc(d.oef.C.txt) : '-') + '</div></div><b>' + formatSec(d.totaalMs, d.bm) + '</b></div>';
      });
    } else {
      h += '<div class="m" style="margin-top:10px">Nog geen tijden in deze klasse.</div>';
    }

  } else if (v === 'aanm') {
    h += back() + '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">' +
      '<div><h2 style="margin:0">Aanmelding Secretariaat (Art. 2.5)</h2><div class="m">Vink aanwezigen aan (ook laatkomers). Gaat direct naar de klokker.</div></div>' +
      '<button class="pri" onclick="syncAlleBanen()">Synchroniseer alle banen</button></div>';
    if (deelnemersLijst.length) {
      deelnemersLijst.forEach(function(d) {
        h += '<div class="t"><b>B' + esc(d.baan) + '</b><div>#' + esc(d.startnummer) + ' ' + esc(d.roepnaam) + ' <span class="' + (d.betaald ? 'chip-ok' : 'chip-bad') + '">' + (d.betaald ? 'Betaald' : 'Nog betalen') + '</span>' +
          '<div class="m">' + esc(d.stamboom) + ' • ' + esc(d.eigenaar || '-') + ' (' + esc(d.klasse) + ')</div></div>' +
          '<input type="checkbox" class="chk" ' + (d.aanwezig ? 'checked' : '') + ' onchange="toggleAanwezig(' + esc(d.startnummer) + ')"></div>';
      });
    } else {
      h += '<div class="box n"><div class="m">Nog geen deelnemers ingeladen. Gebruik "+ Extra deelnemer" of laad vanuit Beheer.</div></div>';
    }

  } else if (v === 'extra') {
    h += back() + '<div class="box n" style="max-width:600px"><h2 style="margin-top:0">+ Extra deelnemer (Daginschrijving)</h2>' +
      '<div class="row"><div><label>Startnummer</label><input type="number" id="exNr" value="' + (deelnemersLijst.length + 101) + '"></div>' +
      '<div><label>Baan</label><select id="exBaan"><option value="1">Baan 1</option><option value="2">Baan 2</option><option value="3">Baan 3</option><option value="4">Baan 4</option><option value="5">Baan 5</option></select></div></div>' +
      '<div class="row"><div><label>Roepnaam hond</label><input type="text" id="exRoep" placeholder="bijv. Max"></div>' +
      '<div><label>Stamboomnaam</label><input type="text" id="exStam" placeholder="bijv. Max v.d. Waterkant"></div></div>' +
      '<div class="row"><div><label>Naam eigenaar</label><input type="text" id="exEig" placeholder="bijv. J. Jansen"></div>' +
      '<div><label>Geslacht</label><select id="exGesl"><option value="Reu">Reu</option><option value="Teef">Teef</option></select></div></div>' +
      '<div class="row"><div><label>Klasse</label><select id="exKlas"><option value="Open">Open (50m)</option><option value="Jeugd">Jeugd (30m)</option><option value="Veteranen">Veteranen (30m)</option><option value="Stamboomloos">Stamboomloos (30m)</option><option value="Specials">Specials (30m)</option></select></div>' +
      '<div><label>Opvolgend brevet</label><select id="exBrev"><option value="Brevet A">Brevet A</option><option value="Jeugdbrevet">Jeugdbrevet</option><option value="Brevet B">Brevet B</option><option value="Brevet C">Brevet C</option><option value="Brevet D">Brevet D</option><option value="Brevet E">Brevet E</option><option value="Seaman Brevet">Seaman Brevet</option></select></div></div>' +
      '<label style="display:flex;align-items:center;gap:8px;margin:6px 0"><input type="checkbox" id="exBet" checked style="width:auto;margin:0;min-height:auto"> Betaald aan tafel (+ €2,50)</label>' +
      '<label style="display:flex;align-items:center;gap:8px;margin:6px 0 14px"><input type="checkbox" id="exBm" style="width:auto;margin:0;min-height:auto"> Buiten mededinging (*)</label>' +
      '<button class="pri" style="width:100%" onclick="slaExtraOp()">Opslaan en direct naar klokker sturen</button></div>';

   } else if (v === 'nood') {
    var opties = deelnemersLijst.length
      ? deelnemersLijst.map(function(d) { return '<option value="' + esc(d.startnummer) + '">Baan ' + esc(d.baan) + ' | #' + esc(d.startnummer) + ' ' + esc(d.roepnaam) + ' (' + esc(d.klasse) + ')</option>'; }).join('')
      : '<option value="">Geen deelnemers beschikbaar</option>';
    h += back() + '<div class="box n" style="max-width:600px"><h2 style="margin-top:0">Handmatige tijd / weigering invoeren</h2>' +
      '<label>Deelnemer</label><select id="ndHond">' + opties + '</select>' +
      '<label>Oefening</label><select id="ndOef" onchange="var t=document.getElementById(\'ndType\');if(this.value!==\'BREVET\'&&t.value===\'BREVET_OK\')t.value=\'TIJD\';document.getElementById(\'ndVak\').style.display=t.value===\'TIJD\'?\'block\':\'none\'"><option value="A">Oefening A (Object)</option><option value="B">Oefening B (Pop)</option><option value="C">Oefening C (Springen)</option><option value="BREVET">Brevetoefening E t/m J</option></select>' +
      '<label>Resultaat</label><select id="ndType" onchange="if(this.value===\'BREVET_OK\'&&document.getElementById(\'ndOef\').value!==\'BREVET\'){alert(\'Brevet uitgevoerd geldt alleen voor Brevetoefening E t/m J.\');this.value=\'TIJD\';}document.getElementById(\'ndVak\').style.display=this.value===\'TIJD\'?\'block\':\'none\'"><option value="TIJD">Geklokte tijd</option><option value="WEIGERING">Weigering (600,00 sec)</option><option value="BREVET_OK">Brevet uitgevoerd (alleen E–J)</option></select>' +
      '<div id="ndVak"><label>Tijd in cijfers (bijv. 945 = 9,45 sec)</label><input type="tel" id="ndCijf" placeholder="bijv. 1425"></div>' +
      '<button class="pri" style="width:100%" onclick="slaNoodOp()">Resultaat direct toevoegen</button></div>';

  } else if (v === 'meld') {
    h += back();
    if (!openM.length) h += '<div class="m">Geen open meldingen.</div>';
    openM.forEach(function(m) {
      if (m.soort === 'BERICHT') {
        h += '<div class="box n"><div class="m">Baan ' + esc(m.baan) + ', Oefening ' + esc(m.oefening) + '</div><div style="font-size:21px;margin:4px 0 10px">' + esc(m.tekst) + '</div><button onclick="leesBericht(\'' + esc(m.id) + '\')" style="width:100%">Gelezen</button></div>';
      } else {
        h += '<div class="box"><div class="m">Baan ' + esc(m.baan) + ', Oefening ' + esc(m.oefening) + '</div>' +
          '<div style="font-size:22px;font-weight:700;margin:2px 0 8px">Conflict: twee tijden voor ' + esc(m.roepnaam) + ' (nr ' + esc(m.startnummer) + ')</div>' +
          '<div class="m">Eerst geregistreerd</div><div class="big">' + esc(m.oudeTijd) + '</div>' +
          '<div class="m" style="margin-top:6px">Correctie van de klokker</div><div class="big">' + esc(m.nieuweTijd) + '</div>' +
          '<div class="m" style="margin:6px 0 12px">Reden: ' + esc(m.reden) + '. Tot de tafel beslist telt ' + esc(m.oudeTijd) + '.</div>' +
          '<div class="row"><button onclick="beslis(\'' + esc(m.id) + '\', false)">Houd ' + esc(m.oudeTijd) + '</button>' +
          '<button class="pri" onclick="beslis(\'' + esc(m.id) + '\', true)">Neem ' + esc(m.nieuweTijd) + ' over</button></div></div>';
      }
    });


    var bouwSpetter = function(titel, lijst) {
      var s = '<div class="box n"><h2 style="margin-top:0">' + esc(titel) + '</h2>';
      if (!lijst.length) return s + '<div class="m">Nog geen deelnemers binnen mededinging.</div></div>';
      var metTot = lijst.map(function(d) {
        var k = kcmSelecties[d.nr] || 'GEEN';
        return Object.assign({}, d, { kcm: k, tot: d.pnt + (KCM_PUNTEN[k] || 0) });
      }).sort(function(a, b) { return b.tot - a.tot; });

      metTot.forEach(function(d) {
        var opts = Object.entries(KCM_PUNTEN).map(function(e) {
          var kNaam = e.slice(0, 1).pop(), kPnt = e.slice(1, 2).pop();
          return '<option value="' + esc(kNaam) + '" ' + (d.kcm === kNaam ? 'selected' : '') + '>' + esc(kNaam) + ' (+' + kPnt + ')</option>';
        }).join('');
        s += '<div class="t"><b>' + d.tot + '</b><div>' + esc(d.naam) + ' <span class="m">nr ' + esc(d.nr) + ' • Trials: ' + d.pnt + '</span></div>' +
          '<select style="width:auto;margin:0" onchange="setKcm(' + esc(d.nr) + ', this.value)">' + opts + '</select></div>';
      });
      return s + '</div>';
    };

    h += back() + '<div class="g">' + bouwSpetter('Spettertrofee (Open + KCM)', openH) + bouwSpetter('Junior Spettertrofee (Jeugd + KCM)', jeugdH) + '</div>';

  } else if (v === 'hist') {
    var logs = Object.values(logboek).filter(Boolean).sort(function(a, b) { return b.timestamp.localeCompare(a.timestamp); });
    h += back() + '<h2 style="margin-top:4px">Wijzigingen</h2>';
    if (logs.length) {
      h += '<ul class="log">' + logs.map(function(l) {
        var t = new Date(l.timestamp).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
        return '<li>' + t + ' Baan ' + esc(l.baan) + ': ' + esc(l.actie) + '</li>';
      }).join('') + '</ul>';
    } else {
      h += '<div class="m">Nog geen wijzigingen geregistreerd.</div>';
    }
  }

  h += '<div class="foot">NNFC Digitale Waarneming • Reglement Trials 4 oktober 2026</div>';
  document.getElementById('app').innerHTML = h;
}

initFirebase();
draw();
</script>
</body>
</html>
